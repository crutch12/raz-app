<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc><helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" /><link rel="stylesheet" href="./raznos-opportunities.css" /></helmet>
<div class="raznos-card raznos-card-pad"><span class="raznos-text-h3">{{ title }}</span><div class="raznos-segmented"><button type="button" class="{{ moneyClass }}" onClick="{{ money }}">Доход</button><button type="button" class="{{ activityClass }}" onClick="{{ activity }}">Активность</button></div><div class="raznos-opportunity-map" style="height:300px"><svg viewBox="0 0 320 300" aria-hidden="true"><path d="M-10 50L330 220M20 320L260 -10M-10 230L340 60" stroke="white" stroke-width="22" fill="none"/><circle cx="90" cy="75" r="65" fill="#8bd6a0" opacity="0.4"/><circle cx="240" cy="180" r="65" fill="#6bb883" opacity="0.3"/></svg><sc-for list="{{ markers }}" as="m"><div class="raznos-opportunity-map-label" style="{{ m.style }}"><span>{{ m.title }}</span><b>{{ m.value }}</b><span>{{ m.subtitle }}</span></div></sc-for></div><span class="raznos-text-tiny">{{ source }}</span><span class="raznos-text-tiny">Схема районов, не навигационная карта</span></div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Районы на схеме"},"rows":{"editor":null},"source":{"editor":"text","default":"Демонстрационные данные"}}'>class Component extends DCLogic {renderVals(){const active=(this.state||{}).layer==='activity';return {title:this.props.title,source:this.props.source,moneyClass:'raznos-segment'+(!active?' raznos-is-active':''),activityClass:'raznos-segment'+(active?' raznos-is-active':''),money:()=>this.setState({layer:'money'}),activity:()=>this.setState({layer:'activity'}),markers:(this.props.rows||[]).slice(0,3).map((r,i)=>({title:r.district,value:active?r.activity:r.income,subtitle:active?r.activityNote:r.incomeNote,style:'top:'+(12+i*94)+'px;left:'+(12+(i%2)*40)+'px'}))};}}</script></body></html>
