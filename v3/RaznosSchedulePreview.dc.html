<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rsp { box-sizing: border-box; width: 100%; max-width: 100%; text-align: left; background: var(--raznos-surface); border: 1px solid var(--raznos-line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; font: inherit; color: inherit; }
    .rsp:hover { border-color: var(--raznos-ink-3); }
    .rsp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .rsp-title { font: 700 15px var(--raznos-font); color: var(--raznos-ink); }
    .rsp-day { font: 500 12px var(--raznos-font); color: var(--raznos-ink-3); }
    .rsp-slots { display: flex; flex-direction: column; gap: 6px; }
    .rsp-slot { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--raznos-surface-2); }
    .rsp-slot.rsp-slot-plan { background: transparent; border: 1px dashed var(--raznos-line); }
    .rsp-slot.rsp-slot-past { opacity: 0.55; }
    .rsp-slot-time { flex: none; min-width: 88px; font: 600 12px var(--raznos-mono); color: var(--raznos-ink-2); font-variant-numeric: tabular-nums; }
    .rsp-slot-name { flex: 1; min-width: 0; font: 600 14px var(--raznos-font); color: var(--raznos-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rsp-tag { flex: none; font: 600 11.5px var(--raznos-font); color: var(--raznos-ink-3); }
    .rsp-tag.rsp-tag-book { color: var(--raznos-green-deep); }
    .rsp-tag.rsp-tag-pending { color: var(--raznos-amber); }
    .rsp-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid var(--raznos-line); }
    .rsp-goal { font: 500 12px var(--raznos-font); color: var(--raznos-ink-2); }
    .rsp-open { font: 600 13px var(--raznos-font); color: var(--raznos-green-deep); display: flex; align-items: center; gap: 4px; }
  </style>
</helmet>
<button type="button" class="rsp" onClick="{{ open }}" aria-label="{{ aria }}">
  <div class="rsp-head"><span style="display:inline-flex;align-items:center;gap:8px;color:var(--raznos-ink-2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span class="rsp-title">Расписание</span></span><span class="rsp-day">{{ day_label }}</span></div>
  <div class="rsp-slots">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
      <div class="{{ r.cls }}"><span class="rsp-slot-time">{{ r.time }}</span><dc-import name="RaznosIcon" svc="{{ r.svc }}" alt="{{ r.name }}" size="sm"></dc-import><span class="rsp-slot-name">{{ r.name }}</span><span class="{{ r.tag_cls }}">{{ r.tag }}</span></div>
    </sc-for>
  </div>
  <div class="rsp-foot"><span class="rsp-goal">{{ foot_note }}</span><span class="rsp-open">План дня<span class="raznos-row-chevron">›</span></span></div>
</button>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"caps":{"editor":null},"open":{"editor":null},"blocks":{"editor":null},"bookings":{"editor":null},"today":{"editor":"text","default":""},"nowMinutes":{"editor":null},"dayLabel":{"editor":"text","default":"Сегодня"},"$preview":{"width":390,"height":330}}'>
// превью плана на сегодня для хаба Работа: брони из Смен важнее плана, план закрывает свободные часы
// названия и свободный выход идут из профиля сервисов (пропс caps), запасной набор только для показа без приложения
const RSP_CAPS_FALLBACK = { 'yandex-eda': { title: 'Яндекс Еда', modes: ['plan', 'free'] }, samokat: { title: 'Самокат', modes: ['plan'] }, vkusvill: { title: 'ВкусВилл', modes: ['plan'] }, x5: { title: 'X5 Доставка', modes: ['plan'] } };
// план закрывает свободные часы графика свободным выходом, брони из Смен важнее
const RSP_DEMO = [{ from: 9, to: 18, svc: 'yandex-eda' }];
// демо-сегодня: реальная дата устройства
const rspAt = (off) => { const d = new Date(); d.setDate(d.getDate() + off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const RSP_DEMO_BOOKED = [
  { iso: rspAt(0), svc: 'samokat', from: 540, to: 720, status: 'completed' },
  { iso: rspAt(0), svc: 'vkusvill', from: 840, to: 1020, status: 'active' },
  { iso: rspAt(0), svc: 'yandex-eda', from: 1020, to: 1200, status: 'confirmed' }
];
const RSP_TIME = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const open = typeof p.open === 'function' ? p.open : (() => {});
    const today = p.today || rspAt(0);
    const now = p.nowMinutes == null ? 940 : p.nowMinutes;
    const caps = p.caps || RSP_CAPS_FALLBACK;
    const RSP_SVC = {}, RSP_FREE = [];
    Object.keys(caps).forEach((k) => { RSP_SVC[k] = caps[k].title; if (caps[k].modes.indexOf('free') !== -1 && !(caps[k].unverified || []).length) RSP_FREE.push(k); });
    const plan = ((p.blocks && p.blocks.length) ? p.blocks : RSP_DEMO).map((b) => ({ svc: b.svc, from: b.from * 60, to: b.to * 60 }));
    const booked = (p.bookings || RSP_DEMO_BOOKED).filter((b) => b.iso === today && b.status !== 'cancelled' && b.status !== 'missed');
    const edges = plan.concat(booked);
    const start = Math.min.apply(null, edges.map((b) => b.from)), end = Math.max.apply(null, edges.map((b) => b.to));
    // шаг полчаса, в каждом слоте бронь перекрывает план
    const slots = [];
    for (let m = start; m < end; m += 30) {
      const b = booked.find((x) => m >= x.from && m < x.to);
      const pl = b ? null : plan.find((x) => m >= x.from && m < x.to);
      slots.push(b ? { key: 'b' + booked.indexOf(b), svc: b.svc, source: 'booking', status: b.status, m } : (pl ? { key: 'p' + pl.svc, svc: pl.svc, source: 'plan', m } : { key: '', m }));
    }
    const rows = [];
    slots.forEach((sl) => {
      const last = rows[rows.length - 1];
      if (last && last.key === sl.key) { last.to = sl.m + 30; return; }
      rows.push({ key: sl.key, svc: sl.svc, source: sl.source, status: sl.status, from: sl.m, to: sl.m + 30 });
    });
    // прошедшие часы плана без брони не показываем, в них не выходили
    const visible = rows.filter((r) => r.key && !(r.source === 'plan' && r.to <= now)).map((r) => {
      const hours = (r.to - r.from) / 60;
      const pending = r.status === 'requested' || r.status === 'tentative';
      return {
        svc: r.svc, name: RSP_SVC[r.svc] || r.svc, time: RSP_TIME(r.from) + '–' + RSP_TIME(r.to),
        tag: r.source === 'booking' ? ((caps[r.svc] && caps[r.svc].words) || { confirmed: 'бронь', requested: 'заявка' })[pending ? 'requested' : 'confirmed'] : (RSP_FREE.indexOf(r.svc) !== -1 ? 'свободный выход' : 'нужен слот'), need: r.source === 'plan' && RSP_FREE.indexOf(r.svc) === -1, hours,
        tag_cls: 'rsp-tag' + (r.source === 'booking' ? (pending ? ' rsp-tag-pending' : ' rsp-tag-book') : (RSP_FREE.indexOf(r.svc) !== -1 ? ' rsp-tag-book' : ' rsp-tag-pending')),
        cls: 'rsp-slot' + (r.source === 'plan' ? ' rsp-slot-plan' : '') + (r.to <= now ? ' rsp-slot-past' : '')
      };
    });
    const hours = visible.reduce((sum, r) => sum + r.hours, 0);
    const needSlot = visible.filter((r) => r.need).length;
    const dayLabel = p.dayLabel || 'Сегодня';
    return {
      open, day_label: dayLabel,
      rows: visible,
      foot_note: String(hours).replace('.', ',') + ' ч' + (needSlot ? ' · нужно взять слот: ' + needSlot : ''),
      aria: 'Расписание, ' + dayLabel + ', ' + hours + ' часов, открыть план дня'
    };
  }
}
</script></body></html>
