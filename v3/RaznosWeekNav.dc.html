<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    /* одна плашка со стрелками внутри, чтобы не путать с кнопкой назад */
    .rwn { box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 4px; width: 100%; padding: 4px; border-radius: 14px; background: var(--raznos-surface); }
    .rwn-step { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--raznos-ink-2); cursor: pointer; }
    .rwn-step:hover:not(:disabled) { background: var(--raznos-surface-2); color: var(--raznos-ink); }
    .rwn-step:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: -2px; }
    .rwn-step:disabled { color: var(--raznos-line-strong); cursor: default; }
    .rwn-copy { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
    .rwn-copy > b { font: 700 16px var(--raznos-font); color: var(--raznos-ink); }
    .rwn-copy > span { font: 500 12px var(--raznos-font); color: var(--raznos-ink-3); }
    .rwn-link { padding: 0; border: 0; background: none; font: 600 12px var(--raznos-font); color: var(--raznos-green-deep); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .rwn-link:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; border-radius: 4px; }
  </style>
</helmet>
<div class="rwn" role="group" aria-label="Неделя">
  <button type="button" class="rwn-step" onClick="{{ prev }}" disabled="{{ prev_off }}" aria-label="Прошлая неделя"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
  <span class="rwn-copy" aria-live="polite"><b>{{ title }}</b><span>{{ sub }}<sc-if value="{{ has_link }}" hint-placeholder-val="{{ false }}"> · <button type="button" class="rwn-link" onClick="{{ link }}">{{ link_label }}</button></sc-if></span></span>
  <button type="button" class="rwn-step" onClick="{{ next }}" disabled="{{ next_off }}" aria-label="Следующая неделя"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"text","default":""},"offset":{"editor":"number","default":0},"min":{"editor":"number","default":-1},"max":{"editor":"number","default":1},"onChange":{"editor":null},"linkLabel":{"editor":"text"},"onLink":{"editor":null},"$preview":{"width":366,"height":60}}'>
// листание недель пн–вс в Плане: прошлая, эта и следующая
const RWN_MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const off = p.offset || 0;
    const min = p.min != null ? p.min : -1, max = p.max != null ? p.max : 1;
    // без start берём понедельник текущей недели
    const a = p.start ? new Date(p.start + 'T00:00:00') : (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7); })();
    a.setDate(a.getDate() + off * 7);
    const b = new Date(a); b.setDate(b.getDate() + 6);
    const change = (v) => { if (typeof p.onChange === 'function') p.onChange(v); };
    return {
      title: a.getMonth() === b.getMonth() ? a.getDate() + '–' + b.getDate() + ' ' + RWN_MONTHS[b.getMonth()] : a.getDate() + ' ' + RWN_MONTHS[a.getMonth()] + ' – ' + b.getDate() + ' ' + RWN_MONTHS[b.getMonth()],
      sub: off === 0 ? 'эта неделя' : (off === -1 ? 'прошлая неделя' : (off === 1 ? 'следующая неделя' : '')),
      has_link: !!p.linkLabel, link_label: p.linkLabel || '', link: typeof p.onLink === 'function' ? p.onLink : (() => {}),
      prev: () => change(off - 1), next: () => change(off + 1), prev_off: off <= min, next_off: off >= max
    };
  }
}
</script></body></html>
