<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rpn { box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--raznos-surface-2); color: var(--raznos-ink); }
    .rpn.rpn-done { background: color-mix(in oklab, var(--raznos-green) 12%, var(--raznos-surface)); }
    .rpn-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--raznos-surface); color: var(--raznos-green-deep); }
    .rpn-copy { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .rpn-title { font: 650 14px/1.3 var(--raznos-font); }
    .rpn-title-btn { padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
    .rpn-text { font: 500 13px/1.4 var(--raznos-font); color: var(--raznos-ink-2); }
    .rpn-meta { font: 500 11.5px/1.35 var(--raznos-font); color: var(--raznos-ink-3); }
    .rpn-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  </style>
</helmet>
<div class="{{ cls }}" role="status">
  <span class="rpn-icon" aria-hidden="true">
    <sc-if value="{{ is_trend }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></sc-if>
    <sc-if value="{{ is_clock }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg></sc-if>
    <sc-if value="{{ is_swap }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg></sc-if>
    <sc-if value="{{ is_done }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"/></svg></sc-if>
  </span>
  <span class="rpn-copy">
    <sc-if value="{{ has_title_tap }}" hint-placeholder-val="{{ false }}"><button type="button" class="rpn-title rpn-title-btn" onClick="{{ on_title }}">{{ title }}</button></sc-if>
    <sc-if value="{{ no_title_tap }}" hint-placeholder-val="{{ true }}"><span class="rpn-title">{{ title }}</span></sc-if>
    <sc-if value="{{ text }}" hint-placeholder-val="{{ true }}"><span class="rpn-text">{{ text }}</span></sc-if>
    <sc-if value="{{ meta }}" hint-placeholder-val="{{ true }}"><span class="rpn-meta">{{ meta }}</span></sc-if>
    <sc-if value="{{ has_actions }}" hint-placeholder-val="{{ true }}">
      <span class="rpn-actions">
        <sc-if value="{{ action }}" hint-placeholder-val="{{ true }}"><button type="button" class="raznos-btn raznos-btn-primary raznos-btn-small" onClick="{{ on_action }}">{{ action }}</button></sc-if>
        <sc-if value="{{ dismiss }}" hint-placeholder-val="{{ true }}"><button type="button" class="raznos-btn raznos-btn-ghost raznos-btn-small" onClick="{{ on_dismiss }}">{{ dismiss }}</button></sc-if>
      </span>
    </sc-if>
  </span>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","options":["trend","clock","swap","done"],"default":"trend"},"title":{"editor":"text","default":"В 20:00 закончится бронь в Яндекс Еде"},"text":{"editor":"text","default":"Вечером спрос выше обычного на 12%, если остаться до 21:00, ≈ +790 ₽"},"meta":{"editor":"text","default":"По курьерам Разноса за последний час · обновлено 2 мин назад"},"action":{"editor":"text","default":"Остаться до 21:00"},"dismiss":{"editor":"text","default":"Не надо"},"onTitle":{"editor":null},"onAction":{"editor":null},"onDismiss":{"editor":null},"$preview":{"width":366,"height":170}}'>
// подсказка момента решения в умном расписании: одна на день, у окна, к которому относится
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const icon = p.icon || 'trend';
    const pick = (key, def) => (p[key] === undefined ? def : (p[key] || ''));
    const action = pick('action', 'Остаться до 21:00');
    const dismiss = pick('dismiss', 'Не надо');
    return {
      cls: 'rpn' + (icon === 'done' ? ' rpn-done' : ''),
      is_trend: icon === 'trend', is_clock: icon === 'clock', is_swap: icon === 'swap', is_done: icon === 'done',
      title: pick('title', 'В 20:00 закончится бронь в Яндекс Еде'),
      text: pick('text', 'Вечером спрос выше обычного на 12%, если остаться до 21:00, ≈ +790 ₽'),
      meta: pick('meta', 'По курьерам Разноса за последний час · обновлено 2 мин назад'),
      has_title_tap: typeof p.onTitle === 'function', no_title_tap: typeof p.onTitle !== 'function', on_title: typeof p.onTitle === 'function' ? p.onTitle : (() => {}),
      action, dismiss, has_actions: !!(action || dismiss),
      on_action: typeof p.onAction === 'function' ? p.onAction : (() => {}),
      on_dismiss: typeof p.onDismiss === 'function' ? p.onDismiss : (() => {})
    };
  }
}
</script></body></html>
