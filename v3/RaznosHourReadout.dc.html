<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rhr-card { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; border: 1px solid var(--raznos-line); background: var(--raznos-surface); box-shadow: 0 6px 20px rgba(20, 30, 25, 0.1); }
    .rhr-top { display: flex; align-items: baseline; gap: 8px; }
    .rhr-time { font: 800 20px var(--raznos-font); letter-spacing: -0.02em; color: var(--raznos-ink); font-variant-numeric: tabular-nums; }
    .rhr-zone { font: 500 13px var(--raznos-font); color: var(--raznos-ink-3); }
    .rhr-open { margin-left: auto; font: 600 13px var(--raznos-font); color: var(--raznos-green-deep); background: none; border: 0; cursor: pointer; padding: 0; }
    .rhr-list { display: flex; flex-direction: column; gap: 6px; }
    .rhr-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--raznos-surface-2); }
    .rhr-row.rhr-best { background: var(--raznos-green-tint); }
    .rhr-name { flex: 1; font: 600 14px var(--raznos-font); color: var(--raznos-ink); }
    .rhr-tag { font: 600 11px var(--raznos-font); color: var(--raznos-green-deep); }
    .rhr-pay { font: 700 14px var(--raznos-mono); color: var(--raznos-ink); font-variant-numeric: tabular-nums; }
    .rhr-row.rhr-best .rhr-pay { color: var(--raznos-green-deep); }
  </style>
</helmet>
<div class="rhr-card">
  <div class="rhr-top"><span class="rhr-time">{{ time }}</span><span class="rhr-zone">{{ zone }}</span><button type="button" class="rhr-open" onClick="{{ on_open }}">{{ open_label }}</button></div>
  <div class="rhr-list"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="3"><div class="{{ r.cls }}"><dc-import name="RaznosIcon" svc="{{ r.svc }}" alt="{{ r.title }}" size="sm"></dc-import><span class="rhr-name">{{ r.title }}</span><sc-if value="{{ r.best }}" hint-placeholder-val="{{ false }}"><span class="rhr-tag">лучший</span></sc-if><span class="rhr-pay">{{ r.pay }}</span></div></sc-for></div>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":190}}'>
const RHR_DEMO = [
  { svc: 'samokat', title: 'Самокат', pay: '1 480 ₽/ч', best: true },
  { svc: 'vkusvill', title: 'ВкусВилл', pay: '1 320 ₽/ч', best: false },
  { svc: 'yandex-eda', title: 'Яндекс Еда', pay: '1 210 ₽/ч', best: false }
];
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const src = (p.rows && p.rows.length) ? p.rows : RHR_DEMO;
    const rows = src.map((r) => ({
      svc: r.svc,
      title: r.title,
      pay: r.pay,
      best: !!r.best,
      cls: 'rhr-row' + (r.best ? ' rhr-best' : '')
    }));
    return {
      time: p.time != null ? p.time : '18:00',
      zone: p.zone != null ? p.zone : 'Центр',
      rows,
      on_open: typeof p.onOpen === 'function' ? p.onOpen : (() => {}),
      open_label: p.openLabel != null ? p.openLabel : 'Открыть час'
    };
  }
}
</script></body></html>
