<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <link rel="stylesheet" href="./raznos-work.css" />
</helmet>
<div class="raznos-card raznos-card-pad">
  <span class="raznos-text-h3">Лучшие часы</span>
  <div class="raznos-heat-peak"><span class="raznos-heat-peak-fire">🔥</span><span class="raznos-heat-peak-text">Пик недели {{ peak_label }}</span><span class="raznos-num">{{ peak_pay }}</span></div>
  <div class="raznos-heatmap-daynames">
    <span></span>
    <sc-for list="{{ days }}" as="d" hint-placeholder-count="7"><span class="raznos-heatmap-daylabel">{{ d }}</span></sc-for>
  </div>
  <sc-for list="{{ rows }}" as="slotrow" hint-placeholder-count="4">
    <div class="raznos-heatmap-row">
      <span class="raznos-heatmap-rowlabel">{{ slotrow.label }}</span>
      <div class="raznos-heatmap-cells">
        <sc-for list="{{ slotrow.cells }}" as="cell" hint-placeholder-count="7"><span class="{{ cell.cls }}" onClick="{{ cell.tap }}" title="{{ cell.hint }}"></span></sc-for>
      </div>
    </div>
  </sc-for>
  <div class="raznos-heat-detail">
    <span class="raznos-heat-detail-title">{{ sel_title }}</span>
    <span class="raznos-text-small">{{ sel_note }}</span>
  </div>
  <div class="raznos-heat-legend raznos-text-tiny">
    <span><span class="raznos-heat-legend-dot raznos-heat-1"></span>низкий</span>
    <span><span class="raznos-heat-legend-dot raznos-heat-2"></span>средний</span>
    <span><span class="raznos-heat-legend-dot raznos-heat-3"></span>высокий</span>
  </div>
  <p class="raznos-text-tiny">{{ tip }}</p>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":420}}'>
const BH_DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const BH_SLOTS = ['06–12', '12–17', '17–21', '21–06'];
const BH_LEVELS = [
  [1, 2, 2, 1], [1, 2, 3, 1], [1, 2, 2, 1], [1, 2, 3, 2],
  [2, 3, 3, 2], [2, 2, 3, 3], [1, 1, 2, 2]
];
const BH_PAY = { 1: 620, 2: 940, 3: 1320 };
const BH_LVLNAME = { 1: 'низкий', 2: 'средний', 3: 'высокий' };
const BH_TIP = 'Спрос по выполненным заказам участников, тап по ячейке даёт доход в час и лучший сервис';
const bhPay = (lvl, ci) => BH_PAY[lvl] + ci * 8;
const bhSvc = (ci, ri) => ((ci + ri) % 2 === 0 ? 'Самокат' : 'ВкусВилл');

class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const st = this.state || {};
    const set = (patch) => this.setState(patch);

    const days = (p.days && p.days.length) ? p.days : BH_DAYS;
    const slots = (p.slots && p.slots.length) ? p.slots : BH_SLOTS;
    const levels = (p.levels && p.levels.length) ? p.levels : BH_LEVELS;
    const payOf = typeof p.payOf === 'function' ? p.payOf : bhPay;
    const svcOf = typeof p.svcOf === 'function' ? p.svcOf : bhSvc;
    const lvlName = p.lvlName || BH_LVLNAME;
    const tip = p.tip != null ? p.tip : BH_TIP;

    let peak = { ri: 0, ci: 0, lvl: 0 };
    levels.forEach((col, ci) => col.forEach((lvl, ri) => { if (lvl > peak.lvl) peak = { ri, ci, lvl }; }));
    const sel = st.sel || { ri: peak.ri, ci: peak.ci };

    const rows = slots.map((slot, ri) => ({
      label: slot,
      cells: days.map((d, ci) => {
        const lvl = levels[ci][ri];
        const isSel = sel.ri === ri && sel.ci === ci;
        return {
          cls: 'raznos-heat-cell raznos-heat-' + lvl + (isSel ? ' raznos-is-sel' : ''),
          hint: d + ' ' + slot + ': ' + payOf(lvl, ci) + ' ₽/ч',
          tap: () => set({ sel: { ri, ci } })
        };
      })
    }));

    const selLvl = levels[sel.ci][sel.ri];
    return {
      days,
      rows,
      tip,
      peak_label: days[peak.ci] + ' ' + slots[peak.ri],
      peak_pay: '~' + payOf(peak.lvl, peak.ci) + ' ₽/ч',
      sel_title: days[sel.ci] + ' ' + slots[sel.ri] + ' · ~' + payOf(selLvl, sel.ci) + ' ₽/ч',
      sel_note: 'Спрос ' + lvlName[selLvl] + ', лучший ' + svcOf(sel.ci, sel.ri)
    };
  }
}
</script></body></html>
