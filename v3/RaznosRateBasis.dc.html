<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    /* метка меры у числа ₽/ч: одно слово из словаря GLOSSARY-RATES, тихо и мелко, чтобы не спорить с самим числом */
    .rrbs { display: inline-flex; align-items: baseline; gap: 4px; padding: 1px 6px; border-radius: 6px; background: var(--raznos-surface-2); color: var(--raznos-ink-3); font: 600 11px/1.45 var(--raznos-font); letter-spacing: 0.01em; white-space: nowrap; font-variant-numeric: tabular-nums; vertical-align: middle; }
    .rrbs b { font-weight: 700; color: var(--raznos-ink-2); }
    .rrbs.rrbs-mine { background: var(--raznos-green-tint); color: var(--raznos-green-deep); }
    .rrbs.rrbs-mine b { color: var(--raznos-green-deep); }
    /* прогноз и оценка окна ещё не случились: пунктир вместо заливки */
    .rrbs.rrbs-forecast, .rrbs.rrbs-window { background: transparent; box-shadow: inset 0 0 0 1px var(--raznos-line-strong); }
  </style>
</helmet>
<span class="{{ cls }}" title="{{ hint }}">{{ label }}<sc-if value="{{ has_value }}" hint-placeholder-val="{{ false }}"><b>{{ value }}</b></sc-if></span>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["usual","hour","forecast","mine","window"],"default":"usual"},"value":{"editor":"text","default":""},"$preview":{"width":220,"height":40}}'>
// пять мер ₽/ч, слова совпадают со словарём artifacts/design/GLOSSARY-RATES.md
const RRBS_KINDS = {
  usual: ['обычно', 'Медиана сервиса или города за 4 недели, все часы, одна выборка на сервис'],
  hour: ['в этот час', 'Этот час недели по 4 неделям курьеров Разноса'],
  forecast: ['прогноз', 'Будущий час по 4 неделям и погоде, вилкой'],
  mine: ['у вас', 'Ваш факт: начислено за часы на линии'],
  window: ['оценка окна', 'Оценка окна Плана по похожим сменам, ещё не заработано']
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const k = RRBS_KINDS[p.kind] ? p.kind : 'usual';
    const value = p.value == null ? '' : String(p.value);
    return { cls: 'rrbs rrbs-' + k, label: RRBS_KINDS[k][0], hint: RRBS_KINDS[k][1], has_value: !!value, value };
  }
}
</script></body></html>
