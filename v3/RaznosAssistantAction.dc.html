<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .raa { box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--raznos-surface); border: 1px solid var(--raznos-line); border-left: 4px solid var(--raznos-green); }
    .raa-done { border-left-color: var(--raznos-line-strong); background: var(--raznos-surface-2); }
    .raa-title { margin: 0; font: 700 15px/1.3 var(--raznos-font); color: var(--raznos-ink); }
    .raa-note { margin: -6px 0 0; font: 500 13px/1.4 var(--raznos-font); color: var(--raznos-ink-2); }
    .raa-rows { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .raa-rows li { display: grid; grid-template-columns: 1fr; gap: 4px; padding-top: 8px; border-top: 1px solid var(--raznos-line); }
    .raa-rows li:first-child { padding-top: 0; border-top: 0; }
    .raa-label { font: 600 12.5px var(--raznos-font); color: var(--raznos-ink-3); }
    .raa-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .raa-pair > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .raa-pair small { font: 500 11.5px var(--raznos-font); color: var(--raznos-ink-3); }
    .raa-pair b { font: 700 15px/1.3 var(--raznos-font); color: var(--raznos-ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .raa-pair > div + div b { color: var(--raznos-green-deep); }
    .raa-btns { display: flex; gap: 8px; }
    .raa-btns .raznos-btn { flex: 1; min-height: 44px; }
    .raa-result { display: flex; align-items: center; gap: 8px; font: 600 13.5px var(--raznos-font); color: var(--raznos-ink-2); }
    .raa-result svg { flex: none; color: var(--raznos-green-deep); }
  </style>
</helmet>
<div class="{{ cls }}">
  <h3 class="raa-title">{{ title }}</h3>
  <sc-if value="{{ has_note }}" hint-placeholder-val="{{ false }}"><p class="raa-note">{{ note }}</p></sc-if>
  <sc-if value="{{ has_rows }}" hint-placeholder-val="{{ true }}">
    <ul class="raa-rows"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="2"><li>
      <span class="raa-label">{{ r.label }}</span>
      <div class="raa-pair"><div><small>Было</small><b>{{ r.before }}</b></div><div><small>Станет</small><b>{{ r.after }}</b></div></div>
    </li></sc-for></ul>
  </sc-if>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
    <div class="raa-btns">
      <button type="button" class="raznos-btn raznos-btn-primary" onClick="{{ apply }}">{{ apply_label }}</button>
      <button type="button" class="raznos-btn raznos-btn-secondary" onClick="{{ dismiss }}">Не надо</button>
    </div>
  </sc-if>
  <sc-if value="{{ closed }}" hint-placeholder-val="{{ false }}"><div class="raa-result"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span>{{ result }}</span></div></sc-if>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Поставить цель недели 35 000 ₽"},"note":{"editor":"text","default":""},"rows":{"editor":null},"state":{"editor":"enum","default":"","options":["","applied","dismissed","undone"]},"applyLabel":{"editor":"text","default":"Применить"},"onApply":{"editor":null},"onDismiss":{"editor":null},"$preview":{"width":366,"height":260}}'>
// предложение действия от помощника: что изменится (считает приложение), Применить и Не надо; сам помощник ничего не меняет
const RAA_RESULT = { applied: 'Применено', dismissed: 'Вы отказались', undone: 'Вернули как было', failed: 'Не получилось применить' };
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const state = p.state || '';
    const rows = Array.isArray(p.rows) ? p.rows : [];
    return {
      cls: 'raa' + (state ? ' raa-done' : ''),
      title: p.title || '', note: p.note || '', has_note: !!p.note,
      rows, has_rows: rows.length > 0 && !state,
      open: !state, closed: !!state, result: (state === 'applied' && p.doneLabel) || RAA_RESULT[state] || '',
      apply_label: p.applyLabel || 'Применить',
      apply: () => { if (typeof p.onApply === 'function') p.onApply(); },
      dismiss: () => { if (typeof p.onDismiss === 'function') p.onDismiss(); }
    };
  }
}
</script></body></html>
