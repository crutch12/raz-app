<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rdl-row { box-sizing: border-box; width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--raznos-line); border-radius: 12px; background: var(--raznos-surface); color: var(--raznos-ink); font: 500 14px var(--raznos-font); text-align: left; cursor: pointer; }
    .rdl-row:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .rdl-pin { flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; background: var(--raznos-green-tint); color: var(--raznos-green-deep); }
    .rdl-text { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; line-height: 1.3; overflow-wrap: anywhere; }
    .rdl-text > b { font-weight: 700; }
    .rdl-go { flex: none; color: var(--raznos-green-deep); font-weight: 600; }
  </style>
</helmet>
<sc-if value="{{ has_area }}" hint-placeholder-val="{{ true }}">
  <button type="button" class="rdl-row" onClick="{{ open }}" aria-label="{{ aria }}">
    <span class="rdl-pin" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
    <span class="rdl-text"><b>{{ word }}</b>{{ rest }}</span><span class="rdl-go">на карте</span>
    <span class="raznos-row-chevron" aria-hidden="true">›</span>
  </button>
</sc-if>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"placeId":{"editor":"text","default":"sam-ae20d027"},"place":{"editor":"text","default":""},"line":{"editor":"text","default":""},"svc":{"editor":"text","default":"samokat"},"onOpen":{"editor":null},"$preview":{"width":358,"height":60}}'>
// строка места слота или окна плана: по place_id берём тип, адрес и км из справочника мест RaznosApp, тап открывает карту места с территорией
// без place_id остаётся район по тексту окна (свободный выход): сервисы границ зон не отдают, поэтому территорию места рисуем кругом примерно
// расстояние от курьера до района, те же цифры, что в Где выгоднее
const RDL_KM = { tverskoy: 4.6, presnya: 3.1, begovoy: 2.7, khoroshevsky: 3.8, savelovsky: 3.3 };
const RDL_DISTRICTS = [
  { re: /^(Центр|Тверской)$|Тверская|Белорусская/, k: 'tverskoy', name: 'Тверской' },
  { re: /Баррикадная/, k: 'presnya', name: 'Пресненский' }
];
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const RP = typeof window !== 'undefined' ? window.RAZNOS_PLACES : null;
    const pid = p.placeId == null ? '' : String(p.placeId);
    const pl = RP && pid ? RP.get(pid) : null;
    const place = p.place == null ? '' : String(p.place);
    const hit = pl ? RP.district(pid) : RDL_DISTRICTS.find((x) => x.re.test(place));
    const on = !!hit && typeof p.onOpen === 'function';
    // готовую строку места передаёт владелец данных: в Плане км считаются от предыдущего места дня, а не от дома
    const line = pl ? (p.line ? String(p.line) : RP.line(pid)) : '';
    // тип места жирным, остальное строки обычным
    const parts = line.split(' · ');
    const km = hit && RDL_KM[hit.k] ? String(RDL_KM[hit.k]).replace('.', ',') + ' км' : '';
    return {
      has_area: !!hit && (on || p.onOpen === undefined),
      word: pl ? parts[0] : (hit ? hit.name : ''), rest: pl ? (parts.length > 1 ? ' · ' + parts.slice(1).join(' · ') : '') : (km ? ' · ' + km : ''),
      aria: pl ? 'Место на карте: ' + line : (hit ? 'Район ' + hit.name + ' на карте' : ''),
      open: () => { if (on) p.onOpen({ k: hit.k, name: hit.name, place: pl ? line : place, placeId: pl ? pid : '', svc: p.svc || (pl ? pl.svc : ''), center: pl ? RP.at(pid) : null, radius_m: 0 }); }
    };
  }
}
</script></body></html>
