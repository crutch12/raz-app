<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .raznos-code-input { position: relative; }
    /* настоящее поле лежит поверх ячеек и прозрачное: тап по ряду открывает цифровую клавиатуру */
    .raznos-code-input-field { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; font-size: 16px; caret-color: transparent; cursor: text; }
    .raznos-code-input:focus-within .raznos-otp-cell-next { border-color: var(--raznos-green-deep); }
  </style>
</helmet>
<div class="raznos-code-input">
  <div class="raznos-otp-cells">
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="6"><span class="{{ c.cls }}">{{ c.ch }}</span></sc-for>
  </div>
  <input class="raznos-code-input-field" aria-label="Код из сообщения" inputmode="numeric" autocomplete="one-time-code" maxlength="{{ len }}" value="{{ value }}" onInput="{{ on_change }}" />
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{
  "value": { "editor": "text", "default": "1234" },
  "length": { "editor": "int", "default": 6 },
  "error": { "editor": "boolean", "default": false },
  "onChange": { "editor": null },
  "$preview": { "width": 320, "height": 80 }
}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const len = Number(p.length) || 6;
    const value = p.value != null ? String(p.value).replace(/\D/g, '').slice(0, len) : '';
    const error = !!p.error;
    const onChange = typeof p.onChange === 'function' ? p.onChange : (() => {});
    const cells = [];
    for (let i = 0; i < len; i++) {
      cells.push({ ch: value[i] || '·', cls: 'raznos-otp-cell' + (error ? ' raznos-is-error' : '') + (i === value.length ? ' raznos-otp-cell-next' : '') });
    }
    return {
      len,
      value,
      cells,
      on_change: (e) => { const v = (e && e.target ? e.target.value : '').replace(/\D/g, '').slice(0, len); onChange(v); }
    };
  }
}
</script></body></html>
