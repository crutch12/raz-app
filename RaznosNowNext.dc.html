<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rnn { box-sizing: border-box; width: 100%; max-width: 100%; text-align: left; background: var(--raznos-surface); border: 1px solid var(--raznos-line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .rnn-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .rnn-head-copy { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .rnn-title { font: 700 15px var(--raznos-font); color: var(--raznos-ink); }
    .rnn-day { font: 500 12.5px var(--raznos-font); color: var(--raznos-ink-3); font-variant-numeric: tabular-nums; }
    .rnn-row { box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--raznos-surface-2); color: var(--raznos-ink); text-align: left; font: inherit; cursor: pointer; }
    .rnn-row.rnn-row-now { background: var(--raznos-green-tint); }
    .rnn-row:focus-visible, .rnn-open:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .rnn-row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .rnn-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .rnn-row-lab { font: 600 11px var(--raznos-font); text-transform: uppercase; letter-spacing: 0.04em; color: var(--raznos-ink-3); }
    .rnn-row-now .rnn-row-lab { color: var(--raznos-green-deep); }
    .rnn-row-name { font: 700 15px var(--raznos-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rnn-row-sub { font: 500 12px var(--raznos-font); color: var(--raznos-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .rnn-row-place { font: 500 12px var(--raznos-font); color: var(--raznos-ink-2); overflow-wrap: anywhere; }
    .rnn-row-hint { flex: none; font: 600 12px var(--raznos-font); color: var(--raznos-ink-3); font-variant-numeric: tabular-nums; }
    .rnn-row-now .rnn-row-hint { color: var(--raznos-green-deep); }
    .rnn-warning { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; min-height: 44px; border: 0; text-align: left; cursor: pointer; padding: 8px 10px; border-radius: 10px; background: color-mix(in oklab, var(--raznos-red) 10%, var(--raznos-surface)); color: var(--raznos-red); font: 600 12.5px/1.35 var(--raznos-font); }
    .rnn-open { align-self: flex-start; box-sizing: border-box; min-height: 44px; margin: -12px 0; padding: 0 12px 0 0; background: none; border: 0; cursor: pointer; font: 600 13px var(--raznos-font); color: var(--raznos-green-deep); display: inline-flex; align-items: center; gap: 4px; }
    .rnn-warning-act { font: 700 12.5px var(--raznos-font); color: var(--raznos-red); text-decoration: underline; text-underline-offset: 2px; }
  </style>
</helmet>
<div class="rnn">
  <div class="rnn-head">
    <span class="rnn-head-copy"><span class="rnn-title">{{ title }}</span><span class="rnn-day">{{ day_line }}</span></span>
    <sc-if value="{{ is_on }}" hint-placeholder-val="{{ true }}"><button type="button" class="raznos-btn raznos-btn-ghost raznos-btn-small" onClick="{{ on_end }}">Завершить</button></sc-if>
    <sc-if value="{{ is_idle }}" hint-placeholder-val="{{ false }}"><button type="button" class="raznos-btn raznos-btn-primary raznos-btn-small" onClick="{{ on_start }}">Начать смену</button></sc-if>
  </div>
  <sc-for list="{{ rows }}" as="row" hint-placeholder-count="2">
    <button type="button" class="{{ row.cls }}" onClick="{{ row.tap }}" aria-label="{{ row.aria }}">
      <dc-import name="RaznosIcon" svc="{{ row.svc }}" alt="{{ row.title }}" size="md"></dc-import>
      <span class="rnn-row-body"><span class="rnn-row-top"><span class="rnn-row-lab">{{ row.label }}</span><span class="rnn-row-hint">{{ row.hint }}</span></span><span class="rnn-row-name">{{ row.title }}</span><span class="rnn-row-sub">{{ row.subTime }}</span><sc-if value="{{ row.place }}" hint-placeholder-val="{{ true }}"><span class="rnn-row-place">{{ row.place }}</span></sc-if><sc-if value="{{ row.deadline }}" hint-placeholder-val="{{ false }}"><span class="rnn-row-place">{{ row.deadline }}</span></sc-if></span>
    </button>
  </sc-for>
  <sc-if value="{{ warning }}" hint-placeholder-val="{{ true }}"><button type="button" class="rnn-warning" onClick="{{ on_warning }}"><span>{{ warning }}</span><span class="rnn-warning-act">Что делать ›</span></button></sc-if>
  <button type="button" class="rnn-open" onClick="{{ open_plan }}">План дня<span class="raznos-row-chevron">›</span></button>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"text","default":"on"},"dayLine":{"editor":"text","default":"09:00–20:00 · осталось 4 ч 20 мин"},"rows":{"editor":null},"onWarning":{"editor":null},"warning":{"editor":"text","default":"Не успеете доехать: смены встык, дорога ≈ 20 мин"},"onEnd":{"editor":null},"onStart":{"editor":null},"onOpenPlan":{"editor":null},"onOpenShift":{"editor":null},"$preview":{"width":390,"height":260}}'>
// Сейчас и дальше в Сегодня: бронь из Смен важнее плана, план подставляется только в свободные часы
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const noop = () => {};
    const openShift = typeof p.onOpenShift === 'function' ? p.onOpenShift : noop;
    const openPlan = typeof p.onOpenPlan === 'function' ? p.onOpenPlan : noop;
    const state = p.state || 'on';
    const rows = (p.rows || [
      { svc: 'vkusvill', kind: 'now', source: 'booking', title: 'ВкусВилл', time: '14:00–17:00', place: 'Даркстор на Правды, 24', word: 'смена', hint: 'ещё 1 ч 20 мин' },
      { svc: 'yandex-eda', kind: 'next', source: 'booking', title: 'Яндекс Еда', time: '17:00–20:00', place: 'Локация Беговая', word: 'бронь', hint: 'через 1 ч 20 мин' }
    ]).map((row) => {
      const now = row.kind === 'now';
      // слово статуса по профилю сервиса: бронь, заявка, подтверждена
      const label = (now ? 'Сейчас' : 'Дальше') + (row.source === 'booking' ? ' · ' + (row.word || 'бронь') : ' · по плану');
      const sub = [row.time, row.source === 'booking' ? row.place : (row.pay ? row.pay + ' ₽/ч' : '')].filter(Boolean).join(' · ');
      const subTime = [row.time, row.source === 'booking' ? '' : (row.pay ? row.pay + ' ₽/ч' : '')].filter(Boolean).join(' · ');
      return Object.assign({}, row, {
        label, sub, subTime, place: row.source === 'booking' ? row.place : '',
        cls: 'rnn-row' + (now ? ' rnn-row-now' : ''),
        aria: label + ', ' + row.title + ', ' + sub + (row.hint ? ', ' + row.hint : ''),
        // бронь открывает свою шторку в плане, час из плана открывает план дня
        tap: row.source === 'booking' ? () => openShift(row) : openPlan
      });
    });
    const warning = p.warning === undefined ? 'Не успеете доехать: смены встык, дорога ≈ 20 мин' : (p.warning || '');
    return {
      title: state === 'idle' ? 'Смена не начата' : 'Рабочий день',
      day_line: p.dayLine === undefined ? '09:00–20:00 · осталось 4 ч 20 мин' : p.dayLine,
      is_on: state === 'on', is_idle: state === 'idle',
      rows, warning,
      on_end: typeof p.onEnd === 'function' ? p.onEnd : noop,
      on_warning: typeof p.onWarning === 'function' ? p.onWarning : openPlan,
      on_start: typeof p.onStart === 'function' ? p.onStart : noop,
      open_plan: openPlan
    };
  }
}
</script></body></html>
