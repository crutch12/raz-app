<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    /* сделка по рефералке: строка в списке Мои рефералки и вертикальные этапы на экране сделки */
    .rrd-row { display: flex; flex-direction: column; border-bottom: 1px solid var(--raznos-line); font-family: var(--raznos-font); color: var(--raznos-ink); }
    .rrd-row:last-child { border-bottom: 0; }
    .rrd-main { display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 14px; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; }
    .rrd-main:focus-visible, .rrd-btn:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: -2px; border-radius: 12px; }
    .rrd-ico { flex: none; margin-top: 1px; }
    .rrd-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .rrd-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .rrd-title { min-width: 0; font: 650 15px/1.3 var(--raznos-font); overflow-wrap: anywhere; }
    .rrd-pill { flex: none; max-width: 48%; padding: 3px 9px; border-radius: 999px; font: 650 12.5px/1.3 var(--raznos-font); text-align: center; background: var(--raznos-surface-2); color: var(--raznos-ink-2); }
    .rrd-pill.rrd-tone-action { background: var(--raznos-amber-tint); color: var(--raznos-amber); }
    .rrd-pill.rrd-tone-ok { background: var(--raznos-green-tint); color: var(--raznos-green-deep); }
    .rrd-pill.rrd-tone-bad { background: var(--raznos-red-tint); color: var(--raznos-red); }
    .rrd-pill.rrd-tone-muted { color: var(--raznos-ink-3); }
    .rrd-role { font: 500 13px/1.35 var(--raznos-font); color: var(--raznos-ink-3); }
    .rrd-next { font: 500 14px/1.4 var(--raznos-font); color: var(--raznos-ink-2); overflow-wrap: anywhere; }
    .rrd-msg { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font: 400 13.5px/1.4 var(--raznos-font); color: var(--raznos-ink-2); overflow-wrap: anywhere; }
    .rrd-snap { font: 500 12.5px/1.4 var(--raznos-font); color: var(--raznos-ink-3); overflow-wrap: anywhere; }
    .rrd-acts { display: flex; gap: 8px; padding: 0 14px 14px 52px; }
    .rrd-btn { flex: 1; min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--raznos-line-strong); background: var(--raznos-surface); color: var(--raznos-ink); font: 650 15px var(--raznos-font); cursor: pointer; }
    .rrd-btn.rrd-btn-main { border-color: var(--raznos-dark); background: var(--raznos-dark); color: var(--raznos-on-dark); }
    /* этапы */
    .rrd-stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-family: var(--raznos-font); color: var(--raznos-ink); }
    .rrd-stage { position: relative; display: flex; align-items: flex-start; gap: 12px; padding-bottom: 14px; }
    .rrd-stage:last-child { padding-bottom: 0; }
    .rrd-stage:not(:last-child)::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 2px; width: 2px; border-radius: 1px; background: var(--raznos-line); }
    .rrd-stage.rrd-s-done:not(:last-child)::before { background: var(--raznos-green); }
    .rrd-dot { flex: none; width: 24px; height: 24px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid var(--raznos-line-strong); background: var(--raznos-surface); color: #fff; }
    .rrd-s-done .rrd-dot { border-color: var(--raznos-green); background: var(--raznos-green); }
    .rrd-s-current .rrd-dot { border-color: var(--raznos-green-deep); }
    .rrd-s-current .rrd-dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--raznos-green-deep); }
    .rrd-s-bad .rrd-dot { border-color: var(--raznos-red); background: var(--raznos-red); }
    .rrd-stage-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
    .rrd-stage-label { font: 500 15px/1.3 var(--raznos-font); color: var(--raznos-ink-3); }
    .rrd-s-done .rrd-stage-label { color: var(--raznos-ink); }
    .rrd-s-current .rrd-stage-label { font-weight: 700; color: var(--raznos-ink); }
    .rrd-s-bad .rrd-stage-label { font-weight: 700; color: var(--raznos-red); }
    .rrd-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .rrd-stage-note { font: 500 13px/1.35 var(--raznos-font); color: var(--raznos-ink-3); overflow-wrap: anywhere; }
    /* отзыв по закрытой сделке */
    .rrd-review { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--raznos-line); border-radius: 16px; background: var(--raznos-surface); font-family: var(--raznos-font); color: var(--raznos-ink); }
    .rrd-rv-head { display: flex; align-items: center; gap: 10px; }
    .rrd-rv-av { flex: none; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font: 700 16px var(--raznos-font); }
    .rrd-rv-who { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .rrd-rv-who b { font: 650 15px/1.3 var(--raznos-font); }
    .rrd-rv-who span { font: 500 13px/1.35 var(--raznos-font); color: var(--raznos-ink-3); }
    .rrd-rv-text { margin: 0; font: 400 15px/1.45 var(--raznos-font); overflow-wrap: anywhere; }
    .rrd-rv-acts { display: flex; gap: 8px; }
    @media (prefers-reduced-motion: no-preference) {
      .rrd-s-current .rrd-dot { animation: rrd-ring 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s 1 both; }
      @keyframes rrd-ring { from { box-shadow: 0 0 0 0 color-mix(in oklch, var(--raznos-green) 45%, transparent); } to { box-shadow: 0 0 0 10px transparent; } }
      .rrd-s-done .rrd-dot svg { animation: rrd-tick 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      @keyframes rrd-tick { from { transform: scale(0.4); opacity: 0; } }
    }
  </style>
</helmet>
<sc-if value="{{ is_row }}" hint-placeholder-val="{{ true }}">
  <div class="rrd-row">
    <button type="button" class="rrd-main" onClick="{{ open }}" aria-label="{{ aria }}">
      <span class="rrd-ico"><dc-import name="RaznosIcon" svc="{{ svc }}" alt="{{ svc_title }}" size="sm"></dc-import></span>
      <span class="rrd-body">
        <span class="rrd-top"><span class="rrd-title">{{ title }}</span><span class="{{ pill_cls }}">{{ status }}</span></span>
        <span class="rrd-role">{{ role }}</span>
        <span class="rrd-next">{{ next }}</span>
        <sc-if value="{{ has_msg }}" hint-placeholder-val="{{ false }}"><span class="rrd-msg">{{ message }}</span></sc-if>
        <sc-if value="{{ has_snap }}" hint-placeholder-val="{{ false }}"><span class="rrd-snap">{{ snap }}</span></sc-if>
      </span>
    </button>
    <sc-if value="{{ has_acts }}" hint-placeholder-val="{{ false }}"><div class="rrd-acts"><button type="button" class="rrd-btn rrd-btn-main" onClick="{{ accept }}">Принять</button><button type="button" class="rrd-btn" onClick="{{ decline }}">Отклонить</button></div></sc-if>
  </div>
</sc-if>
<sc-if value="{{ is_review }}" hint-placeholder-val="{{ false }}">
  <div class="rrd-review">
    <div class="rrd-rv-head"><span class="rrd-rv-av" style="{{ rv.av }}" aria-hidden="true">{{ rv.letter }}</span><span class="rrd-rv-who"><b>{{ rv.nick }}</b><span>{{ rv.sub }}</span></span></div>
    <span class="raznos-stars" role="img" aria-label="{{ rv.aria }}"><sc-for list="{{ rv.stars }}" as="sg" hint-placeholder-count="5"><svg class="{{ sg.cls }}" viewBox="0 0 20 20" style="width:16px;height:16px"><path d="M10 1l2.7 6 6.3.6-4.8 4.2 1.4 6.2L10 14.9 4.4 18l1.4-6.2L1 7.6l6.3-.6z" /></svg></sc-for></span>
    <sc-if value="{{ rv.has_text }}" hint-placeholder-val="{{ true }}"><p class="rrd-rv-text">{{ rv.text }}</p></sc-if>
    <sc-if value="{{ rv.has_acts }}" hint-placeholder-val="{{ false }}"><div class="rrd-rv-acts"><sc-if value="{{ rv.can_edit }}" hint-placeholder-val="{{ false }}"><button type="button" class="rrd-btn" onClick="{{ rv.edit }}">Изменить один раз</button></sc-if><button type="button" class="rrd-btn" onClick="{{ rv.del }}">Удалить</button></div></sc-if>
  </div>
</sc-if>
<sc-if value="{{ is_full }}" hint-placeholder-val="{{ false }}">
  <ol class="rrd-stages" aria-label="Этапы сделки">
    <sc-for list="{{ stages }}" as="sg" hint-placeholder-count="6">
      <li class="{{ sg.cls }}" aria-current="{{ sg.current }}">
        <span class="rrd-dot" aria-hidden="true"><sc-if value="{{ sg.done }}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if><sc-if value="{{ sg.bad }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></sc-if></span>
        <span class="rrd-stage-txt"><span class="rrd-stage-label">{{ sg.label }}<span class="rrd-sr">{{ sg.sr }}</span></span><sc-if value="{{ sg.has_note }}" hint-placeholder-val="{{ false }}"><span class="rrd-stage-note">{{ sg.note }}</span></sc-if></span>
      </li>
    </sc-for>
  </ol>
</sc-if>
</x-dc><script type="text/x-dc" data-dc-script data-props='{
  "mode": { "editor": "enum", "options": ["row", "full", "review"], "default": "row" },
  "item": { "editor": null },
  "onOpen": { "editor": null },
  "onEdit": { "editor": null },
  "onDelete": { "editor": null },
  "onAccept": { "editor": null },
  "onDecline": { "editor": null },
  "$preview": { "width": 360, "height": 260 }
}'>
// row: item { id, svc, svcTitle, nick, role, status, tone (action, ok, bad, muted), next, message, snap, acts }
// full: item { stages: [{ label, note, state: done, current, todo, bad }] }
// review: item { nick, hue, rating, text, who, date, canEdit, canDelete }
const RRD_SAMPLE_REVIEW = { nick: 'Выдра 27', hue: 200, rating: 5, text: 'Быстро прислала ссылку и ответила на вопросы', who: 'Отзыв о вас', date: '18 октября' };
const RRD_SAMPLE_ROW = { id: 'x', svc: 'kuper', svcTitle: 'Купер', nick: 'Выдра 27', role: 'Вы новичок', status: 'Ссылка получена', tone: 'action', next: 'Зарегистрируйтесь по ссылке', message: '', snap: '', acts: false };
const RRD_SAMPLE_STAGES = [
  { label: 'Отклик', note: '14 окт', state: 'done' }, { label: 'Принят', note: '15 окт', state: 'done' }, { label: 'Ссылка', note: '15 окт', state: 'done' },
  { label: 'Регистрация', note: 'Зарегистрируйтесь по ссылке', state: 'current' }, { label: 'Шаги программы', note: '', state: 'todo' }, { label: 'Итог', note: '', state: 'todo' }
];
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const it = p.item || (p.mode === 'full' ? { stages: RRD_SAMPLE_STAGES } : (p.mode === 'review' ? RRD_SAMPLE_REVIEW : RRD_SAMPLE_ROW));
    const call = (fn) => () => { if (typeof fn === 'function') fn(it.id); };
    const stages = (it.stages || []).map((sg) => ({
      cls: 'rrd-stage rrd-s-' + sg.state, current: sg.state === 'current' ? 'step' : null,
      done: sg.state === 'done', bad: sg.state === 'bad', label: sg.label, note: sg.note || '', has_note: !!sg.note,
      sr: sg.state === 'done' ? ', пройден' : (sg.state === 'current' ? ', сейчас' : (sg.state === 'bad' ? ', не удался' : ', впереди'))
    }));
    const rating = Math.round(it.rating || 0);
    const rv = {
      av: 'background:oklch(0.93 0.05 ' + (it.hue || 200) + ');color:oklch(0.38 0.11 ' + (it.hue || 200) + ')', letter: (it.nick || '').slice(0, 1), nick: it.nick || '',
      sub: [it.who, it.date].filter(Boolean).join(' · '), aria: 'Оценка ' + rating + ' из 5',
      stars: [1, 2, 3, 4, 5].map((i) => ({ cls: 'raznos-star' + (i <= rating ? ' raznos-is-on' : '') })), text: it.text || '', has_text: !!it.text,
      has_acts: !!it.canDelete, can_edit: !!it.canEdit, edit: () => { if (typeof p.onEdit === 'function') p.onEdit(it.id); }, del: () => { if (typeof p.onDelete === 'function') p.onDelete(it.id); }
    };
    return {
      is_row: p.mode !== 'full' && p.mode !== 'review', is_full: p.mode === 'full', is_review: p.mode === 'review', rv, stages,
      svc: it.svc || 'raznos', svc_title: it.svcTitle || '', title: (it.svcTitle || '') + (it.nick ? ' · ' + it.nick : ''),
      role: it.role || '', status: it.status || '', pill_cls: 'rrd-pill' + (it.tone ? ' rrd-tone-' + it.tone : ''),
      next: it.next || '', message: it.message || '', has_msg: !!it.message, snap: it.snap || '', has_snap: !!it.snap, has_acts: !!it.acts,
      aria: [it.svcTitle, it.nick, it.role, it.status, it.next].filter(Boolean).join('. '),
      open: call(p.onOpen), accept: call(p.onAccept), decline: call(p.onDecline)
    };
  }
}
</script></body></html>
