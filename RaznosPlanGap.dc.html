<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rpg { box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; border: 1.5px dashed color-mix(in oklab, var(--raznos-green) 55%, var(--raznos-line-strong)); background: color-mix(in oklab, var(--raznos-green) 5%, var(--raznos-surface)); }
    .rpg-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .rpg-time { font: 700 13px var(--raznos-mono); color: var(--raznos-ink); font-variant-numeric: tabular-nums; }
    .rpg-len { font: 500 12.5px var(--raznos-font); color: var(--raznos-ink-3); }
    .rpg-best { display: flex; align-items: center; gap: 10px; width: 100%; padding: 0; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .rpg-best:focus-visible, .rpg-more:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 3px; border-radius: 8px; }
    .rpg-copy { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rpg-title { font: 650 15px var(--raznos-font); color: var(--raznos-ink); }
    .rpg-sub { font: 500 12px/1.3 var(--raznos-font); color: var(--raznos-ink-3); }
    .rpg-gain { font: 700 14px var(--raznos-font); color: var(--raznos-green-deep); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rpg-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .rpg-more { padding: 6px 0; border: 0; background: none; font: 600 13px var(--raznos-font); color: var(--raznos-ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .rpg-more svg { transition: transform .2s; }
    .rpg-more.raznos-is-open svg { transform: rotate(180deg); }
    .rpg-empty { font: 500 12.5px var(--raznos-font); color: var(--raznos-ink-3); }
  </style>
</helmet>
<div class="rpg">
  <div class="rpg-head"><span class="rpg-time">{{ from }}–{{ to }}</span><span class="rpg-len">{{ len_label }}</span></div>
  <sc-if value="{{ has_best }}" hint-placeholder-val="{{ true }}">
    <button type="button" class="rpg-best" onClick="{{ on_tap }}" aria-label="{{ aria }}">
      <dc-import name="RaznosIcon" svc="{{ svc }}" alt="{{ title }}" size="sm"></dc-import>
      <span class="rpg-copy"><span class="rpg-title">{{ title }}</span><span class="rpg-sub">{{ sub }}</span></span>
      <span class="rpg-gain">{{ gain }}</span>
    </button>
    <div class="rpg-foot">
      <sc-if value="{{ has_more }}" hint-placeholder-val="{{ true }}"><button type="button" class="{{ more_cls }}" onClick="{{ on_more }}" aria-expanded="{{ open }}">{{ more }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></sc-if>
      <sc-if value="{{ no_more }}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
      <button type="button" class="raznos-btn raznos-btn-primary raznos-btn-small" onClick="{{ on_action }}">{{ action }}</button>
    </div>
  </sc-if>
  <sc-if value="{{ no_best }}" hint-placeholder-val="{{ false }}"><span class="rpg-empty">Свободно, выйти некуда</span></sc-if>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"from":{"editor":"text","default":"18:00"},"to":{"editor":"text","default":"22:00"},"svc":{"editor":"text","default":"yandex-eda"},"title":{"editor":"text","default":"Яндекс Еда"},"sub":{"editor":"text","default":"Центр · свободный выход · ≈ 800 ₽/ч"},"gain":{"editor":"text","default":"+3 200 ₽"},"action":{"editor":"text","default":"Добавить"},"more":{"editor":"text","default":"Ещё 2"},"open":{"editor":"boolean"},"onTap":{"editor":null},"onAction":{"editor":null},"onMore":{"editor":null},"$preview":{"width":366,"height":150}}'>
// свободный промежуток в расписании и лучшее, чем его занять, остальные варианты раскрываются ниже
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    // значения по умолчанию для галереи, в приложении всё приходит пропсами
    const from = p.from || '18:00', to = p.to || '22:00';
    const title = p.title == null ? 'Яндекс Еда' : p.title;
    const toMin = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
    const len = Math.max(0, toMin(to) - toMin(from));
    const h = Math.floor(len / 60), m = len % 60;
    const fn = (f) => (typeof f === 'function' ? f : () => {});
    const hasBest = title !== '';
    return {
      from, to,
      len_label: 'свободно ' + (h ? h + ' ч' : '') + (m ? ' ' + m + ' мин' : ''),
      has_best: hasBest, no_best: !hasBest,
      svc: p.svc || 'yandex-eda', title, sub: p.sub == null ? 'Центр · свободный выход · ≈ 800 ₽/ч' : p.sub, gain: p.gain == null ? '+3 200 ₽' : p.gain,
      aria: title + ', ' + (p.gain || '') + ' к неделе, подробнее',
      action: p.action || 'Добавить', more: p.more == null ? 'Ещё 2' : p.more, has_more: p.more == null || !!p.more, no_more: p.more != null && !p.more, open: !!p.open,
      more_cls: 'rpg-more' + (p.open ? ' raznos-is-open' : ''),
      on_tap: fn(p.onTap), on_action: fn(p.onAction), on_more: fn(p.onMore)
    };
  }
}
</script></body></html>
