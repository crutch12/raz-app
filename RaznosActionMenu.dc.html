<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .ram-back { position: fixed; inset: 0; z-index: 40; background: transparent; border: 0; padding: 0; margin: 0; cursor: default; }
    .ram { position: absolute; z-index: 41; right: 0; top: calc(100% + 4px); min-width: 200px; display: flex; flex-direction: column; padding: 6px; border-radius: 14px; background: var(--raznos-surface); border: 1px solid var(--raznos-line); box-shadow: 0 12px 32px rgba(20, 25, 40, 0.18); }
    .ram-item { box-sizing: border-box; width: 100%; min-height: 44px; display: flex; align-items: center; padding: 0 12px; border: 0; border-radius: 10px; background: none; font: 600 14px var(--raznos-font); color: var(--raznos-ink); text-align: left; cursor: pointer; }
    .ram-item:hover, .ram-item:active { background: var(--raznos-surface-2); }
    .ram-item:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: -2px; }
    /* меню раскрывается от угла кнопки, закрытие играет RaznosApp */
    .ram { transform-origin: top right; animation: raznos-fade-in .14s cubic-bezier(.16, 1, .3, 1) both; }
    @media (prefers-reduced-motion: no-preference) {
      .ram { animation-name: ram-in; }
      @keyframes ram-in { from { opacity: 0; transform: scale(.92); } }
    }
  </style>
</helmet>
<button type="button" class="ram-back" onClick="{{ on_close }}" aria-label="Закрыть меню"></button>
<div class="ram" role="menu">
  <sc-for list="{{ rows }}" as="it" hint-placeholder-count="4">
    <button type="button" class="ram-item" role="menuitem" onClick="{{ it.tap }}">{{ it.label }}</button>
  </sc-for>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"items":{"editor":null},"onPick":{"editor":null},"onClose":{"editor":null},"$preview":{"width":260,"height":240}}'>
// контекстное меню у кнопки, родитель с position: relative, пункты приходят списком { key, label }
const RAM_DEMO = [
  { key: 'tip', label: 'Чаевые' },
  { key: 'expense', label: 'Расходы' },
  { key: 'review', label: 'Отзыв о заказе' },
  { key: 'note', label: 'Заметка' }
];
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const noop = () => {};
    const onPick = typeof p.onPick === 'function' ? p.onPick : noop;
    const src = (p.items && p.items.length) ? p.items : RAM_DEMO;
    return {
      rows: src.map((it) => ({ label: it.label, tap: () => onPick(it.key) })),
      on_close: typeof p.onClose === 'function' ? p.onClose : noop
    };
  }
}
</script></body></html>
