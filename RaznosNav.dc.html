<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" /><style>.raznos-nav-tab { position: relative; } .raznos-nav-dot { position: absolute; top: 5px; left: calc(50% + 7px); width: 9px; height: 9px; border-radius: 50%; background: var(--raznos-red); border: 2px solid var(--raznos-surface); }</style></helmet>
      <div class="raznos-bottom-nav">
        <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="5">
          <button type="button" class="{{ tab.tabClass }}" onClick="{{ tab.onTap }}" aria-current="{{ tab.current }}" aria-label="{{ tab.aria }}">
            <sc-if value="{{ tab.hasDot }}" hint-placeholder-val="{{ false }}"><span class="raznos-nav-dot" aria-hidden="true"></span></sc-if>
            <svg class="raznos-nav-glyph" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <sc-if value="{{ tab.isHome }}" hint-placeholder-val="{{ true }}"><path d="M4 11.5L12 4l8 7.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M6 10v9h12v-9" stroke-linecap="round" stroke-linejoin="round" /></sc-if>
              <sc-if value="{{ tab.isWork }}"><rect x="4" y="5.5" width="16" height="14" rx="2.5" /><path d="M8.5 3.5v4M15.5 3.5v4M4 10h16" stroke-linecap="round" /><path d="M9 14.6l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" /></sc-if>
              <sc-if value="{{ tab.isStats }}"><path d="M5 19V10M12 19V5M19 19v-7" stroke-linecap="round" /></sc-if>
              <sc-if value="{{ tab.isMarket }}"><circle cx="12" cy="12" r="8.5" /><path d="M15.4 8.6l-1.9 4.9-4.9 1.9 1.9-4.9z" stroke-linejoin="round" /></sc-if>
              <sc-if value="{{ tab.isProfile }}"><circle cx="12" cy="8" r="3.4" /><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" stroke-linecap="round" /></sc-if>
              <sc-if value="{{ tab.isFavorites }}"><path d="M12 19.5l-6.9-6.7a4.2 4.2 0 0 1 6-6l0.9 0.9 0.9-0.9a4.2 4.2 0 0 1 6 6z" stroke-linejoin="round" /></sc-if>
              <sc-if value="{{ tab.isRaznosiers }}"><circle cx="8" cy="9" r="2.6" /><circle cx="16" cy="9" r="2.6" /><path d="M3 19c0.8-2.8 2.6-4.3 5-4.3s4.2 1.5 5 4.3M11 19c0.8-2.8 2.6-4.3 5-4.3s4.2 1.5 5 4.3" stroke-linecap="round" /></sc-if>
            </svg>
            {{ tab.label }}
          </button>
        </sc-for>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{
      "role": { "editor": "enum", "default": "courier", "options": ["courier", "user"] },
      "active": { "editor": "text", "default": "home" },
      "dot": { "editor": "text", "default": "" },
      "onNavigate": { "editor": null },
      "$preview": { "width": 390, "height": 120 }
    }'>
      class Component extends DCLogic {
        renderVals() {
          const p = this.props || {};
          const role = p.role || 'courier';
          const active = p.active || 'home';
          const onNavigate = p.onNavigate || (() => {});
          // точка на вкладках, где есть непросмотренное, ключи вкладок строкой через запятую
          const dots = String(p.dot || '').split(',');
          const courierTabs = [
            { key: 'home', label: 'Сегодня', icon: 'isHome' },
            { key: 'work', label: 'План', icon: 'isWork' },
            { key: 'stats', label: 'Результаты', icon: 'isStats' },
            { key: 'market', label: 'Рынок', icon: 'isMarket' },
            { key: 'profile', label: 'Профиль', icon: 'isProfile' }
          ];
          const userTabs = [
            { key: 'home', label: 'Витрина', icon: 'isHome' },
            { key: 'market', label: 'Рынок', icon: 'isMarket' },
            { key: 'favorites', label: 'Избранное', icon: 'isFavorites' },
            { key: 'couriers', label: 'Курьеры', icon: 'isRaznosiers' },
            { key: 'profile', label: 'Профиль', icon: 'isProfile' }
          ];
          const list = role === 'user' ? userTabs : courierTabs;
          return {
            tabs: list.map((t) => {
              const isActive = active === t.key;
              const row = {
                label: t.label,
                hasDot: dots.indexOf(t.key) !== -1,
                aria: dots.indexOf(t.key) !== -1 ? t.label + ', есть новое' : t.label,
                current: isActive ? 'page' : 'false',
                tabClass: isActive ? 'raznos-nav-tab raznos-is-active' : 'raznos-nav-tab',
                onTap: () => onNavigate(t.key),
                isHome: false, isWork: false, isStats: false, isMarket: false, isProfile: false, isFavorites: false, isRaznosiers: false
              };
              row[t.icon] = true;
              return row;
            })
          };
        }
      }
    </script>
  </body>
</html>
