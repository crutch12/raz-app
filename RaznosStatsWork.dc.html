<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" /><link rel="stylesheet" href="./raznos-statistics.css" /></helmet>
<section class="raznos-stats-work-card" aria-label="Как работали">
  <h2 class="raznos-stats-section-title">{{ head }} <em>{{ head_accent }}</em>{{ head_tail }}</h2>
  <div class="raznos-stats-work-tiles">
    <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="3">
      <div class="raznos-stats-work-tile"><b>{{ t.big }}</b><span>{{ t.label }}</span><sc-if value="{{ t.sub }}" hint-placeholder-val="{{ false }}"><small>{{ t.sub }}</small></sc-if></div>
    </sc-for>
  </div>
  <sc-if value="{{ has_time }}" hint-placeholder-val="{{ true }}">
    <div class="raznos-stats-work-time">
      <button type="button" class="raznos-stats-work-time-head" onClick="{{ on_open }}"><span>На линии</span><b>{{ time_total }}</b><sc-if value="{{ has_open }}" hint-placeholder-val="{{ true }}"><svg class="raznos-stats-head-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></sc-if></button>
      <sc-if value="{{ has_bar }}" hint-placeholder-val="{{ true }}">
        <div class="raznos-stats-work-bar" aria-hidden="true"><sc-for list="{{ parts }}" as="pt" hint-placeholder-count="2"><i class="{{ pt.cls }}" style="{{ pt.style }}"></i></sc-for></div>
        <div class="raznos-stats-work-legend"><sc-for list="{{ parts }}" as="pt" hint-placeholder-count="2"><span><i class="{{ pt.cls }}" aria-hidden="true"></i>{{ pt.label }} <b>{{ pt.hours }}</b></span></sc-for></div>
      </sc-if>
      <sc-if value="{{ has_booked }}" hint-placeholder-val="{{ true }}"><p class="raznos-stats-work-booked">{{ booked_line }}</p></sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ has_chips }}" hint-placeholder-val="{{ false }}"><div class="raznos-stats-work-chips"><sc-for list="{{ chips }}" as="c" hint-placeholder-count="1"><span class="raznos-stats-work-chip">{{ c }}</span></sc-for></div></sc-if>
</section>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"work":{"editor":null},"onOpenTime":{"editor":null},"$preview":{"width":360,"height":300}}'>
// как работали за период: три плитки, одна полоса времени на линии (с заказами и ожидание), брони и свободный выход строкой, заявки и отмены плашками
const RSW_DEMO = { orders: 17, routes: 14, routesMulti: 2, shifts: 2, lineHours: 6, withOrderHours: 4.2, bookedHours: 4.7, freeHours: 1.3, asked: 0, lost: 0 };
const rswH = (v) => String(Math.round(v * 10) / 10).replace('.', ',') + ' ч';
const rswPl = (n, a, b, c) => { const m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : (m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c)); };
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const w = p.work || RSW_DEMO;
    const word = (n, a, b, c) => rswPl(n, a, b, c).replace(/^\d+ /, '');
    const tiles = [{ big: String(w.orders), label: word(w.orders, 'заказ', 'заказа', 'заказов') }];
    if (w.routes != null && w.routes !== w.orders) tiles.push({ big: String(w.routes), label: word(w.routes, 'маршрут', 'маршрута', 'маршрутов'), sub: w.routesMulti ? rswPl(w.routesMulti, 'мультизаказ', 'мультизаказа', 'мультизаказов') : '' });
    if (w.shifts) tiles.push({ big: String(w.shifts), label: word(w.shifts, 'смена', 'смены', 'смен'), sub: 'по брони' });
    const line = w.lineHours || 0;
    const withOrder = w.withOrderHours == null ? null : Math.min(w.withOrderHours, line);
    const wait = withOrder == null ? 0 : Math.max(0, line - withOrder);
    const share = withOrder == null || line <= 0 ? null : Math.round(withOrder * 100 / line);
    const parts = withOrder == null ? [] : [{ cls: 'raznos-is-with-order', label: 'с заказами', hours: rswH(withOrder) + ' · ' + share + '%', style: 'flex:' + Math.max(withOrder, 0.01) }]
      .concat(wait > 0 ? [{ cls: 'raznos-is-waiting', label: 'ожидание заказа', hours: rswH(wait), style: 'flex:' + wait }] : []);
    const booked = Math.min(w.bookedHours || 0, line), free = Math.max(0, w.freeHours || 0);
    const bookedLine = [].concat(booked > 0 ? ['в бронях ' + rswH(booked)] : [], free >= 0.5 ? ['свободный выход ' + rswH(free)] : []).join(', ');
    const chips = [].concat(w.asked ? ['Заявки без ответа: ' + w.asked] : [], w.lost ? ['Отменены или пропущены: ' + w.lost] : []);
    return {
      // заголовок отвечает, как прошло время, если доля с заказами известна
      head: share == null ? 'Как работали' : 'С заказами', head_accent: share == null ? '' : share + '%', head_tail: share == null ? '' : ' времени',
      tiles, has_time: line > 0, time_total: rswH(line), has_bar: parts.length > 0, parts, has_booked: bookedLine !== '', booked_line: bookedLine.charAt(0).toUpperCase() + bookedLine.slice(1),
      // в подробном экране времени блок уже открыт, стрелку не показываем
      has_open: typeof p.onOpenTime === 'function', on_open: typeof p.onOpenTime === 'function' ? p.onOpenTime : (() => {}),
      chips, has_chips: chips.length > 0
    };
  }
}
</script></body></html>
