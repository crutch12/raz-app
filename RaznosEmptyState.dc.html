<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" /></helmet>
      <div class="{{ rootClass }}">
        <sc-if value="{{ isBell }}" hint-placeholder-val="{{ false }}"><span class="raznos-empty-glyph" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span></sc-if>
        <sc-if value="{{ isTextGlyph }}" hint-placeholder-val="{{ true }}"><span class="raznos-empty-glyph">{{ glyph }}</span></sc-if>
        <span class="raznos-text-h3">{{ title }}</span>
        <sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}"><p class="raznos-text-small">{{ text }}</p></sc-if>
        <sc-if value="{{ hasAction }}" hint-placeholder-val="{{ true }}"><button type="button" class="{{ btnClass }}" onClick="{{ onAction }}">{{ actionLabel }}</button></sc-if>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{
      "glyph": { "editor": "text", "default": "" },
      "title": { "editor": "text", "default": "Заказов пока нет" },
      "text": { "editor": "text", "default": "" },
      "actionLabel": { "editor": "text", "default": "" },
      "actionKind": { "editor": "enum", "default": "secondary", "options": ["secondary", "primary"] },
      "actionSmall": { "editor": "boolean", "default": false },
      "compact": { "editor": "boolean", "default": false },
      "onAction": { "editor": null },
      "$preview": { "width": 360, "height": 260 }
    }'>
      // пустое состояние: сота с символом, заголовок, одна строка и одно необязательное действие
      // glyph: символ в соте, bell рисует колокольчик, пусто убирает соту
      class Component extends DCLogic {
        renderVals() {
          const p = this.props || {};
          const glyph = p.glyph || '';
          return {
            rootClass: 'raznos-empty-state' + (p.compact ? ' raznos-empty-state-compact' : ''),
            isBell: glyph === 'bell',
            isTextGlyph: !!glyph && glyph !== 'bell',
            glyph,
            title: p.title || '',
            text: p.text || '',
            hasText: !!p.text,
            actionLabel: p.actionLabel || '',
            hasAction: !!p.actionLabel,
            btnClass: 'raznos-btn ' + (p.actionKind === 'primary' ? 'raznos-btn-primary' : 'raznos-btn-secondary') + (p.actionSmall ? ' raznos-btn-small' : ''),
            onAction: typeof p.onAction === 'function' ? p.onAction : (() => {})
          };
        }
      }
    </script>
  </body>
</html>
