<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rcs-layer { align-items: flex-end; padding: 0; }
    .rcs-sheet { box-sizing: border-box; width: 100%; max-height: 92%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 8px 20px 18px; border-radius: 22px 22px 0 0; background: var(--raznos-surface); color: var(--raznos-ink); box-shadow: 0 -18px 48px rgba(20, 25, 40, 0.2); }
    .rcs-handle { width: 38px; height: 4px; align-self: center; flex: none; border-radius: 999px; background: var(--raznos-line-strong); }
    .rcs-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -6px; }
    .rcs-head h2 { margin: 0; font: 700 19px/1.2 var(--raznos-font); letter-spacing: -0.01em; }
    .rcs-close { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 12px; background: var(--raznos-surface-2); color: var(--raznos-ink); cursor: pointer; }
    .rcs-close:focus-visible, .rcs-choice:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .rcs-lead { margin: -4px 0 0; font: 500 13px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    .rcs-choice { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border: 1px solid var(--raznos-line-strong); border-radius: 14px; background: var(--raznos-surface); text-align: left; font: inherit; color: var(--raznos-ink); cursor: pointer; }
    .rcs-choice-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .rcs-choice-copy > b { font: 700 15px/1.3 var(--raznos-font); }
    .rcs-choice-copy > span { font: 500 12.5px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    .rcs-choice > svg { flex: none; color: var(--raznos-ink-3); }
    @media (prefers-reduced-motion: no-preference) {
      .rcs-sheet { animation: rcs-in .24s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes rcs-in { from { transform: translateY(100%); } to { transform: none; } }
    }
  </style>
</helmet>
<div class="raznos-dialog-layer rcs-layer" onClick="{{ close }}">
  <section class="rcs-sheet" role="dialog" aria-modal="true" aria-label="{{ title }}" onClick="{{ stop }}">
    <span class="rcs-handle" aria-hidden="true"></span>
    <div class="rcs-head"><h2>{{ title }}</h2><button type="button" class="rcs-close" onClick="{{ close }}" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="rcs-lead">{{ lead }}</p>
    <sc-for list="{{ choices }}" as="c" hint-placeholder-count="2"><button type="button" class="rcs-choice" onClick="{{ c.tap }}"><span class="rcs-choice-copy"><b>{{ c.title }}</b><span>{{ c.note }}</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></sc-for>
    <button type="button" class="raznos-btn raznos-btn-ghost" onClick="{{ close }}">Закрыть</button>
  </section>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"aSvc":{"editor":"text","default":"vkusvill"},"aTitle":{"editor":"text","default":"ВкусВилл"},"aTo":{"editor":null},"bSvc":{"editor":"text","default":"yandex-eda"},"bTitle":{"editor":"text","default":"Яндекс Еда"},"bFrom":{"editor":null},"travel":{"editor":null},"rate":{"editor":null},"onLeave":{"editor":null},"onLate":{"editor":null},"onClose":{"editor":null},"$preview":{"width":390,"height":420}}'>
// конфликт между бронями: два действия по сути, оба ведут в приложение сервиса, брони Разнос сам не меняет
const RCS_GEN = { 'yandex-eda': 'Яндекс Еды', samokat: 'Самоката', vkusvill: 'ВкусВилла', x5: 'X5 Доставки', dodo: 'Додо', kuper: 'Купера', 'yandex-lavka': 'Яндекс Лавки' };
const RCS_ACC = { 'yandex-eda': 'Яндекс Еду', samokat: 'Самокат', vkusvill: 'ВкусВилл', x5: 'X5 Доставку', dodo: 'Додо', kuper: 'Купер', 'yandex-lavka': 'Яндекс Лавку' };
const rcsTime = (m) => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.round(m % 60)).padStart(2, '0');
const rcsFmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const fn = (f) => (typeof f === 'function' ? f : () => {});
    const aTitle = p.aTitle || 'ВкусВилл', bTitle = p.bTitle || 'Яндекс Еда';
    const aTo = p.aTo == null ? 1020 : p.aTo, bFrom = p.bFrom == null ? 1020 : p.bFrom, travel = p.travel || 20;
    const gap = bFrom - aTo;
    // сколько минут не хватает до дороги: на столько уйти раньше или опоздать
    const need = Math.max(1, travel - gap);
    const gen = (svc, t) => RCS_GEN[svc] || ('смены ' + t), acc = (svc, t) => RCS_ACC[svc] || t;
    const loss = p.rate ? Math.round(p.rate * need / 60 / 10) * 10 : 0;
    return {
      title: gap < 0 ? 'Смены пересекаются' : 'Не успеете доехать',
      lead: aTitle + ' до ' + rcsTime(aTo) + ', ' + bTitle + ' с ' + rcsTime(bFrom) + (gap < 0 ? '' : ', дорога ≈ ' + travel + ' мин'),
      choices: [
        { title: 'Уйти из ' + gen(p.aSvc, aTitle) + ' в ' + rcsTime(aTo - need), note: 'Откроем приложение ' + gen(p.aSvc, aTitle) + ', сократить смену можно только там', tap: fn(p.onLeave) },
        { title: 'Опоздаю на ' + need + ' мин в ' + acc(p.bSvc, bTitle), note: 'Начнёте в ' + rcsTime(bFrom + need) + (loss ? ', потеряете ≈ ' + rcsFmt(loss) + ' ₽' : '') + '', tap: fn(p.onLate) }
      ],
      close: fn(p.onClose), stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); }
    };
  }
}
</script></body></html>
