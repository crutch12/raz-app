<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rac-wrap { box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .rac-sum { box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--raznos-surface); border: 1px solid var(--raznos-line); }
    .rac-sum-title { margin: 0; font: 700 15px/1.3 var(--raznos-font); color: var(--raznos-ink); }
    .rac-sum-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .rac-sum-big { font: 800 24px var(--raznos-font); letter-spacing: -0.02em; color: var(--raznos-ink); font-variant-numeric: tabular-nums; }
    .rac-lines { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .rac-lines li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font: 500 14px/1.35 var(--raznos-font); color: var(--raznos-ink-2); }
    .rac-lines li > b { font: 700 14px var(--raznos-font); color: var(--raznos-ink); font-variant-numeric: tabular-nums; text-align: right; }
    .rac-lines li > b.rac-minus { color: var(--raznos-red); }
    .rac-note { margin: 0; font: 500 12.5px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    .rac-open { align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; padding: 0 4px; border: 0; background: none; color: var(--raznos-green-deep); font: 650 14px var(--raznos-font); cursor: pointer; }
    .rac-open:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; border-radius: 6px; }
    .rac-list { display: flex; flex-direction: column; gap: 8px; }
  </style>
</helmet>
<div class="rac-wrap">
  <sc-if value="{{ is_day_goal }}" hint-placeholder-val="{{ false }}"><dc-import name="RaznosDayGoal" dcProps="{{ props }}"></dc-import></sc-if>
  <sc-if value="{{ is_week_goal }}" hint-placeholder-val="{{ false }}"><dc-import name="RaznosWeekGoal" dcProps="{{ props }}"></dc-import></sc-if>
  <sc-if value="{{ is_shift }}" hint-placeholder-val="{{ false }}"><dc-import name="RaznosShiftCard" dcProps="{{ props }}"></dc-import></sc-if>
  <sc-if value="{{ is_slot }}" hint-placeholder-val="{{ false }}"><dc-import name="RaznosSlotOffer" dcProps="{{ props }}"></dc-import></sc-if>
  <sc-if value="{{ is_service_link }}" hint-placeholder-val="{{ false }}"><dc-import name="RaznosAppSectionLink" dcProps="{{ props }}"></dc-import></sc-if>
  <sc-if value="{{ is_trip }}" hint-placeholder-val="{{ false }}"><dc-import name="RaznosTripCard" dcProps="{{ props }}"></dc-import></sc-if>
  <sc-if value="{{ is_orders }}" hint-placeholder-val="{{ false }}">
    <div class="rac-list"><sc-for list="{{ orders }}" as="o" hint-placeholder-count="2"><dc-import name="RaznosOrderCard" dcProps="{{ o }}"></dc-import></sc-for></div>
  </sc-if>
  <sc-if value="{{ is_summary }}" hint-placeholder-val="{{ false }}">
    <div class="rac-sum">
      <div class="rac-sum-head"><h3 class="rac-sum-title">{{ title }}</h3><sc-if value="{{ has_big }}"><span class="rac-sum-big">{{ big }}</span></sc-if></div>
      <ul class="rac-lines"><sc-for list="{{ lines }}" as="ln" hint-placeholder-count="3"><li><span>{{ ln.label }}</span><b class="{{ ln.cls }}">{{ ln.value }}</b></li></sc-for></ul>
      <sc-if value="{{ has_note }}"><p class="rac-note">{{ note }}</p></sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ has_open }}" hint-placeholder-val="{{ false }}"><button type="button" class="rac-open" onClick="{{ open }}">{{ open_label }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></sc-if>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"card":{"editor":null},"$preview":{"width":366,"height":200}}'>
// карточка в чате с помощником: по виду выбирает готовый компонент дизайн-системы, данные и действия готовит приложение
class Component extends DCLogic {
  renderVals() {
    const c = (this.props || {}).card || {};
    const t = c.type || 'summary';
    const props = c.props || {};
    return {
      is_day_goal: t === 'day_goal', is_week_goal: t === 'week_goal', is_shift: t === 'shift', is_slot: t === 'slot',
      is_service_link: t === 'service_link', is_trip: t === 'trip', is_orders: t === 'orders', is_summary: t === 'summary',
      props, orders: Array.isArray(c.orders) ? c.orders : [],
      title: c.title || '', big: c.big || '', has_big: !!c.big, lines: Array.isArray(c.lines) ? c.lines.map((l) => ({ label: l.label, value: l.value, cls: l.minus ? 'rac-minus' : '' })) : [],
      note: c.note || '', has_note: !!c.note,
      has_open: typeof c.open === 'function' && !!c.openLabel, open: () => { if (typeof c.open === 'function') c.open(); }, open_label: c.openLabel || ''
    };
  }
}
</script></body></html>
