<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.css" />
  <style>
    /* настоящая карта районов: подложка OpenFreeMap, границы районов OSM и соты H3 из локальных данных */
    .rdm { --rdm-land: oklch(0.955 0.008 95); position: relative; width: 100%; height: 380px; overflow: hidden; isolation: isolate; background: var(--rdm-land); }
    .raznos-theme-dark .rdm, .rdm.raznos-theme-dark { --rdm-land: oklch(0.25 0.012 250); }
    .rdm.rdm-fill { position: absolute; inset: 0; height: auto; }

    .rdm .rdm-canvas { position: absolute; inset: 0; }

    .rdm-chip { margin-left: auto; display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border-radius: 999px; background: var(--raznos-surface); box-shadow: 0 2px 8px rgba(20, 25, 40, .18); font: 700 13px var(--raznos-mono); color: var(--raznos-ink); font-variant-numeric: tabular-nums; }
    .rdm-state { position: absolute; z-index: 3; left: 50%; top: 58px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; max-width: calc(100% - 24px); padding: 6px 12px; border-radius: 999px; background: var(--raznos-surface); box-shadow: 0 2px 8px rgba(20, 25, 40, .18); font: 600 12px var(--raznos-font); color: var(--raznos-ink-2); white-space: nowrap; }
    .rdm-state.rdm-state-solo { top: 10px; }
    .rdm-state.rdm-state-warn { background: var(--raznos-amber-tint); color: var(--raznos-ink); }
    .rdm-state-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--raznos-green); }

    .rdm-home { position: absolute; z-index: 3; right: 10px; bottom: 36px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 14px; background: var(--raznos-surface); color: var(--raznos-ink); box-shadow: 0 2px 8px rgba(20, 25, 40, .2); cursor: pointer; }
    .rdm-legend { position: absolute; z-index: 3; left: 10px; bottom: 34px; display: inline-flex; align-items: center; gap: 5px; max-width: calc(100% - 76px); padding: 6px 9px; border-radius: 10px; background: var(--raznos-surface); box-shadow: 0 1px 6px rgba(20, 25, 40, .16); font: 600 11px var(--raznos-font); color: var(--raznos-ink-2); }
    .rdm-legend i { flex: none; width: 12px; height: 13px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
    .rdm-legend .rdm-l1 { background: oklch(0.8 0.1 150 / 0.7); } .rdm-legend .rdm-l2 { background: oklch(0.7 0.14 150 / 0.85); } .rdm-legend .rdm-l3 { background: oklch(0.58 0.15 150); }
    .rdm-legend .rdm-ring { width: 12px; height: 12px; border-radius: 50%; border: 2px dashed currentColor; clip-path: none; box-sizing: border-box; }
    .rdm .maplibregl-ctrl-bottom-right { z-index: 2; }
    .rdm .maplibregl-ctrl-attrib { font: 500 10px var(--raznos-font); }
    .raznos-theme-dark .rdm .maplibregl-ctrl-attrib, .rdm.raznos-theme-dark .maplibregl-ctrl-attrib { background: oklch(0.2 0.01 250 / 0.75); color: oklch(0.85 0.01 250); }
    .raznos-theme-dark .rdm .maplibregl-ctrl-attrib a, .rdm.raznos-theme-dark .maplibregl-ctrl-attrib a { color: inherit; }
    .raznos-theme-dark .rdm .maplibregl-ctrl-attrib-button, .rdm.raznos-theme-dark .maplibregl-ctrl-attrib-button { filter: invert(1); }
    /* пилюли районов создаёт карта, стили общие для обоих режимов */
    /* позицию задаёт маркер карты (absolute), свою не ставим, иначе пилюли съезжают в потоке */
    .rdm-pill { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: var(--raznos-surface); color: var(--raznos-ink); box-shadow: 0 2px 6px rgba(20, 25, 40, .24); font: 700 12px var(--raznos-font); font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; }
    .rdm-pill::before { content: ""; position: absolute; inset: -8px -4px; }
    .rdm-pill > b { font-weight: 800; color: var(--raznos-green-deep); }
    .rdm-pill > i { font-style: normal; color: var(--raznos-green-deep); }
    .rdm-pill.rdm-pill-sel { min-height: 34px; padding: 0 13px; background: var(--raznos-dark); color: var(--raznos-on-dark); font-size: 13px; z-index: 2; }
    .rdm-pill.rdm-pill-sel > b, .rdm-pill.rdm-pill-sel > i { color: inherit; }
    .rdm-pill.rdm-pill-none { color: var(--raznos-ink-3); }
    .rdm-pill.rdm-pill-sel.rdm-pill-none { color: var(--raznos-on-dark); }
    .rdm-pill-few { font: 600 11px var(--raznos-font); opacity: .8; }
    .rdm-ds { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box; box-shadow: 0 2px 6px rgba(20, 25, 40, .35); }
    .rdm-zone-tag { margin-bottom: 4px; padding: 4px 9px; border-radius: 999px; background: var(--raznos-surface); color: var(--raznos-ink-2); box-shadow: 0 1px 5px rgba(20, 25, 40, .2); font: 600 11.5px var(--raznos-font); white-space: nowrap; }
    /* режим люди: Карта курьеров, районы тихо на фоне, поверх курьеры, капли сообщений и ваша точка */
    .rdm { --rdm-ring: #fff; }
    .raznos-theme-dark .rdm, .rdm.raznos-theme-dark { --rdm-ring: oklch(0.22 0.012 250); }
    .rdm-state.rdm-state-low { top: 66px; }
    /* до согласия только размытый намёк на точки, сами места не читаются */
    .rdm.rdm-locked .rdm-canvas { filter: saturate(0.7) blur(3px); transform: scale(1.04); }
    .rdm-quiet { pointer-events: none; font: 700 9.5px var(--raznos-font); letter-spacing: .08em; text-transform: uppercase; color: var(--raznos-ink-3); text-shadow: 0 0 3px var(--rdm-land), 0 0 3px var(--rdm-land); white-space: nowrap; }
    .rdm-mk-courier { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--rdm-ring); box-sizing: border-box; box-shadow: 0 1px 4px rgba(20, 25, 40, .3); pointer-events: none; }
    .rdm-mk-me { position: relative; width: 16px; height: 16px; pointer-events: none; }

    .rdm-mk-me > .rdm-mk-dot { border: 3px solid var(--rdm-ring); box-shadow: 0 1px 5px rgba(20, 25, 40, .35); }
    .rdm-mk-me > .rdm-mk-halo { inset: -8px; background: color-mix(in oklab, var(--raznos-dark) 18%, transparent); }
    .rdm-mk-me > b { position: absolute; left: 21px; top: 50%; transform: translateY(-50%); font: 800 12px var(--raznos-font); color: var(--raznos-dark); text-shadow: 0 0 3px var(--rdm-land), 0 0 3px var(--rdm-land), 0 0 2px var(--rdm-land); }
    .rdm-mk-drop { position: relative; display: block; width: 28px; height: 32px; padding: 0; border: 0; background: none; cursor: pointer; filter: drop-shadow(0 2px 3px rgba(20, 25, 40, .3)); }
    .rdm-mk-drop::before { content: ""; position: absolute; inset: -6px -8px 0; }
    .rdm-mk-drop svg { display: block; width: 28px; height: 32px; }
    .rdm-mk-drop path { fill: currentColor; stroke: var(--rdm-ring); stroke-width: 1.8; stroke-linejoin: round; }
    .rdm-mk-drop circle { fill: #fff; }
    .rdm-mk-drop.rdm-mk-on { z-index: 3; }
    .rdm-mk-drop.rdm-mk-on svg { width: 34px; height: 39px; margin: -7px -3px 0; }
    .rdm-mk-drop.rdm-mk-on path { stroke: var(--raznos-ink); stroke-width: 2.4; }
    .rdm-mk-drop:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; border-radius: 8px; }
    /* пока библиотека карты грузится и если не загрузилась: подложка цвета карты и тихие контуры районов из того же GeoJSON */
    .rdm { --rdm-sheen: rgba(255, 255, 255, .6); }
    .raznos-theme-dark .rdm, .rdm.raznos-theme-dark { --rdm-sheen: rgba(255, 255, 255, .06); }
    .rdm-ph { position: absolute; inset: 0; z-index: 1; overflow: hidden; background: var(--rdm-land); pointer-events: none; }
    .rdm-ph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .rdm-ph path { fill: none; stroke: var(--raznos-ink-3); stroke-opacity: .4; stroke-width: 1; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .rdm-ph path.rdm-ph-sel { stroke: var(--raznos-ink-2); stroke-opacity: .7; stroke-width: 2; }
    .rdm-ph.rdm-ph-off { opacity: 0; visibility: hidden; }
    .rdm-fail { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); box-sizing: border-box; width: max-content; max-width: calc(100% - 32px); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 16px; border: 1px solid var(--raznos-line); border-radius: 16px; background: var(--raznos-surface); box-shadow: 0 4px 16px rgba(20, 25, 40, .18); text-align: center; }
    .rdm-fail-title { font: 700 15px var(--raznos-font); color: var(--raznos-ink); }
    .rdm-fail-sub { font: 500 12.5px/1.35 var(--raznos-font); color: var(--raznos-ink-3); }
    .rdm-fail-btn { margin-top: 8px; }
    @media (prefers-reduced-motion: no-preference) {
      .rdm-ph { transition: opacity .3s ease-out, visibility 0s linear .3s; }
      .rdm-ph.rdm-ph-loading::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, var(--rdm-sheen) 50%, transparent 65%) 0 0 / 250% 100% no-repeat; animation: rdm-sheen 1.8s ease-in-out infinite; }
      @keyframes rdm-sheen { from { background-position: 120% 0; } to { background-position: -20% 0; } }
    }
    @media (prefers-reduced-motion: no-preference) {
      .rdm-mk-me > .rdm-mk-halo { animation: rdm-pulse 2.4s cubic-bezier(.16, 1, .3, 1) infinite; }
      @keyframes rdm-pulse { from { transform: scale(0.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
    }
  </style>
</helmet>
<div class="{{ cls }}" style="{{ style }}" data-rdm="{{ uid }}" role="region" aria-label="{{ aria }}">

</x-dc><script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"text","default":"demand"},"districts":{"editor":null},"selected":{"editor":"text","default":""},"hour":{"editor":"number"},"hourLabel":{"editor":"text","default":""},"zones":{"editor":null},"focus":{"editor":"text","default":""},"showModeSwitch":{"editor":"boolean","default":false},"onPick":{"editor":null},"onMode":{"editor":null},"theme":{"editor":"text","default":"auto"},"height":{"editor":"number","default":380},"fill":{"editor":"boolean","default":false},"compact":{"editor":"boolean","default":false},"couriers":{"editor":null},"svcs":{"editor":null},"pins":{"editor":null},"me":{"editor":null},"activeId":{"editor":"text","default":""},"focusAt":{"editor":null},"focusKey":{"editor":"text","default":""},"locked":{"editor":"boolean","default":false},"offline":{"editor":"boolean","default":false},"homeButton":{"editor":"boolean","default":true},"inset":{"editor":"number","default":0},"demoState":{"editor":"text","default":""},"$preview":{"width":390,"height":380}}'>

// карта районов: районы OSM и соты H3 лежат локально в data/, поэтому видны и без сети, подложка подгружается поверх
// пропсы и события в своих терминах, вся работа с картографической библиотекой только в адаптере RDM_MAP ниже
// districts: [{ k, name, val, t (0..1 выгода), up, few, nodata, named (в спросе название рядом с числом) }], zones: [{ center: [lng, lat], radius_m, polygon, svc, approx, label }]
const RDM_H3 = 'https://cdn.jsdelivr.net/npm/h3-js@4.5.0/dist/h3-js.es.js';
const rdmOnce = (get, reset) => get().catch((e) => { reset(); throw e; });
// номер попытки после ошибки: неудачный import браузер помнит, поэтому следующая попытка идёт с другим адресом
let rdmTry = 0;
const rdmBust = (u) => (rdmTry ? u + '?retry=' + rdmTry : u);
const rdmJson = (u) => fetch(u).then((r) => (r.ok ? r.json() : Promise.reject(new Error(u))));
// контуры районов локальные, их рисуем ещё до библиотеки карты
let rdmGeoP = null;
const rdmGeo = () => rdmGeoP || (rdmGeoP = rdmOnce(() => rdmJson('data/moscow-districts.geojson'), () => { rdmGeoP = null; }));
let rdmDataP = null;
// GeoJSON районов и списки id сот H3 по районам, плюс h3-js, чтобы получить контуры сот
const rdmData = () => rdmDataP || (rdmDataP = rdmOnce(() => Promise.all([rdmGeo(), rdmJson('data/moscow-hex.json'), import(rdmBust(RDM_H3))]).then(([districts, hex, h3]) => {
  const cells = (res) => {
    const out = [];
    Object.keys(hex[res]).forEach((k) => hex[res][k].forEach((id) => { const [lat, lng] = h3.cellToLatLng(id); out.push({ id, k, at: [lng, lat], ring: h3.cellToBoundary(id, true) }); }));
    return out;
  };
  return { districts, coarse: cells('res8'), fine: cells('res9') };
}), () => { rdmDataP = null; rdmTry++; }));

// ===== адаптер карты: MapLibre GL 6.11.2 и подложка OpenFreeMap =====
// чтобы переехать на Яндекс Карты JS API 3, заменить только этот объект с теми же функциями
// на входе нейтральные данные: GeoJSON с готовыми цветами в properties (fill, fillOpacity, line, lineWidth, lineOpacity, dashed, hatch)
const RDM_LIB = 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';
const RDM_STYLE = 'https://tiles.openfreemap.org/styles/';
const RDM_MAP = (() => {
  let libP = null;
  const styleP = {};
  const lib = () => libP || (libP = rdmOnce(() => import(rdmBust(RDM_LIB)), () => { libP = null; rdmTry++; }));
  // стиль подложки качаем сами: без ответа за 6 секунд считаем, что сети нет
  const style = (dark) => {
    const key = dark ? 'dark' : 'positron';
    if (!styleP[key]) {
      styleP[key] = rdmOnce(() => new Promise((ok, no) => {
        const c = typeof AbortController === 'function' ? new AbortController() : null;
        const t = setTimeout(() => { if (c) c.abort(); no(new Error('timeout')); }, 6000);
        fetch(RDM_STYLE + key, c ? { signal: c.signal } : {}).then((r) => (r.ok ? r.json() : Promise.reject(new Error('style')))).then(ok, no).finally(() => clearTimeout(t));
      }), () => { delete styleP[key]; });
    }
    return styleP[key];
  };
  // подложка без подписей районов, городов и POI, улицы и вода по-русски
  const base = (s) => {
    const ru = ['coalesce', ['get', 'name:ru'], ['get', 'name']];
    const layers = s.layers.filter((l) => !(l.type === 'symbol' && /^(label_|place_|airport|poi|highway-shield|road_shield)/.test(l.id))).map((l) => {
      if (l.type !== 'symbol' || !l.layout || !/name/.test(JSON.stringify(l.layout['text-field'] || ''))) return l;
      return Object.assign({}, l, { layout: Object.assign({}, l.layout, { 'text-field': ru }) });
    });
    return Object.assign({}, s, { layers });
  };
  const OWN = /^rdm-/;
  const EMPTY = { type: 'FeatureCollection', features: [] };
  const hatch = (color) => {
    const n = 8, c = document.createElement('canvas');
    c.width = c.height = n;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.strokeStyle = color; x.lineWidth = 1.4; x.beginPath();
    x.moveTo(0, n); x.lineTo(n, 0); x.moveTo(-2, 2); x.lineTo(2, -2); x.moveTo(n - 2, n + 2); x.lineTo(n + 2, n - 2); x.stroke();
    return x.getImageData(0, 0, n, n);
  };
  const g = (k) => ['get', k];
  // типовые метки Карты курьеров: курьер точкой, сообщение каплей, вы точкой с подписью
  const DROP = '<svg viewBox="-12 -27 24 28" aria-hidden="true"><path d="M-5-26H5a6 6 0 0 1 6 6v6a6 6 0 0 1-6 6H3L0 0-3-8H-5a6 6 0 0 1-6-6v-6a6 6 0 0 1 6-6z"/><circle cx="-5" cy="-17" r="1.7"/><circle cx="0" cy="-17" r="1.7"/><circle cx="5" cy="-17" r="1.7"/></svg>';
  const rdmMark = (m) => {
    if (m.el || !m.kind) return m;
    let el;
    if (m.kind === 'drop') {
      el = document.createElement('button');
      el.type = 'button';
      el.className = 'rdm-mk-drop' + (m.active ? ' rdm-mk-on' : '');
      el.innerHTML = DROP;
      el.setAttribute('aria-label', m.label || 'Сообщение');
      if (m.onTap) el.addEventListener('click', (e) => { e.stopPropagation(); m.onTap(); });
    } else if (m.kind === 'me') {
      el = document.createElement('div');
      el.className = 'rdm-mk-me';
      el.innerHTML = '<i class="rdm-mk-halo"></i><i class="rdm-mk-dot"></i><b>вы</b>';
      el.querySelector('.rdm-mk-dot').style.background = m.color;
      el.setAttribute('role', 'img');
      el.setAttribute('aria-label', 'Вы здесь');
    } else {
      el = document.createElement('div');
      el.className = 'rdm-mk-courier';
      el.setAttribute('aria-hidden', 'true');
    }
    if (m.kind !== 'me') el.style[m.kind === 'drop' ? 'color' : 'background'] = m.color;
    return { el, at: m.at, anchor: m.kind === 'drop' ? 'bottom' : 'center' };
  };
  const addOwn = (map, o) => {
    ['rdm-d', 'rdm-hc', 'rdm-hf', 'rdm-mask', 'rdm-z', 'rdm-sel'].forEach((id) => map.addSource(id, { type: 'geojson', data: EMPTY }));
    if (!map.hasImage('rdm-hatch')) map.addImage('rdm-hatch', hatch(o.hatchColor));
    const hex = { 'fill-color': g('fill'), 'fill-opacity': g('fillOpacity'), 'fill-outline-color': o.hexEdge };

    // второй аргумент: название района, чтобы экран мог сказать нет данных и про район вне своего списка
    if (typeof p.onPick === 'function') p.onPick(k, f ? { name: f.properties.name } : null);
    else this.setState({ pick: k });
  }

  _fit(box, opts) {
    if (!this._h || !this._h.ready || !box) return;
    const o = Object.assign({ maxZoom: 14.5, animate: !rdmReduced() }, opts || {});
    RDM_MAP.fitTo(this._h, box, { padding: this._pad(), maxZoom: o.maxZoom, animate: o.animate });
  }

  _pad() {
    const p = this.props || {};
    // над кругом зоны стоит подпись радиуса, оставляем ей место
    const top = ((p.showModeSwitch || p.hourLabel) && !p.compact ? 60 : 24) + (Array.isArray(p.zones) && p.zones.length ? 32 : 0);
    // на Карте курьеров сверху чипы фильтров, снизу сводка экрана
    // inset: сколько снизу закрыто интерфейсом экрана, например сводкой
    return this._mode() === 'people' ? (p.compact ? { top: 8, bottom: 8, left: 8, right: 8 } : { top: 64, bottom: +p.inset > 0 ? +p.inset : 48, left: 24, right: 24 }) : { top, bottom: 48, left: 24, right: 24 };
  }

  _zoneBox() {
    const zones = Array.isArray((this.props || {}).zones) ? this.props.zones : [];
    const rings = zones.map((z) => (z.polygon ? z.polygon : rdmCircle(z.center, z.radius_m || 1500)));
    const d = this._data && this._data.districts.features.find((f) => f.properties.k === this._sel());
    if (d) rings.push(d.geometry.coordinates[0]);
    return rings.length ? rdmBox(rings) : null;
  }

  _home() {
    const zb = (Array.isArray((this.props || {}).zones) && this.props.zones.length) ? this._zoneBox() : null;
    this._fit(zb || this._cityBox, { maxZoom: zb ? 14.5 : 12.5 });
  }

  // пропсы в нейтральные слои: районы, соты, маска, зоны, обводка выбранного и пилюли, только если что-то поменялось
  _sync(first) {
    const h = this._h;
    if (!h || !h.ready || !this._data) return;
    const p = this.props || {};
    const c = this._c;
    const mode = this._mode();
    // заглушка уходит плавно, когда свои слои уже на карте
    if (first) { const gen = this._gen; RDM_MAP.whenDrawn(h, () => { if (this._alive && gen === this._gen) this.setState({ drawn: true }); }); }
    if (mode === 'people') { this._syncPeople(first); return; }
    const sel = this._sel();
    const list = Array.isArray(p.districts) ? p.districts : [];
    const zones = Array.isArray(p.zones) ? p.zones : [];
    const hour = typeof p.hour === 'number' ? p.hour : 12;
    const sig = JSON.stringify([mode, sel, hour, list.map((d) => [d.k, d.t, d.val, d.up, d.few, d.nodata, d.name, !!d.named]), zones.map((z) => [z.center, z.radius_m, z.svc, z.approx, z.label])]);
    if (sig === this._sig) return;
    const prevSel = this._lastSel;
    this._sig = sig; this._lastSel = sel;
    const byK = {};
    list.forEach((d) => { byK[d.k] = d; });
    const known = list.length > 0;
    const demand = mode === 'demand';
    const noneOf = (k) => known && (!byK[k] || byK[k].nodata || byK[k].t == null);
    const feats = this._data.districts.features;
    // районы: в спросе тонкая бледная граница, в контуре заливка и линия зелёным, без данных в спросе штриховка
    RDM_MAP.setDistricts(h, rdmFC(feats.map((f) => {
      const k = f.properties.k, on = k === sel;
      return { type: 'Feature', geometry: f.geometry, properties: {
        k, fill: c.deep, fillOpacity: demand ? 0 : (on ? 0.2 : 0.1), hatch: demand && noneOf(k) ? 1 : 0,
        line: c.deep, lineWidth: demand ? 0.8 : 1.5, lineOpacity: demand ? 0.4 : 0.85
      } };
    })));
    // соты: уровень по ставке района и часу, ниже среднего без заливки
    const pal = { 1: [c.l1, 0.4], 2: [c.l2, 0.54], 3: [c.l3, 0.66] };
    const hexFC = (cells) => rdmFC(demand ? cells.map((cell) => {
      const d = byK[cell.k];
      if (!d || d.nodata || d.t == null) return null;
      const lvl = rdmLvl(d.t, cell.at[0], cell.at[1], hour);
      if (!lvl) return null;
      return { type: 'Feature', properties: { id: cell.id, k: cell.k, lvl, fill: pal[lvl][0], fillOpacity: pal[lvl][1] }, geometry: { type: 'Polygon', coordinates: [cell.ring] } };
    }).filter(Boolean) : []);
    RDM_MAP.setHexes(h, hexFC(this._data.coarse), hexFC(this._data.fine));
    const selF = feats.find((f) => f.properties.k === sel);
    RDM_MAP.setMask(h, selF ? { type: 'Feature', properties: { fill: this._dark ? 'rgb(0,0,0)' : 'rgb(29,35,48)', fillOpacity: this._dark ? 0.42 : 0.26 }, geometry: { type: 'Polygon', coordinates: [RDM_WORLD, selF.geometry.coordinates[0]] } } : null);
    RDM_MAP.setSelection(h, selF ? { type: 'Feature', properties: { line: c.ink, lineWidth: 3.5 }, geometry: selF.geometry } : null);
    const host = this._host();
    const svcColor = (z) => (z.svc && host ? rdmTok(host, '--raznos-svc-' + z.svc) : c.deep);
    RDM_MAP.setZones(h, rdmFC(zones.map((z) => {
      const col = svcColor(z);
      return { type: 'Feature', properties: { fill: col, fillOpacity: 0.14, line: col, lineWidth: 2.2, dashed: z.approx === false ? 0 : 1 }, geometry: { type: 'Polygon', coordinates: [z.polygon || rdmCircle(z.center, z.radius_m || 1500)] } };
    })));
    RDM_MAP.setMarkers(h, this._pills(demand, sel, byK, known).concat(this._zoneMarks(zones, svcColor)));
    if (first) {
      if (zones.length || p.focus === 'zone') this._fit(this._zoneBox(), { animate: false });
      else if (selF && p.focus !== 'city') this._fit(rdmBox([selF.geometry.coordinates[0]]), { animate: false, maxZoom: 13.5 });
    } else if (sel && sel !== prevSel && selF) {
      this._fit(rdmBox([selF.geometry.coordinates[0]]), { maxZoom: 13.5 });
    }
  }

  // Карта курьеров: районы тонкой линией и тихими подписями, поверх курьеры, капли и вы, перелёт по focusKey
  _syncPeople(first) {
    const h = this._h;
    const p = this.props || {};
    const c = this._c;
    const { couriers, pins, me } = this._crowd();
    const at = Array.isArray(p.focusAt) ? p.focusAt : null;
    this._pinTaps = {};
    pins.forEach((pn) => { this._pinTaps[pn.id] = pn.tap; });
    const sig = JSON.stringify(['people', couriers.map((x) => [x.at, x.svc]), pins.map((x) => [x.id, x.at, x.svc, x.label]), me, p.activeId || '', !!p.compact]);
    const fly = JSON.stringify([p.focusKey || '', at]);
    if (sig !== this._sig) {
      this._sig = sig;
      const feats = this._data.districts.features;
      RDM_MAP.setDistricts(h, rdmFC(feats.map((f) => ({ type: 'Feature', geometry: f.geometry, properties: { k: f.properties.k, fill: c.deep, fillOpacity: 0, hatch: 0, line: c.deep, lineWidth: 1, lineOpacity: 0.32 } }))));
      RDM_MAP.setHexes(h, rdmFC([]), rdmFC([]));
      RDM_MAP.setMask(h, null);
      RDM_MAP.setSelection(h, null);
      RDM_MAP.setZones(h, rdmFC([]));
      const host = this._host();
      this._svcC = this._svcC || {};
      const svcColor = (k) => this._svcC[k] || (this._svcC[k] = host ? rdmTok(host, '--raznos-svc-' + k) : c.deep);
      const marks = [];
      if (!p.compact) feats.forEach((f) => { const el = document.createElement('div'); el.className = 'rdm-quiet'; el.textContent = f.properties.name; el.setAttribute('aria-hidden', 'true'); marks.push({ el, at: f.properties.label }); });
      couriers.forEach((x) => marks.push({ kind: 'courier', at: x.at, color: svcColor(x.svc) }));
      const drop = (pn) => ({
        kind: 'drop', at: pn.at, color: svcColor(pn.svc), active: pn.id === p.activeId, label: pn.label || 'Сообщение', onTap: () => { const t = (this._pinTaps || {})[pn.id]; if (typeof t === 'function') t(); }
      });
      // ваша точка поверх хвостиков капель рядом, выбранная капля поверх всего
      pins.filter((pn) => pn.id !== p.activeId).forEach((pn) => marks.push(drop(pn)));
      if (me) marks.push({ kind: 'me', at: me, color: c.me });
      pins.filter((pn) => pn.id === p.activeId).forEach((pn) => marks.push(drop(pn)));
      RDM_MAP.setMarkers(h, marks);
      requestAnimationFrame(() => this._declutter());
    }
    if (first || fly !== this._fly) {
      this._fly = fly;
      const d = 0.0035;
      this._fit(at ? [at[0] - d, at[1] - d, at[0] + d, at[1] + d] : this._cityBox, { animate: !first && !rdmReduced(), maxZoom: at ? 15 : 12.5 });
    }
  }

  // тихие подписи районов не налезают друг на друга: при отдалении часть прячем, порядок как в данных
  _declutter() {
    const host = this._host();
    if (!host) return;
    const shown = [];
    host.querySelectorAll('.rdm-quiet').forEach((el) => {
      el.style.visibility = '';
      const r = el.getBoundingClientRect();
      if (shown.some((s) => r.left < s.right + 6 && r.right > s.left - 6 && r.top < s.bottom + 2 && r.bottom > s.top - 2)) el.style.visibility = 'hidden';
      else shown.push(r);
    });
  }

  // пилюли: в спросе только у горячих районов и у выбранного, в контуре у всех
  _pills(demand, sel, byK, known) {
    const compact = !!(this.props || {}).compact;
    const out = [];
    this._data.districts.features.forEach((f) => {
      const k = f.properties.k;
      const d = byK[k] || {};
      const isSel = k === sel;
      const none = known && (!byK[k] || d.nodata || d.t == null);
      const name = d.name || f.properties.name;
      // ≈ у прогноза оставляем, чтобы число на карте читалось так же, как в строке
      const num = String(d.val || '').replace(/[^\d\s≈]/g, '').trim();
      if (demand && !isSel && (none || !(d.t >= 0.45))) return;
      if (compact && !isSel) return;
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'rdm-pill' + (isSel ? ' rdm-pill-sel' : '') + (none ? ' rdm-pill-none' : '');
      let html;
      if (isSel) html = rdmEsc(name) + (none ? ' <span class="rdm-pill-few">нет данных</span>' : (d.val ? ' <b>' + rdmEsc(d.val) + '</b>' : '')) + (d.up && !none ? '<i>↑</i>' : '');
      else if (demand) html = (d.named ? rdmEsc(name) + ' <b>' + rdmEsc(num) + '</b>' : rdmEsc(num)) + (d.up ? '<i>↑</i>' : '');
      else html = rdmEsc(name);
      if (d.few && !none && (isSel || demand)) html += ' <span class="rdm-pill-few">предв.</span>';
      el.innerHTML = html;
      el.setAttribute('aria-label', name + (none ? ', нет данных' : (d.val ? ', ' + d.val : '')) + (d.up ? ', растёт' : ''));
      el.setAttribute('aria-pressed', String(isSel));
      el.addEventListener('click', (e) => { e.stopPropagation(); this._pick(isSel ? '' : k); });
      out.push({ el, at: f.properties.label, anchor: 'center' });
    });
    return out;
  }

  // точка даркстора и подпись радиуса над кругом
  _zoneMarks(zones, svcColor) {
    const out = [];
    zones.forEach((z) => {
      if (!z.center) return;
      const dot = document.createElement('div');
      dot.className = 'rdm-ds';
      dot.style.background = svcColor(z);
      dot.setAttribute('role', 'img');
      dot.setAttribute('aria-label', z.label || 'Даркстор');
      out.push({ el: dot, at: z.center, anchor: 'center' });
      if (!z.polygon && z.radius_m) {
        const tag = document.createElement('div');
        tag.className = 'rdm-zone-tag';
        tag.textContent = 'радиус ≈ ' + rdmFmtKm(z.radius_m) + (z.approx === false ? '' : ', примерно');
        out.push({ el: tag, at: [z.center[0], z.center[1] + z.radius_m / 110574], anchor: 'bottom' });
      }
    });
    return out;
  }
}
</script></body></html>
