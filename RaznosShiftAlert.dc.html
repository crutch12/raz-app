<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" /><link rel="stylesheet" href="./raznos-shifts.css" /></helmet>
<div class="{{ cls }}">
  <span class="raznos-shift-alert-icon" aria-hidden="true">
    <sc-if value="{{ is_opening }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 14v3"/></svg></sc-if>
    <sc-if value="{{ is_deficit }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></sc-if>
    <sc-if value="{{ is_watch }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></sc-if>
  </span>
  <span class="raznos-shift-alert-copy"><strong>{{ title }}</strong><span>{{ text }}</span><sc-if value="{{ meta }}" hint-placeholder-val="{{ true }}"><small>{{ meta }}</small></sc-if></span>
  <sc-if value="{{ has_action }}" hint-placeholder-val="{{ true }}"><button type="button" class="{{ action_cls }}" aria-pressed="{{ active }}" onClick="{{ on_action }}">{{ action }}</button></sc-if>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"opening","options":["opening","deficit","watch"]},"title":{"editor":"text","default":"Запись в Яндекс на 21–27 сентября"},"text":{"editor":"text","default":"Откроется в чт 17 сентября в 10:00 для уровня Золото"},"meta":{"editor":"text","default":"Платина видит слоты на 2 часа раньше · правила Яндекс Про"},"action":{"editor":"text","default":"Напомнить"},"activeAction":{"editor":"text","default":"Напомним за 5 мин"},"active":{"editor":"boolean","default":false},"onAction":{"editor":null},"$preview":{"width":366,"height":120}}'>
// напоминание об открытии записи, предупреждение о нехватке мест или слежение за слотом
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const kind = ['opening', 'deficit', 'watch'].indexOf(p.kind) !== -1 ? p.kind : 'opening';
    const val = (key, fallback) => p[key] === undefined ? fallback : (p[key] || '');
    const active = !!p.active;
    const action = active ? val('activeAction', 'Напомним за 5 мин') : val('action', 'Напомнить');
    return {
      is_opening: kind === 'opening', is_deficit: kind === 'deficit', is_watch: kind === 'watch',
      title: val('title', 'Запись в Яндекс на 21–27 сентября'), text: val('text', 'Откроется в чт 17 сентября в 10:00 для уровня Золото'),
      meta: val('meta', 'Платина видит слоты на 2 часа раньше · правила Яндекс Про'),
      action, has_action: !!action, active,
      action_cls: 'raznos-shift-alert-action' + (active ? ' raznos-is-on' : ''),
      cls: 'raznos-shift-alert raznos-is-' + kind,
      on_action: typeof p.onAction === 'function' ? p.onAction : (() => {})
    };
  }
}
</script></body></html>
