<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rro { box-sizing: border-box; width: 100%; max-width: 100%; background: var(--raznos-surface); border: 1px solid var(--raznos-line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .rro-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .rro-title { font: 700 15px var(--raznos-font); color: var(--raznos-ink); }
    .rro-all { box-sizing: border-box; min-height: 44px; margin: -14px -4px -14px 0; padding: 0 4px 0 12px; background: none; border: 0; cursor: pointer; font: 600 13px var(--raznos-font); color: var(--raznos-green-deep); }
    .rro-row { display: flex; align-items: center; gap: 8px; }
    .rro-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; margin: -4px -6px; padding: 4px 6px; border-radius: 10px; font: inherit; color: inherit; text-align: left; cursor: pointer; transition: background 0.12s ease; }
    .rro-open:hover, .rro-open:active { background: var(--raznos-surface-2); }
    .rro-chev { flex: none; color: var(--raznos-ink-3); font: 600 16px var(--raznos-font); line-height: 1; }
    .rro-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .rro-route { font: 600 14px var(--raznos-font); color: var(--raznos-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rro-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; margin: 2px 0; padding: 2px 8px; border-radius: 999px; background: var(--raznos-green-tint); color: var(--raznos-green-deep); font: 700 12px var(--raznos-font); vertical-align: middle; }
    .rro-ico { position: relative; flex: none; display: inline-flex; }
    .rro-count { position: absolute; right: -5px; bottom: -4px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; border: 2px solid var(--raznos-surface); background: var(--raznos-dark); color: var(--raznos-on-dark); font: 800 10.5px/14px var(--raznos-font); text-align: center; }
    .rro-meta { font: 500 12px var(--raznos-font); color: var(--raznos-ink-3); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .rro-note { font: 500 12px var(--raznos-font); color: var(--raznos-amber); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rro-pay { font: 700 14px var(--raznos-mono); color: var(--raznos-ink); flex: none; font-variant-numeric: tabular-nums; }
    .rro-add-wrap { position: relative; flex: none; width: 32px; height: 32px; }
    .rro-add { position: absolute; left: -6px; top: -6px; width: 44px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .rro-add-ico { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--raznos-line); background: var(--raznos-surface-2); color: var(--raznos-ink); font: 600 18px var(--raznos-font); line-height: 1; display: flex; align-items: center; justify-content: center; }
    .rro-add:hover .rro-add-ico { border-color: var(--raznos-ink-3); }
    .rro-add:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: -2px; border-radius: 12px; }
    .rro-sheet { display: flex; flex-direction: column; gap: 12px; }
    .rro-sheet-seg { display: flex; gap: 6px; background: var(--raznos-surface-2); padding: 4px; border-radius: 10px; }
    .rro-seg-btn { flex: 1; padding: 8px; border: 0; background: transparent; border-radius: 8px; font: 600 13px var(--raznos-font); color: var(--raznos-ink-3); cursor: pointer; }
    .rro-seg-btn.raznos-is-active { background: var(--raznos-surface); color: var(--raznos-ink); }
    .rro-amt { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .rro-amt-val { font: 800 22px var(--raznos-font); color: var(--raznos-ink); font-variant-numeric: tabular-nums; }
    .rro-amt-field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
    .rro-amt-input { flex: 1; min-width: 0; min-height: 48px; text-align: right; font: 800 22px var(--raznos-font); font-variant-numeric: tabular-nums; }
    .rro-amt-unit { font: 700 18px var(--raznos-font); color: var(--raznos-ink-3); }
    .rro-rate-row { display: flex; flex-direction: column; gap: 2px; }
      .rro-sheet-sub { font: 500 13px var(--raznos-font); color: var(--raznos-ink-3); }
  </style>
</helmet>
<div class="rro">
  <div class="rro-head"><span class="rro-title">Последние заказы</span><button type="button" class="rro-all" onClick="{{ on_all }}">Показать все</button></div>
  <sc-for list="{{ rows }}" as="o" hint-placeholder-count="3">
    <div class="rro-row">
      <button type="button" class="{{ o.openClass }}" onClick="{{ o.openOrder }}">
        <span class="rro-ico"><dc-import name="RaznosIcon" svc="{{ o.svc }}" alt="{{ o.svcTitle }}" size="sm"></dc-import><sc-if value="{{ o.isTrip }}" hint-placeholder-val="{{ false }}"><b class="rro-count" aria-hidden="true">{{ o.count }}</b></sc-if></span>
        <span class="rro-main"><span class="rro-route">{{ o.route }}</span><span class="rro-meta">{{ o.meta }}</span><sc-if value="{{ o.hasNote }}" hint-placeholder-val="{{ false }}"><span class="rro-note">{{ o.note }}</span></sc-if></span>
        <span class="rro-pay">{{ o.pay }} ₽</span>
        <span class="rro-chev">›</span>
      </button>
      <div class="rro-add-wrap">
        <sc-if value="{{ o.canAdd }}" hint-placeholder-val="{{ true }}">
          <button type="button" class="rro-add" onClick="{{ o.add }}" aria-label="{{ o.addAria }}" aria-haspopup="menu"><span class="rro-add-ico">＋</span></button>
        </sc-if>
        <sc-if value="{{ o.menuOpen }}" hint-placeholder-val="{{ false }}">
          <dc-import name="RaznosActionMenu" items="{{ o.menu }}" onPick="{{ menu_pick }}" onClose="{{ menu_close }}"></dc-import>
        </sc-if>
      </div>
    </div>
  </sc-for>

  <sc-if value="{{ tip_open }}" hint-placeholder-val="{{ false }}">
    <div class="raznos-dialog-layer raznos-dialog-bottom" data-backdrop role="dialog" aria-modal="true" aria-label="Чаевые">
      <div class="raznos-dialog rro-sheet">
        <span class="raznos-text-h3">Чаевые вне сервиса<br><small class="rro-sheet-sub">{{ sheet_order }}</small></span>
        <span class="raznos-text-small">{{ tip_hint }}</span>
        <div class="rro-amt">
          <button type="button" class="raznos-btn raznos-btn-secondary raznos-btn-small" style="min-height:44px" onClick="{{ tip_dec }}" aria-label="Минус 50 рублей">−50</button>
          <span class="rro-amt-field"><input class="raznos-input rro-amt-input" type="text" inputmode="decimal" autocomplete="off" aria-label="Сумма чаевых, рублей" placeholder="0" value="{{ tip_text }}" onInput="{{ tip_change }}" /><span class="rro-amt-unit">₽</span></span>
          <button type="button" class="raznos-btn raznos-btn-secondary raznos-btn-small" style="min-height:44px" onClick="{{ tip_inc }}" aria-label="Плюс 50 рублей">+50</button>
        </div>
        <span class="raznos-text-small">Тип чаевых</span>
        <div class="rro-sheet-seg">
          <button type="button" class="{{ tt_cash_cls }}" onClick="{{ tt_cash }}">Наличные</button>
          <button type="button" class="{{ tt_card_cls }}" onClick="{{ tt_card }}">Картой</button>
          <button type="button" class="{{ tt_qr_cls }}" onClick="{{ tt_qr }}">QR</button>
        </div>
        <div class="raznos-field"><span class="raznos-field-label">Комментарий</span><input class="raznos-input" placeholder="Например, спасибо за скорость" value="{{ comment_val }}" onInput="{{ comment_change }}" /></div>
        <div class="raznos-btn-row">
          <button data-cancel type="button" class="raznos-btn raznos-btn-secondary" onClick="{{ sheet_cancel }}">Отмена</button>
          <button type="button" class="raznos-btn" onClick="{{ sheet_save }}">Сохранить</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ exp_open }}" hint-placeholder-val="{{ false }}">
    <div class="raznos-dialog-layer raznos-dialog-bottom" data-backdrop role="dialog" aria-modal="true" aria-label="Расход">
      <div class="raznos-dialog rro-sheet">
        <span class="raznos-text-h3">{{ exp_title }} {{ sheet_order }}</span>
        <div class="rro-amt">
          <button type="button" class="raznos-btn raznos-btn-secondary raznos-btn-small" onClick="{{ amt_dec }}">−50</button>
          <span class="rro-amt-val">{{ amt }} ₽</span>
          <button type="button" class="raznos-btn raznos-btn-secondary raznos-btn-small" onClick="{{ amt_inc }}">+50</button>
        </div>
        <div class="raznos-field"><span class="raznos-field-label">Комментарий</span><input class="raznos-input" placeholder="Например, бензин или мойка" value="{{ comment_val }}" onInput="{{ comment_change }}" /></div>
        <div class="raznos-btn-row">
          <button data-cancel type="button" class="raznos-btn raznos-btn-secondary" onClick="{{ sheet_cancel }}">Отмена</button>
          <button type="button" class="raznos-btn" onClick="{{ sheet_save }}">Сохранить</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ review_open }}" hint-placeholder-val="{{ false }}">
    <div class="raznos-dialog-layer raznos-dialog-bottom" data-backdrop role="dialog" aria-modal="true" aria-label="Отзыв о заказе">
      <div class="raznos-dialog rro-sheet">
        <span class="raznos-text-h3">Отзыв о заказе<br><small class="rro-sheet-sub">{{ sheet_order }}</small></span>
        <div class="rro-rate-row">
          <span class="raznos-text-small">Место доставки</span>
          <div class="raznos-rate" role="group" aria-label="Оценка места доставки">
            <sc-for list="{{ place_stars }}" as="st" hint-placeholder-count="5">
              <button type="button" class="{{ st.cls }}" onClick="{{ st.tap }}" aria-label="{{ st.aria }}"><svg class="raznos-rate-star" viewBox="0 0 20 20"><path d="M10 1l2.7 6 6.3.6-4.8 4.2 1.4 6.2L10 14.9 4.4 18l1.4-6.2L1 7.6l6.3-.6z" /></svg></button>
            </sc-for>
          </div>
        </div>
        <div class="rro-rate-row">
          <span class="raznos-text-small">Получатель</span>
          <div class="raznos-rate" role="group" aria-label="Оценка получателя">
            <sc-for list="{{ rec_stars }}" as="st" hint-placeholder-count="5">
              <button type="button" class="{{ st.cls }}" onClick="{{ st.tap }}" aria-label="{{ st.aria }}"><svg class="raznos-rate-star" viewBox="0 0 20 20"><path d="M10 1l2.7 6 6.3.6-4.8 4.2 1.4 6.2L10 14.9 4.4 18l1.4-6.2L1 7.6l6.3-.6z" /></svg></button>
            </sc-for>
          </div>
        </div>
        <div class="raznos-field"><span class="raznos-field-label">Комментарий</span><input class="raznos-input" placeholder="Про подъезд, домофон, доступ" value="{{ comment_val }}" onInput="{{ comment_change }}" /></div>
        <div class="raznos-btn-row">
          <button data-cancel type="button" class="raznos-btn raznos-btn-secondary" onClick="{{ sheet_cancel }}">Отмена</button>
          <button type="button" class="raznos-btn" onClick="{{ sheet_save }}">Сохранить</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"onAll":{"editor":null},"onOpenOrder":{"editor":null},"onOpenTrip":{"editor":null},"onAddExpense":{"editor":null},"onSaveTip":{"editor":null},"$preview":{"width":390,"height":260}}'>
// последние заказы для раздела Сегодня, плюс у заказа открывает меню: чаевые, расход, отзыв, заметка
const RRO_SVC = { samokat: 'Самокат', vkusvill: 'ВкусВилл', 'yandex-eda': 'Яндекс Еда' };
const RRO_DEMO = [
  { id: 'V-9021', svc: 'vkusvill', route: 'Садовая 3 → Клин 8', meta: 'сейчас · в пути', pay: 320 },
  { id: 'А-2481', svc: 'samokat', route: 'Ленина 12 → Мира 5', meta: '14:20 · доставлен · чаевые 120 ₽', pay: 480 },
  // маршрут из нескольких заказов, счётчик на иконке
  { id: 'T-12', isTrip: true, svc: 'samokat', route: 'Маршрут · 3 заказа', count: 3, meta: '13:34–14:35 · Профсоюзная, Правды, Беговая', pay: 690 },
  { id: 'V-9020', svc: 'vkusvill', route: 'Садовая 3 → Клин 8', meta: '13:40 · доставлен', pay: 360 }
];
const RRO_ORDER_MENU = [{ key: 'tip', label: 'Чаевые' }, { key: 'expense', label: 'Расходы' }, { key: 'review', label: 'Отзыв о заказе' }, { key: 'note', label: 'Заметка к адресу' }];
const RRO_TRIP_MENU = [{ key: 'expense', label: 'Расходы' }];
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const st = this.state || {};
    const set = (patch) => this.setState(patch);
    const onAll = typeof p.onAll === 'function' ? p.onAll : (() => {});
    const onOpenOrder = typeof p.onOpenOrder === 'function' ? p.onOpenOrder : (() => {});
    const onOpenTrip = typeof p.onOpenTrip === 'function' ? p.onOpenTrip : (() => {});
    const onAddExpense =typeof p.onAddExpense === 'function' ? p.onAddExpense : null;
    const onSaveTip = typeof p.onSaveTip === 'function' ? p.onSaveTip : (() => {});
    const src = (p.orders && p.orders.length) ? p.orders : RRO_DEMO;
    const amt = st.amt == null ? 100 : st.amt;
    const menuId = st.menuId || null;
    const openId = st.openId || null;
    const sheet = st.sheet || '';
    const tipType = st.tipType || 'cash';
    const comment = st.comment || '';
    const placeRate = st.placeRate || 0;
    const recRate = st.recRate || 0;
    const close = () => set({ openId: null, sheet: '' });
    const fmtAmt = (n) => String(Math.round(n * 100) / 100).replace('.', ',');
    const tipText = st.tipText == null ? '' : st.tipText;
    const tipNum = Number(String(tipText).replace(',', '.')) || 0;

    const rows = src.map((o) => ({
      svc: o.svc, svcTitle: RRO_SVC[o.svc] || o.svc, route: o.route, meta: o.meta.replace(/ ₽/g, " ₽"), pay: o.pay,
      openOrder: () => (o.isTrip ? onOpenTrip(o.id) : onOpenOrder(o.id)),
      canAdd: !o.isTrip,
      isTrip: !!o.isTrip, count: o.count || '', note: o.note || '', hasNote: !!o.note,
      // у маршрута в меню только то, что относится ко всей поездке, чаевые и отзыв к заказу внутри маршрута
      menu: o.isTrip ? RRO_TRIP_MENU : RRO_ORDER_MENU,
      openClass: 'rro-open',
      add:() => set({ menuId: menuId === o.id ? null : o.id }),
      menuOpen: menuId === o.id, addAria: o.isTrip ? 'Действия с маршрутом' : 'Действия с заказом'
    }));

    // расход открывает общую форму расхода, если её передали, иначе простая шторка
    const menuPick = (key) => {
      const id = menuId;
      if (key === 'expense' && onAddExpense) { set({ menuId: null }); onAddExpense(id); return; }
      // заметка одна, к адресу доставки, пишется в карточке заказа
      if (key === 'note') { set({ menuId: null }); if (typeof p.onNote === 'function') p.onNote(id); return; }
      // шторка чаевых открывается с текущей суммой заказа
      const cur = src.find((x) => x.id === id);
      set({ menuId: null, openId: id, sheet: key, amt: 100, tipText: cur && cur.tip ? fmtAmt(cur.tip) : '', tipType: 'cash', comment: '', placeRate: 0, recRate: 0 });
    };

    const ttCls = (v) => 'rro-seg-btn' + (tipType === v ? ' raznos-is-active' : '');
    const stars = (cur, key) => [1, 2, 3, 4, 5].map((n) => ({
      cls: n <= cur ? 'raznos-is-on' : '',
      aria: n + (n === 1 ? ' звезда' : (n < 5 ? ' звезды' : ' звёзд')),
      tap: () => set({ [key]: n })
    }));

    return {
      on_all: onAll,
      rows,
      menu_items: RRO_ORDER_MENU,
      menu_pick: menuPick,
      menu_close: () => set({ menuId: null }),
      exp_title: String(openId || '').indexOf('trip') === 0 ? 'Расход по маршруту' : 'Расход по заказу',
      sheet_order: (() => { const o = src.find((x) => x.id === openId); return o ? o.meta.split(' ')[0] + ', ' + o.route.split(' → ')[0] : ''; })(),
      tip_open: !!openId && sheet === 'tip',
      tip_hint: (() => { const o = src.find((x) => x.id === openId); return o && o.tipDigital ? 'Чаевые через сервис ' + o.tipDigital + ' ₽ уже учтены, здесь только то, что дали наличными или переводом' : 'Чаевые через сервис учтём сами, здесь только то, что дали наличными или переводом'; })(),
      exp_open: !!openId && sheet === 'expense',
      review_open: !!openId && sheet === 'review',
      amt: amt,
      tip_text: tipText,
      tip_change: (e) => {
        // только цифры и один разделитель, до двух знаков после запятой
        const raw = String((e && e.target && e.target.value) || '').replace('.', ',').replace(/[^\d,]/g, '');
        const parts = raw.split(',');
        set({ tipText: parts.length > 1 ? parts[0] + ',' + parts.slice(1).join('').slice(0, 2) : raw });
      },
      tip_dec: () => set({ tipText: fmtAmt(Math.max(0, tipNum - 50)) }),
      tip_inc: () => set({ tipText: fmtAmt(tipNum + 50) }),
      amt_dec: () => set({ amt: Math.max(0, amt - 50) }),
      amt_inc: () => set({ amt: amt + 50 }),
      tt_cash_cls: ttCls('cash'), tt_card_cls: ttCls('card'), tt_qr_cls: ttCls('qr'),
      tt_cash: () => set({ tipType: 'cash' }), tt_card: () => set({ tipType: 'card' }), tt_qr: () => set({ tipType: 'qr' }),
      comment_val: comment,
      comment_change: (e) => set({ comment: (e && e.target && e.target.value) || '' }),
      place_stars: stars(placeRate, 'placeRate'),
      rec_stars: stars(recRate, 'recRate'),
      sheet_cancel: close,
      sheet_save: () => {
        if (sheet === 'tip') { onSaveTip(openId, tipNum, tipType, comment); close(); }
        else close();
      }
    };
  }
}
</script></body></html>
