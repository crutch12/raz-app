<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    /* погода: заметка о спросе и предупреждение на Сегодня, метка в окне Плана. Показываем, только когда погода влияет на работу */
    .rwe { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--raznos-surface); font-family: var(--raznos-font); color: var(--raznos-ink); }
    .rwe-head { display: flex; align-items: flex-start; gap: 12px; }
    .rwe-ico { flex: none; width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--raznos-surface-2); color: var(--raznos-ink-2); }
    .rwe-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .rwe-title { font: 650 15px/1.3 var(--raznos-font); overflow-wrap: anywhere; }
    .rwe-demand { font: 600 13.5px/1.4 var(--raznos-font); color: var(--raznos-green-deep); overflow-wrap: anywhere; }
    .rwe-temp { flex: none; font: 700 20px/1 var(--raznos-font); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; padding-top: 2px; }
    /* предупреждение для курьера: янтарный блок, только при морозе ниже −10 °C или сильном дожде на смене */
    .rwe-warn { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--raznos-amber-tint); }
    .rwe-warn-title { display: flex; align-items: center; gap: 8px; font: 650 14px/1.35 var(--raznos-font); color: var(--raznos-ink); }
    .rwe-warn-title svg { flex: none; color: var(--raznos-amber); }
    .rwe-tips { margin: 0; padding: 0 0 0 24px; display: flex; flex-direction: column; gap: 3px; list-style: none; }
    .rwe-tips li { position: relative; font: 500 13.5px/1.4 var(--raznos-font); color: var(--raznos-ink-2); }
    .rwe-tips li::before { content: ''; position: absolute; left: -14px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: var(--raznos-amber); }
    .rwe-src { margin: 0; font: 500 12px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    /* метка в окне Плана: тихая, без цвета денег, чтобы не спорить с бонусом */
    .rwe-tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--raznos-surface-2); font: 600 12.5px/1.3 var(--raznos-font); color: var(--raznos-ink-2); }
    .rwe-tag svg { flex: none; }
    @media (prefers-reduced-motion: no-preference) {
      .rwe-ico-rain .rwe-drop { animation: rwe-drop 2.4s ease-in infinite; }
      .rwe-ico-rain .rwe-drop:nth-child(3) { animation-delay: 0.8s; }
      .rwe-ico-rain .rwe-drop:nth-child(4) { animation-delay: 1.6s; }
      @keyframes rwe-drop { 0% { opacity: 0; transform: translateY(-2px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(3px); } }
    }
  </style>
</helmet>
<sc-if value="{{ is_card }}" hint-placeholder-val="{{ true }}">
<div class="rwe" role="group" aria-label="{{ aria }}">
  <div class="rwe-head">
    <span class="{{ ico_cls }}" aria-hidden="true">
      <sc-if value="{{ is_rain }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15.5a4.5 4.5 0 1 1 1.2-8.8A5.5 5.5 0 0 1 18.5 9 3.3 3.3 0 0 1 18 15.5z"/><path d="M12 22v-2"/><path class="rwe-drop" d="M8 20.5v-1.5"/><path class="rwe-drop" d="M16 20.5v-1.5"/></svg></sc-if>
      <sc-if value="{{ is_frost }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6"/><path d="M9.5 4l2.5 2 2.5-2M9.5 20l2.5-2 2.5 2"/></svg></sc-if>
      <sc-if value="{{ is_clear }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></sc-if>
    </span>
    <span class="rwe-main"><span class="rwe-title">{{ title }}</span><sc-if value="{{ has_demand }}" hint-placeholder-val="{{ true }}"><span class="rwe-demand">{{ demand }}</span></sc-if></span>
    <span class="rwe-temp">{{ temp }}</span>
  </div>
  <sc-if value="{{ has_warn }}" hint-placeholder-val="{{ true }}">
    <div class="rwe-warn">
      <span class="rwe-warn-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 17h.01"/></svg>{{ warn_title }}</span>
      <ul class="rwe-tips"><sc-for list="{{ tips }}" as="t" hint-placeholder-count="3"><li>{{ t }}</li></sc-for></ul>
    </div>
  </sc-if>
  <p class="rwe-src">{{ src }}</p>
</div>
</sc-if>
<sc-if value="{{ is_tag }}" hint-placeholder-val="{{ false }}">
  <span class="rwe-tag"><sc-if value="{{ is_frost }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6"/></svg></sc-if><sc-if value="{{ not_frost }}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15.5a4.5 4.5 0 1 1 1.2-8.8A5.5 5.5 0 0 1 18.5 9 3.3 3.3 0 0 1 18 15.5z"/><path d="M9 19.5v1.5M15 19.5v1.5"/></svg></sc-if>{{ tag }}</span>
</sc-if>
</x-dc><script type="text/x-dc" data-dc-script data-props='{
  "mode": { "editor": "enum", "options": ["card", "tag"], "default": "card" },
  "weather": { "editor": null },
  "tag": { "editor": "text", "default": "Дождь 18–22, спрос выше" },
  "kind": { "editor": "enum", "options": ["rain", "frost", "clear"], "default": "rain" },
  "$preview": { "width": 360, "height": 260 }
}'>
// пример для дизайн-системы, в приложении погода приходит из WEATHER_DEMO
const RWE_DEMO = {
  kind: 'rain', temp: '+7°', title: 'Дождь с 18:00 до 22:00',
  demand: 'Заказов обычно больше на 15–25%, к вечеру ставки выше',
  warnTitle: 'Сильный дождь на вашей смене', tips: ['Телефон в чехол или пакет, держатель под козырёк', 'На плитке и разметке скользко, тормозите заранее', 'Сухие перчатки и носки в сумку'],
  src: 'Open-Meteo, почасовой прогноз для Москвы, обновлён в 15:30'
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const w = p.weather || RWE_DEMO;
    const kind = p.mode === 'tag' ? (p.kind || 'rain') : (w.kind || 'rain');
    const tips = Array.isArray(w.tips) ? w.tips : [];
    return {
      is_card: p.mode !== 'tag', is_tag: p.mode === 'tag', tag: p.tag || 'Дождь 18–22, спрос выше',
      is_rain: kind === 'rain', is_frost: kind === 'frost', is_clear: kind === 'clear', not_frost: kind !== 'frost',
      ico_cls: 'rwe-ico rwe-ico-' + kind,
      title: w.title || '', temp: w.temp || '', demand: w.demand || '', has_demand: !!w.demand,
      has_warn: !!w.warnTitle, warn_title: w.warnTitle || '', tips,
      src: w.src || '',
      aria: ['Погода', w.title, w.temp, w.demand, w.warnTitle].concat(tips).filter(Boolean).join('. ')
    };
  }
}
</script></body></html>
