<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rcm { position: relative; width: 100%; aspect-ratio: 360 / 440; overflow: hidden; background: oklch(0.955 0.008 95); }
    /* fill: карта занимает весь ближайший позиционированный контейнер, например экран или карточку */
    .rcm.rcm-fill { position: absolute; inset: 0; aspect-ratio: auto; }
    .rcm > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* до согласия показываем только размытый намёк на точки, сами места не читаются */
    .rcm.rcm-locked > svg { filter: saturate(0.7) blur(3px); transform: scale(1.04); }
    .rcm-land { fill: oklch(0.955 0.008 95); }
    .rcm-block { fill: oklch(0.93 0.01 95); }
    .rcm-park { fill: oklch(0.9 0.06 145); }
    .rcm-river { fill: none; stroke: oklch(0.86 0.05 235); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
    .rcm-ring { fill: none; stroke: oklch(0.99 0.005 95); stroke-width: 6; }
    .rcm-ring-ttk { fill: none; stroke: oklch(0.93 0.07 85); stroke-width: 5; }
    .rcm-road { fill: none; stroke: oklch(0.99 0.005 95); stroke-width: 4; stroke-linecap: round; }
    .rcm-street { fill: none; stroke: oklch(0.99 0.005 95); stroke-width: 1.6; }
    .rcm-label { font: 700 8.5px var(--raznos-font); letter-spacing: 0.08em; fill: oklch(0.55 0.015 250); text-anchor: middle; }
    .rcm-dot { stroke: #fff; stroke-width: 2.2; }
    .rcm-me-halo { fill: color-mix(in oklab, var(--raznos-dark) 18%, transparent); }
    .rcm-me { fill: var(--raznos-dark); stroke: #fff; stroke-width: 3; }
    .rcm-me-label { font: 800 11px var(--raznos-font); fill: var(--raznos-dark); paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
    .rcm-compact .rcm-label { display: none; }
    /* районы: заливка темнее у выгодных, подписи района и ставки вместо общих подписей схемы */
    /* районы сотами по мотивам горячих зон DoorDash: закрашены только выгодные места, карта под ними видна */
    .rcm-hit { fill: transparent; cursor: pointer; }
    .rcm-hex { stroke: oklch(1 0 0 / 0.55); stroke-width: 1; pointer-events: none; }
    .rcm-hex-l1 { fill: oklch(0.8 0.1 150 / 0.38); }
    .rcm-hex-l2 { fill: oklch(0.7 0.14 150 / 0.5); }
    .rcm-hex-l3 { fill: oklch(0.58 0.15 150 / 0.62); }
    .rcm-hex-sel { fill: oklch(0.55 0.02 250 / 0.18); }
    .rcm-hex.rcm-hex-on { stroke: var(--raznos-dark); stroke-width: 1.4; }
    .rcm-zone-outline { fill: none; stroke: var(--raznos-dark); stroke-width: 2.4; stroke-dasharray: 5 4; stroke-linejoin: round; pointer-events: none; }
    .rcm-zone-labels { position: absolute; inset: 0; pointer-events: none; }
    .rcm-zone-lab { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 3px; padding: 4px 8px; border-radius: 999px; background: var(--raznos-surface); box-shadow: 0 2px 6px rgba(20, 25, 40, .22); white-space: nowrap; font: 800 12px var(--raznos-font); color: var(--raznos-ink); font-variant-numeric: tabular-nums; }
    .rcm-zone-lab > b { font: 700 11.5px var(--raznos-font); }
    .rcm-zone-lab > i { font-style: normal; color: var(--raznos-green-deep); }
    .rcm-zone-lab.rcm-lab-sel { z-index: 2; transform: translate(-50%, 85%); padding: 7px 11px; background: var(--raznos-dark); color: var(--raznos-on-dark); font-size: 13px; }
    .rcm-zone-lab.rcm-lab-sel > i { color: oklch(0.86 0.12 145); }
    /* сообщения Что происходит с местом: капля в цвет сервиса, отличается от круглых точек курьеров */
    .rcm-pin { cursor: pointer; }
    .rcm-pin-hit { fill: transparent; }
    .rcm-pin-body { fill: currentColor; stroke: #fff; stroke-width: 1.8; stroke-linejoin: round; }
    .rcm-pin-core { fill: #fff; }
    .rcm-pin-active .rcm-pin-body { stroke: var(--raznos-dark); stroke-width: 2.4; }
    @media (prefers-reduced-motion: no-preference) {
      .rcm-me-halo { transform-box: fill-box; transform-origin: center; animation: rcm-pulse 2.4s cubic-bezier(.16, 1, .3, 1) infinite; }
      @keyframes rcm-pulse { from { transform: scale(0.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
    }
  </style>
</helmet>
<div class="{{ cls }}" role="img" aria-label="{{ aria }}">
  <svg viewBox="{{ vb }}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect class="rcm-land" x="-400" y="-400" width="1160" height="1240" />
    <path class="rcm-block" d="M20 40h70v50H20zM110 30h60v45h-60zM200 36h70v40h-70zM290 50h60v60h-60zM24 300h60v60H24zM250 360h80v50h-80zM110 380h70v44h-70z" />
    <path class="rcm-park" d="M40 110c22-14 52-8 60 12s-10 40-34 42-44-12-42-28 4-18 16-26z" />
    <path class="rcm-park" d="M104 300c18-10 44-4 52 12s-4 30-26 32-38-8-38-22 2-14 12-22z" />
    <path class="rcm-park" d="M280 120c16-12 42-10 50 6s-6 34-28 34-34-10-34-22 2-12 12-18z" />
    <path class="rcm-park" d="M150 196c8-6 20-5 24 3s-3 16-13 16-16-5-15-11 0-5 4-8z" />
    <g class="rcm-street">
      <path d="M0 70h360M0 140h360M0 250h360M0 330h360M0 400h360M60 0v440M130 0v440M250 0v440M310 0v440" />
    </g>
    <ellipse class="rcm-ring-ttk" cx="180" cy="215" rx="150" ry="160" />
    <path class="rcm-road" d="M180 215L40 10M180 215L0 170M180 215L10 380M180 215L150 440M180 215L360 300M180 215L330 0M180 215L230 0" />
    <path class="rcm-river" d="M-10 150C40 140 60 190 96 214s70 20 90 10 34-24 56-8 18 60 40 86 56 34 90 30" />
    <ellipse class="rcm-ring" cx="180" cy="215" rx="82" ry="86" />
    <sc-for list="{{ hexes }}" as="h" hint-placeholder-count="0"><path class="{{ h.cls }}" d="{{ h.d }}" /></sc-for>
    <sc-if value="{{ has_outline }}" hint-placeholder-val="{{ false }}"><path class="rcm-zone-outline" d="{{ outline }}" /></sc-if>
    <sc-for list="{{ zones }}" as="z" hint-placeholder-count="0"><path class="rcm-hit" d="{{ z.d }}" onClick="{{ z.tap }}"><title>{{ z.title }}</title></path></sc-for>
    <text class="rcm-label" x="92" y="86">БЕГОВОЙ</text>
    <text class="rcm-label" x="186" y="150">ТВЕРСКОЙ</text>
    <text class="rcm-label" x="96" y="184">ПРЕСНЕНСКИЙ</text>
    <text class="rcm-label" x="150" y="252">АРБАТ</text>
    <text class="rcm-label" x="52" y="272">ДОРОГОМИЛОВО</text>
    <text class="rcm-label" x="150" y="360">ХАМОВНИКИ</text>
    <text class="rcm-label" x="252" y="262">ЗАМОСКВОРЕЧЬЕ</text>
    <text class="rcm-label" x="286" y="190">БАСМАННЫЙ</text>
    <sc-for list="{{ dots }}" as="d" hint-placeholder-count="12"><circle class="rcm-dot" cx="{{ d.x }}" cy="{{ d.y }}" r="{{ d.r }}" style="{{ d.style }}" /></sc-for>
    <sc-for list="{{ pins }}" as="pn" hint-placeholder-count="3"><g class="{{ pn.cls }}" transform="{{ pn.tf }}" style="{{ pn.style }}" onClick="{{ pn.tap }}"><circle class="rcm-pin-hit" cx="0" cy="-17" r="15" /><path class="rcm-pin-body" d="M-5-26H5a6 6 0 0 1 6 6v6a6 6 0 0 1-6 6H3L0 0-3-8H-5a6 6 0 0 1-6-6v-6a6 6 0 0 1 6-6z" /><circle class="rcm-pin-core" cx="-5" cy="-17" r="1.7" /><circle class="rcm-pin-core" cx="0" cy="-17" r="1.7" /><circle class="rcm-pin-core" cx="5" cy="-17" r="1.7" /></g></sc-for>
    <sc-if value="{{ show_me }}" hint-placeholder-val="{{ true }}">
      <circle class="rcm-me-halo" cx="{{ me_x }}" cy="{{ me_y }}" r="16" />
      <circle class="rcm-me" cx="{{ me_x }}" cy="{{ me_y }}" r="{{ me_r }}" />
      <text class="rcm-me-label" x="{{ me_lx }}" y="{{ me_ly }}">вы</text>
    </sc-if>
  </svg>
  <sc-if value="{{ has_zones }}" hint-placeholder-val="{{ false }}"><div class="rcm-zone-labels" aria-hidden="true"><sc-for list="{{ labels }}" as="z" hint-placeholder-count="0"><span class="{{ z.lab_cls }}" style="{{ z.pos }}"><sc-if value="{{ z.sel }}" hint-placeholder-val="{{ false }}"><b>{{ z.name }}</b></sc-if>{{ z.val }}<sc-if value="{{ z.up }}" hint-placeholder-val="{{ false }}"><i>↑</i></sc-if></span></sc-for></div></sc-if>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"dots":{"editor":null},"svc":{"editor":"text","default":"all"},"svcs":{"editor":null},"couriers":{"editor":"boolean","default":true},"pins":{"editor":null},"zones":{"editor":null},"focus":{"editor":null},"activeId":{"editor":"text","default":""},"me":{"editor":"boolean","default":true},"locked":{"editor":"boolean"},"compact":{"editor":"boolean"},"fill":{"editor":"boolean"},"$preview":{"width":360,"height":440}}'>
// условная схема центра Москвы: курьеры на смене точками в цвет сервиса, вы тёмной точкой
// это не настоящая карта, точки примерные, с точностью до квартала
const RCM_DEMO = [
  [70, 60, 'samokat'], [104, 96, 'samokat'], [120, 120, 'vkusvill'], [84, 132, 'yandex-eda'], [150, 104, 'yandex-eda'],
  [178, 128, 'samokat'], [206, 118, 'x5'], [196, 170, 'yandex-eda'], [230, 150, 'vkusvill'], [160, 180, 'samokat'],
  [132, 214, 'yandex-eda'], [210, 206, 'yandex-eda'], [244, 222, 'samokat'], [272, 176, 'x5'], [300, 150, 'yandex-eda'],
  [58, 230, 'vkusvill'], [96, 256, 'samokat'], [168, 270, 'x5'], [212, 280, 'yandex-eda'], [264, 290, 'vkusvill'],
  [300, 250, 'samokat'], [130, 318, 'yandex-eda'], [190, 330, 'samokat'], [240, 350, 'yandex-eda'], [70, 350, 'x5'],
  [320, 330, 'yandex-eda'], [150, 400, 'vkusvill'], [36, 190, 'yandex-eda'], [330, 90, 'samokat'], [226, 60, 'yandex-eda']
];
// районы схемы: контур и место подписи, ключи как в рейтинге Где выгоднее
const RCM_ZONES = {
  begovoy: { d: 'M20 30L150 30L140 120L40 130Z', x: 88, y: 80 },
  meshchansky: { d: 'M150 30L265 30L250 110L140 120Z', x: 202, y: 70 },
  krasnoselsky: { d: 'M265 30L350 40L345 150L250 110Z', x: 302, y: 86 },
  presnya: { d: 'M40 130L140 120L150 205L60 215Z', x: 98, y: 168 },
  tverskoy: { d: 'M140 120L250 110L235 190L150 205Z', x: 194, y: 156 },
  basmanny: { d: 'M250 110L345 150L335 235L235 190Z', x: 292, y: 178 },
  dorogomilovo: { d: 'M10 215L60 215L150 205L120 300L15 310Z', x: 62, y: 258 },
  arbat: { d: 'M150 205L235 190L215 290L120 300Z', x: 178, y: 246 },
  zamoskvorechye: { d: 'M235 190L335 235L320 330L215 290Z', x: 274, y: 262 },
  khamovniki: { d: 'M15 310L120 300L215 290L320 330L260 420L80 420Z', x: 168, y: 362 }
};
// разбор контура района и проверка точки внутри
const rcmPoly = (d) => (d.match(/-?\d+(\.\d+)?/g) || []).map(Number).reduce((a, v, i, arr) => (i % 2 ? a : a.concat([[v, arr[i + 1]]])), []);
const rcmInside = (x, y, poly) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
// соты с вершиной вверх, радиус 9
const RCM_HEXES = (() => {
  const r = 9, w = Math.sqrt(3) * r, out = [];
  for (let row = 0, y = 0; y < 452; row++, y += r * 1.5) {
    for (let x = (row % 2) * w / 2; x < 372; x += w) {
      const pts = [0, 1, 2, 3, 4, 5].map((k) => { const a = Math.PI / 180 * (60 * k - 90); return (x + r * 0.94 * Math.cos(a)).toFixed(1) + ' ' + (y + r * 0.94 * Math.sin(a)).toFixed(1); });
      out.push({ x, y, d: 'M' + pts.join('L') + 'Z' });
    }
  }
  return out;
})();
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const svc = p.svc || 'all';
    const locked = !!p.locked;
    const compact = !!p.compact;
    const sel = Array.isArray(p.svcs) ? p.svcs : (svc === 'all' ? [] : [svc]);
    const all = (p.dots || RCM_DEMO.map(([x, y, s]) => ({ x, y, svc: s })));
    // couriers=false: курьеров не рисуем, остаются карта, ваша точка и сообщения
    const dots = (p.couriers === false || p.hideCouriers ? [] : all).filter((d) => !sel.length || sel.indexOf(d.svc) !== -1).map((d) => ({ x: d.x, y: d.y, r: compact ? 7 : 6.5, style: 'fill:var(--raznos-svc-' + d.svc + ')' }));
    const showMe = p.me !== false && !p.hideMe;
    // сообщения курьеров значком комментария с хвостиком в точку места
    const pins = (Array.isArray(p.pins) ? p.pins : []).map((pn) => ({
      tf: 'translate(' + pn.x + ' ' + pn.y + ')', style: 'color:var(--raznos-svc-' + pn.svc + ')',
      cls: 'rcm-pin' + (pn.id === p.activeId ? ' rcm-pin-active' : ''), tap: pn.tap || (() => {})
    }));
    // zones: [{ k, name, val, t (0..1 выгода), up (растёт), top (лучший), sel, tap }], пустой t значит сервиса в районе нет
    const zones = (Array.isArray(p.zones) ? p.zones : []).filter((z) => RCM_ZONES[z.k]).map((z) => {
      const g = RCM_ZONES[z.k];
      const lvl = z.t == null ? 0 : (z.t >= 0.75 ? 3 : (z.t >= 0.45 ? 2 : (z.t >= 0.2 ? 1 : 0)));
      return {
        k: z.k, d: g.d, poly: rcmPoly(g.d), lvl, cx: g.x, cy: g.y, sel: !!z.sel, up: !!z.up, name: z.name || '', val: z.val || '',
        pos: 'left:' + (g.x / 3.6) + '%;top:' + (g.y / 4.4) + '%', title: z.name + (z.val ? ', ' + z.val : ''),
        tap: z.tap || (() => {})
      };
    });
    const hexes = [];
    if (zones.length) {
      RCM_HEXES.forEach((h) => {
        const z = zones.find((zz) => rcmInside(h.x, h.y, zz.poly));
        if (!z) return;
        // пятно вокруг центра района: у лучших шире, у средних меньше, у остальных только если выбран
        const R = z.lvl === 3 ? 52 : (z.lvl === 2 ? 40 : (z.sel ? 30 : 0));
        const dist = Math.hypot(h.x - z.cx, h.y - z.cy);
        if (!R || dist > R) return;
        const core = dist < R * 0.55;
        hexes.push({ d: h.d, cls: 'rcm-hex ' + (z.lvl >= 2 ? 'rcm-hex-l' + (core ? z.lvl : z.lvl - 1) : 'rcm-hex-sel') + (z.sel ? ' rcm-hex-on' : '') });
      });
    }
    const selZ = zones.find((z) => z.sel);
    // метки только у лучших и у выбранного, остальные районы видно по сотам
    const labels = zones.filter((z) => z.sel || z.lvl >= 2).map((z) => ({ pos: z.pos, sel: z.sel, name: z.name, val: z.sel ? z.val : String(z.val).replace(/[^\d ]/g, '').trim(), up: z.up, lab_cls: 'rcm-zone-lab' + (z.sel ? ' rcm-lab-sel' : '') }));
    // focus: {x, y} приближает карту к точке, края не выходят за схему
    const f = p.focus;
    let vb = '0 0 360 440';
    if (f && typeof f.x === 'number') {
      const w = 225, h = 275;
      const x = Math.min(360 - w, Math.max(0, f.x - w / 2)), y = Math.min(440 - h, Math.max(0, f.y - h / 2));
      vb = x + ' ' + y + ' ' + w + ' ' + h;
    }
    return {
      vb, pins, zones, hexes, labels, has_zones: zones.length > 0, has_outline: false, outline: '',
      cls: 'rcm' + (p.fill ? ' rcm-fill' : '') + (locked ? ' rcm-locked' : '') + (compact ? ' rcm-compact' : '') + (zones.length ? ' rcm-zones-on' : ''),
      aria: locked ? 'Карта курьеров скрыта, пока вы не показываете себя' : 'Условная карта центра, курьеров на смене: ' + dots.length,
      dots: locked ? dots.filter((d, i) => i % 2 === 0) : dots, show_me: showMe && !locked, me_x: 108, me_y: 158, me_lx: 120, me_ly: 162, me_r: compact ? 7 : 7.5
    };
  }
}
</script></body></html>
