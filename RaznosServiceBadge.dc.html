<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" /></helmet>
      <button type="button" class="raznos-list-row raznos-row-btn" onClick="{{ onTap }}" style="{{ rowStyle }}">
        <dc-import name="RaznosIcon" svc="{{ svcName }}" alt="{{ title }}" size="md"></dc-import>
        <div class="raznos-list-main">
          <span class="raznos-fx raznos-ac raznos-gap8"><span class="raznos-list-title">{{ title }}</span><sc-if value="{{ beta }}" hint-placeholder-val="{{ false }}"><span class="raznos-status-pill raznos-pill-warn">Бета</span></sc-if></span>
          <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ true }}"><span class="raznos-text-small">{{ note }}</span></sc-if>
        </div>
        <sc-if value="{{ hasAction }}" hint-placeholder-val="{{ false }}"><span class="raznos-btn raznos-btn-secondary raznos-btn-small">{{ actionLabel }}</span></sc-if>
        <sc-if value="{{ hasStatus }}"><span class="{{ pillClass }}">{{ statusLabel }}</span></sc-if>
        <sc-if value="{{ showChevron }}"><span class="raznos-row-chevron">›</span></sc-if>
      </button>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{
      "svcName": { "editor": "text", "default": "vkusvill" },
      "title": { "editor": "text", "default": "ВкусВилл" },
      "note": { "editor": "text", "default": "" },
      "status": { "editor": "enum", "default": "none", "options": ["connected", "disabled", "unsupported", "limited", "exited", "soon", "none"] },
      "statusLabel": { "editor": "text", "default": "" },
      "showChevron": { "editor": "boolean", "default": false },
      "beta": { "editor": "boolean", "default": false },
      "actionLabel": { "editor": "text", "default": "" },
      "onTap": { "editor": null }
    }'>
      class Component extends DCLogic {
        renderVals() {
          const p = this.props || {};
          const status = p.status || 'none';
          const pillMap = {
            connected: 'raznos-status-pill raznos-pill-ok',
            disabled: 'raznos-status-pill raznos-pill-muted',
            unsupported: 'raznos-status-pill raznos-pill-concept',
            limited: 'raznos-status-pill raznos-pill-warn',
            exited: 'raznos-status-pill raznos-pill-muted',
            soon: 'raznos-status-pill raznos-pill-muted',
            relogin: 'raznos-status-pill raznos-pill-error',
            rate: 'raznos-status-pill raznos-pill-warn'
          };
          const labelMap = {
            connected: 'Подключено',
            disabled: 'Отключено',
            unsupported: 'Недоступно',
            limited: 'Бета',
            exited: 'Вы вышли',
            soon: 'Скоро'
          };
          return {
            svcName: p.svcName || 'vkusvill',
            title: p.title || '',
            hasNote: !!p.note,
            note: p.note || '',
            // Подключено без пояснения не повторяем, его уже сказал заголовок группы
            hasStatus: status !== 'none' && !(status === 'connected' && !p.statusLabel),
            pillClass: pillMap[status] || 'raznos-status-pill raznos-pill-muted',
            statusLabel: p.statusLabel || labelMap[status] || '',
            showChevron: !!p.showChevron,
            beta: !!p.beta,
            hasAction: !!p.actionLabel, actionLabel: p.actionLabel || '',
            // Скоро: серая строка без цвета иконки
            rowStyle: [p.last ? 'border-bottom:0' : '', status === 'soon' ? 'opacity:0.55;filter:grayscale(1)' : ''].filter(Boolean).join(';'),
            onTap: p.onTap || (() => {})
          };
        }
      }
    </script>
  </body>
</html>
