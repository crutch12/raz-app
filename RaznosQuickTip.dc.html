<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rqt-layer { align-items: flex-end; padding: 0; }
    .rqt-sheet { box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 14px; padding: 8px 16px 16px; border-radius: 22px 22px 0 0; background: var(--raznos-surface); color: var(--raznos-ink); box-shadow: 0 -18px 48px rgba(20, 25, 40, .2); }
    .rqt-handle { width: 40px; height: 4px; align-self: center; border-radius: 999px; background: var(--raznos-line-strong); }
    .rqt-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: -6px; }
    .rqt-head h2 { margin: 0; font: 700 18px var(--raznos-font); }
    .rqt-close { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 12px; background: var(--raznos-surface-2); color: var(--raznos-ink); cursor: pointer; }
    .rqt-group { display: flex; flex-direction: column; gap: 8px; }
    .rqt-label { font: 600 13px var(--raznos-font); color: var(--raznos-ink-3); }
    .rqt-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .rqt-row::-webkit-scrollbar { display: none; }
    .rqt-amount { display: flex; align-items: baseline; gap: 6px; padding-bottom: 6px; border-bottom: 2px solid var(--raznos-line-strong); }
    .rqt-amount:focus-within { border-bottom-color: var(--raznos-green); }
    .rqt-amount input { min-width: 0; width: 100%; padding: 0; border: 0; background: transparent; color: var(--raznos-ink); font: 800 34px var(--raznos-font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; caret-color: var(--raznos-green); outline: none; }
    .rqt-amount span { font: 700 22px var(--raznos-font); color: var(--raznos-ink-3); }
    .rqt-order { flex: none; min-height: 40px; padding: 0 14px; border: 1px solid var(--raznos-line); border-radius: 999px; background: var(--raznos-surface); font: 600 13.5px var(--raznos-font); color: var(--raznos-ink-2); cursor: pointer; white-space: nowrap; }
    .rqt-order.raznos-is-active { border-color: var(--raznos-dark); background: var(--raznos-dark); color: var(--raznos-on-dark); }
    .rqt-order:focus-visible, .rqt-close:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    @media (prefers-reduced-motion: no-preference) {
      .rqt-sheet { animation: rqt-in .24s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes rqt-in { from { transform: translateY(100%); } to { transform: none; } }
    }
  </style>
</helmet>
<div class="raznos-dialog-layer rqt-layer" onClick="{{ close }}">
  <section class="rqt-sheet" role="dialog" aria-modal="true" aria-label="Наличные чаевые" onClick="{{ stop }}">
    <span class="rqt-handle" aria-hidden="true"></span>
    <div class="rqt-head"><h2>Наличные чаевые</h2><button type="button" class="rqt-close" onClick="{{ close }}" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <label class="rqt-amount"><input class="rqt-input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="0" value="{{ amount }}" onChange="{{ amount_change }}" onKeyDown="{{ key_down }}" aria-label="Сумма чаевых в рублях" /><span>₽</span></label>
    <sc-if value="{{ has_orders }}" hint-placeholder-val="{{ true }}"><div class="rqt-group"><span class="rqt-label">За какой заказ</span><div class="rqt-row"><sc-for list="{{ orders }}" as="o" hint-placeholder-count="3"><button type="button" class="{{ o.cls }}" onClick="{{ o.tap }}" aria-pressed="{{ o.on }}">{{ o.label }}</button></sc-for></div></div></sc-if>
    <button type="button" class="{{ add_cls }}" onClick="{{ add }}" disabled="{{ add_disabled }}">{{ add_label }}</button>
  </section>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"orders":{"editor":null},"defaultId":{"editor":"text","default":""},"onAdd":{"editor":null},"onClose":{"editor":null},"$preview":{"width":390,"height":380}}'>
// чаевые наличными сейчас: сумма сразу в фокусе, последний доставленный заказ выбран заранее
const RQT_DEMO_ORDERS = [{ id: 'a', label: '15:12 · Правды ул.' }, { id: 'b', label: '14:50 · Тверская ул.' }, { id: 'c', label: '14:28 · Баррикадная ул.' }];
const rqtFmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
class Component extends DCLogic {
  componentDidMount() {
    // клавиатура сразу открыта, чтобы ввести сумму без лишнего тапа
    setTimeout(() => { const el = typeof document !== 'undefined' ? document.querySelector('.rqt-input') : null; if (el && el.focus) el.focus(); }, 60);
  }
  renderVals() {
    const p = this.props || {};
    const st = this.state || {};
    const set = (patch) => this.setState(patch);
    const orders = Array.isArray(p.orders) ? p.orders : RQT_DEMO_ORDERS;
    const cur = st.orderId || p.defaultId || (orders[0] ? orders[0].id : '');
    const amountText = st.amount || '';
    const amount = parseFloat(String(amountText).replace(',', '.').replace(/[^\d.]/g, '')) || 0;
    const add = () => { if (amount > 0 && typeof p.onAdd === 'function') p.onAdd(cur, Math.round(amount * 100) / 100); };
    const close = () => { if (typeof p.onClose === 'function') p.onClose(); };
    return {
      amount: amountText,
      amount_change: (e) => set({ amount: e && e.target ? e.target.value : '' }),
      key_down: (e) => { if (e && e.key === 'Enter') add(); },
      has_orders: orders.length > 0,
      orders: orders.map((o) => ({ label: o.label, on: o.id === cur, cls: 'rqt-order' + (o.id === cur ? ' raznos-is-active' : ''), tap: () => set({ orderId: o.id }) })),
      add, add_disabled: !(amount > 0),
      add_cls: amount > 0 ? 'raznos-btn raznos-btn-primary' : 'raznos-btn-disabled',
      add_label: amount > 0 ? 'Добавить +' + rqtFmt(amount) + ' ₽' : 'Добавить',
      close, stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); }
    };
  }
}
</script></body></html>
