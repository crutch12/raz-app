<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    /* часть отзыва о заказе: оценка звёздами, что было не так чипами, свой комментарий; поле появляется, как только начали отзыв */
    .rrb { display: flex; flex-direction: column; gap: 10px; padding: 14px 0 4px; font-family: var(--raznos-font); }
    .rrb-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .rrb-title { font: 650 15px var(--raznos-font); color: var(--raznos-ink); }
    .rrb-stars { display: inline-flex; gap: 2px; margin: -4px 0 -2px -6px; }
    .rrb-star { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; background: none; cursor: pointer; color: var(--raznos-line-strong); }
    .rrb-star svg { width: 28px; height: 28px; fill: currentColor; }
    .rrb-star.rrb-is-on { color: var(--raznos-amber); }
    @media (prefers-reduced-motion: no-preference) { .rrb-star.rrb-is-on svg { animation: rrb-pop .22s cubic-bezier(.16, 1, .3, 1); } @keyframes rrb-pop { 50% { transform: scale(1.18); } } }
    .rrb-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .rrb-tag { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--raznos-line-strong); background: var(--raznos-surface); font: 600 13px var(--raznos-font); color: var(--raznos-ink-2); cursor: pointer; }
    .rrb-tag.rrb-is-on { border-color: var(--raznos-dark); background: var(--raznos-dark); color: var(--raznos-on-dark); }
    .rrb-text { box-sizing: border-box; width: 100%; min-height: 72px; resize: vertical; padding: 10px 12px; border: 1px solid var(--raznos-line-strong); border-radius: 12px; background: var(--raznos-surface); font: 400 15px/1.4 var(--raznos-font); color: var(--raznos-ink); }
    .rrb-text::placeholder { color: var(--raznos-ink-3); }
    .rrb-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: -2px; font: 500 12px var(--raznos-font); color: var(--raznos-ink-3); }
    .rrb-clear { min-height: 32px; padding: 0 2px; border: 0; background: none; font: 600 13px var(--raznos-font); color: var(--raznos-ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .rrb-star:focus-visible, .rrb-tag:focus-visible, .rrb-text:focus-visible, .rrb-clear:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
  </style>
</helmet>
<section class="rrb" aria-label="{{ title }}">
  <div class="rrb-head"><span class="rrb-title">{{ title }}</span><span class="{{ pill_cls }}">{{ pill }}</span></div>
  <sc-if value="{{ has_stars }}" hint-placeholder-val="{{ true }}">
    <div class="rrb-stars" role="group" aria-label="{{ stars_label }}"><sc-for list="{{ stars }}" as="st" hint-placeholder-count="5"><button type="button" class="{{ st.cls }}" aria-label="{{ st.label }}" aria-pressed="{{ st.on }}" onClick="{{ st.tap }}"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1l2.7 6 6.3.6-4.8 4.2 1.4 6.2L10 14.9 4.4 18l1.4-6.2L1 7.6l6.3-.6z" /></svg></button></sc-for></div>
  </sc-if>
  <div class="rrb-tags" role="group" aria-label="Что было не так"><sc-for list="{{ tags }}" as="tg" hint-placeholder-count="4"><button type="button" class="{{ tg.cls }}" aria-pressed="{{ tg.on }}" onClick="{{ tg.tap }}">{{ tg.label }}</button></sc-for></div>
  <sc-if value="{{ show_text }}" hint-placeholder-val="{{ true }}">
    <textarea class="rrb-text" rows="3" placeholder="{{ placeholder }}" aria-label="{{ text_label }}" value="{{ text }}" onChange="{{ change }}"></textarea>
    <div class="rrb-foot"><span>{{ foot }}</span><button type="button" class="rrb-clear" onClick="{{ clear }}">Очистить</button></div>
  </sc-if>
</section>
</x-dc><script type="text/x-dc" data-dc-script data-props='{
  "title": { "editor": "text", "default": "Место доставки" },
  "pill": { "editor": "text", "default": "Видно всем" },
  "pillTone": { "editor": "text", "default": "ok" },
  "stars": { "editor": "boolean", "default": true },
  "rating": { "editor": "int", "default": 0 },
  "tags": { "editor": null },
  "selected": { "editor": null },
  "text": { "editor": "text", "default": "" },
  "placeholder": { "editor": "text", "default": "Подъезд, домофон, где оставить" },
  "foot": { "editor": "text", "default": "" },
  "onRate": { "editor": null },
  "onTag": { "editor": null },
  "onText": { "editor": null },
  "onClear": { "editor": null },
  "$preview": { "width": 360, "height": 300 }
}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const fn = (f) => (typeof f === 'function' ? f : () => {});
    const rating = p.rating || 0;
    const tags = Array.isArray(p.tags) ? p.tags : ['Не работает домофон', 'Нет лифта', 'Сложно найти вход', 'Неверный адрес'];
    const selected = Array.isArray(p.selected) ? p.selected : [];
    const text = p.text || '';
    const hasStars = p.stars !== false;
    return {
      title: p.title || 'Место доставки', pill: p.pill || 'Видно всем',
      pill_cls: 'raznos-status-pill ' + (p.pillTone === 'private' ? 'raznos-pill-concept' : 'raznos-pill-ok'),
      has_stars: hasStars, stars_label: (p.title || 'Оценка') + ', ' + rating + ' из 5',
      stars: [1, 2, 3, 4, 5].map((n) => ({ cls: 'rrb-star' + (n <= rating ? ' rrb-is-on' : ''), on: n <= rating, label: n + ' из 5', tap: () => fn(p.onRate)(n === rating ? 0 : n) })),
      tags: tags.map((label) => ({ label, on: selected.indexOf(label) !== -1, cls: 'rrb-tag' + (selected.indexOf(label) !== -1 ? ' rrb-is-on' : ''), tap: () => fn(p.onTag)(label) })),
      // поле видно, как только начали отзыв: оценка, чип или уже есть текст
      show_text: rating > 0 || selected.length > 0 || !!text,
      text, placeholder: p.placeholder || 'Комментарий', text_label: 'Комментарий: ' + (p.title || ''),
      foot: p.foot || '',
      change: (e) => fn(p.onText)(e && e.target ? e.target.value : ''),
      clear: () => fn(p.onClear)()
    };
  }
}
</script></body></html>
