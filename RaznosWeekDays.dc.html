<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    /* лента недели: прошлая, текущая, следующая; свайп двигает ленту, соседняя неделя видна сразу */
    .rwd-row { display: flex; align-items: center; gap: 0; margin: 0 -12px; }
    .rwd-step { width: 44px; height: 48px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--raznos-ink-2); cursor: pointer; }
    .rwd-step:disabled { color: var(--raznos-line-strong); cursor: default; }
    .rwd-step:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .rwd-view { flex: 1; min-width: 0; overflow: hidden; touch-action: pan-y; user-select: none; }
    .rwd-track { display: flex; width: 300%; transform: translateX(-33.3333%); }
    .rwd-track > .rwd-days { flex: 0 0 33.3333%; }
    .rwd-ghost .rwd-day { cursor: default; }
    .rwd-days { touch-action: pan-y; user-select: none; flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    /* листание недели: дни въезжают с той стороны, куда листали */
    @media (prefers-reduced-motion: no-preference) {
      .rwd-days.rwd-next-a, .rwd-days.rwd-next-b { animation: rwd-next .32s cubic-bezier(.16, 1, .3, 1); }
      .rwd-days.rwd-prev-a, .rwd-days.rwd-prev-b { animation: rwd-prev .32s cubic-bezier(.16, 1, .3, 1); }
      @keyframes rwd-next { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
      @keyframes rwd-prev { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
    }
    .rwd-day { box-sizing: border-box; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding: 7px 0 6px; border-radius: 12px; border: 0; background: transparent; cursor: pointer; font: inherit; color: var(--raznos-ink); }
    .rwd-day:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 1px; }
    .rwd-day:disabled { cursor: default; opacity: 0.45; }
    .rwd-day > .rwd-d { font: 600 11px var(--raznos-font); color: var(--raznos-ink-3); }
    .rwd-day > .rwd-n { font: 700 16px var(--raznos-mono); font-variant-numeric: tabular-nums; }
    .rwd-dots { display: flex; gap: 2px; height: 5px; }
    .rwd-dots > i { width: 5px; height: 5px; border-radius: 50%; }
    .rwd-day.rwd-off > .rwd-n { color: var(--raznos-ink-3); }
    .rwd-day.rwd-past > .rwd-n { color: var(--raznos-ink-3); }
    .rwd-day > .rwd-done { color: var(--raznos-green-deep); }
    .rwd-day.raznos-is-active > .rwd-done { color: var(--raznos-on-dark); }
    .rwd-day.raznos-is-active { background: var(--raznos-dark); color: var(--raznos-on-dark); }
    /* сегодня видно всегда: зелёная рамка и число, рамка остаётся и у выбранного; высота у всех дней одна */
    .rwd-day.rwd-today { box-shadow: inset 0 0 0 2px var(--raznos-green); }
    .rwd-day.rwd-today > .rwd-n { color: var(--raznos-green-deep); }
    .rwd-day.rwd-today.raznos-is-active { box-shadow: inset 0 0 0 2px var(--raznos-green), inset 0 0 0 4px var(--raznos-dark); }
    .rwd-day.rwd-today.raznos-is-active > .rwd-n { color: var(--raznos-on-dark); }
    .rwd-day.raznos-is-active > .rwd-d { color: color-mix(in oklab, var(--raznos-on-dark) 70%, transparent); }
    .rwd-day.raznos-is-active > .rwd-n { color: var(--raznos-on-dark); }
    /* уровень дня одной зелёной шкалой вместо точек: прошлое сплошное, прогноз штрихом */
    .rwd-row { --rwd-lv1: oklch(0.92 0.035 150); --rwd-lv2: oklch(0.85 0.07 150); --rwd-lv3: oklch(0.74 0.11 150); --rwd-lv4: oklch(0.62 0.13 150); --rwd-lv5: oklch(0.5 0.12 150); --rwd-hatch: oklch(1 0 0 / 0.65); }
    .raznos-theme-dark .rwd-row { --rwd-lv1: oklch(0.34 0.03 150); --rwd-lv2: oklch(0.42 0.06 150); --rwd-lv3: oklch(0.52 0.09 150); --rwd-lv4: oklch(0.62 0.12 150); --rwd-lv5: oklch(0.72 0.14 150); --rwd-hatch: oklch(0.2 0.01 250 / 0.65); }
    .rwd-lv { width: 22px; height: 5px; margin-top: 1px; border-radius: 3px; background: var(--rwd-lv1); }
    .rwd-lv-2 { background: var(--rwd-lv2); } .rwd-lv-3 { background: var(--rwd-lv3); } .rwd-lv-4 { background: var(--rwd-lv4); } .rwd-lv-5 { background: var(--rwd-lv5); }
    .rwd-lv-fc { background-image: repeating-linear-gradient(135deg, transparent 0 3px, var(--rwd-hatch) 3px 5px); }
    .rwd-day.raznos-is-active .rwd-lv { box-shadow: 0 0 0 1px color-mix(in oklab, var(--raznos-on-dark) 35%, transparent); }
  </style>
</helmet>
<div class="rwd-row" data-rwd="{{ uid }}">
  <button type="button" class="rwd-step" onClick="{{ go_prev }}" disabled="{{ prev_off }}" aria-label="{{ prev_aria }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="rwd-view">
    <div class="rwd-track">
      <div class="rwd-days rwd-ghost" aria-hidden="true">
        <sc-for list="{{ ghost_prev }}" as="g" hint-placeholder-count="7"><span class="{{ g.cls }}"><span class="rwd-d">{{ g.dow }}</span><span class="rwd-n">{{ g.date }}</span><sc-if value="{{ g.show_dots }}" hint-placeholder-val="{{ true }}"><span class="rwd-dots"><sc-for list="{{ g.dots }}" as="dt" hint-placeholder-count="2"><i style="{{ dt }}"></i></sc-for></span></sc-if><sc-if value="{{ g.has_lv }}" hint-placeholder-val="{{ false }}"><i class="{{ g.lv_cls }}"></i></sc-if></span></sc-for>
      </div>
      <div class="{{ days_cls }}" role="group" aria-label="{{ label }}">
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <button type="button" class="{{ d.cls }}" onClick="{{ d.tap }}" disabled="{{ d.off }}" aria-label="{{ d.aria }}" aria-pressed="{{ d.sel }}"><span class="rwd-d">{{ d.dow }}</span><span class="rwd-n">{{ d.date }}</span><sc-if value="{{ d.done }}" hint-placeholder-val="{{ false }}"><svg class="rwd-done" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></sc-if><sc-if value="{{ d.show_dots }}" hint-placeholder-val="{{ true }}"><span class="rwd-dots"><sc-for list="{{ d.dots }}" as="dot" hint-placeholder-count="2"><i style="{{ dot }}"></i></sc-for></span></sc-if><sc-if value="{{ d.has_lv }}" hint-placeholder-val="{{ false }}"><i class="{{ d.lv_cls }}" aria-hidden="true"></i></sc-if></button>
        </sc-for>
      </div>
      <div class="rwd-days rwd-ghost" aria-hidden="true">
        <sc-for list="{{ ghost_next }}" as="g" hint-placeholder-count="7"><span class="{{ g.cls }}"><span class="rwd-d">{{ g.dow }}</span><span class="rwd-n">{{ g.date }}</span><sc-if value="{{ g.show_dots }}" hint-placeholder-val="{{ true }}"><span class="rwd-dots"><sc-for list="{{ g.dots }}" as="dt" hint-placeholder-count="2"><i style="{{ dt }}"></i></sc-for></span></sc-if><sc-if value="{{ g.has_lv }}" hint-placeholder-val="{{ false }}"><i class="{{ g.lv_cls }}"></i></sc-if></span></sc-for>
      </div>
    </div>
  </div>
  <button type="button" class="rwd-step" onClick="{{ go_next }}" disabled="{{ next_off }}" aria-label="{{ next_aria }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"days":{"editor":null},"prevDays":{"editor":null},"nextDays":{"editor":null},"weekKey":{"editor":"number","default":0},"canPrev":{"editor":"boolean","default":true},"canNext":{"editor":"boolean","default":true},"label":{"editor":"text","default":"Дни недели"},"onPick":{"editor":null},"onPrev":{"editor":null},"onNext":{"editor":null},"$preview":{"width":390,"height":80}}'>
// выбор дня недели из Плана: неделя по дням, стрелки и свайп листают недели, соседние недели видны при свайпе
// days, prevDays, nextDays: [{ key, dow, date, today, sel, past, off (выходной), disabled, done, dots: ['background:...'], level 1..5, fc, aria }]
// под числом либо точки сервисов (План), либо галка выполненного, либо полоса уровня дня (Рынок, прогноз штрихом)
// weekKey номер недели, по его смене дни въезжают с той стороны, куда листали; onPick(key), onPrev(), onNext()
const RWD_WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const rwdPreview = (off) => {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const mon = new Date(t); mon.setDate(t.getDate() - (t.getDay() + 6) % 7 + off * 7);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const k = Math.round((d - t) / 864e5);
    return { key: String(k), dow: RWD_WD[d.getDay()], date: String(d.getDate()), today: k === 0, past: k < 0, fc: k > 0, level: 1 + ((i * 3 + off + 7) % 5), aria: RWD_WD[d.getDay()] + ' ' + d.getDate() };
  });
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const st = this.state || {};
    const ext = typeof p.onPick === 'function';
    // без данных (превью в ДС) неделю и выбор держим у себя
    const local = !Array.isArray(p.days);
    const week = local ? (st.week || 0) : (+p.weekKey || 0);
    const list = local ? rwdPreview(week) : p.days;
    const selKey = local ? (st.sel != null ? st.sel : '0') : null;
    const canPrev = local ? week > -1 : p.canPrev !== false;
    const canNext = local ? week < 1 : p.canNext !== false;
    const goPrev = () => { if (!canPrev) return; if (local) this.setState({ week: week - 1 }); else if (typeof p.onPrev === 'function') p.onPrev(); };
    const goNext = () => { if (!canNext) return; if (local) this.setState({ week: week + 1 }); else if (typeof p.onNext === 'function') p.onNext(); };
    // колбэки для свайпа
    this._go = { prev: goPrev, next: goNext };
    this._can = { prev: canPrev, next: canNext };
    if (!this._uid) this._uid = 'rwd' + Math.random().toString(36).slice(2, 8);
    // свайп привязываем и тут: при подмене логики didMount может не прийти
    if (!this._swipeOff) setTimeout(() => this.bindSwipe(), 0);
    if (this._swipeNav) { this._swipeNav = false; this._anim = null; }
    else if (this._week != null && this._week !== week) this._anim = { n: ((this._anim && this._anim.n) || 0) + 1, dir: week > this._week ? 'next' : 'prev' };
    this._week = week;
    const anim = this._anim;
    const clsOf = (d, sel) => 'rwd-day' + (d.today ? ' rwd-today' : '') + (sel ? ' raznos-is-active' : '') + (d.off ? ' rwd-off' : '') + (d.past ? ' rwd-past' : '');
    const footOf = (d) => {
      const lv = +d.level || 0;
      const dots = Array.isArray(d.dots) ? d.dots : [];
      return { dots, show_dots: !lv && !d.done, has_lv: lv > 0, lv_cls: 'rwd-lv rwd-lv-' + Math.max(1, Math.min(5, lv)) + (d.fc ? ' rwd-lv-fc' : '') };
    };
    const ghost = (arr) => (Array.isArray(arr) ? arr : (local ? null : [])) || [];
    return {
      uid: this._uid, label: p.label || 'Дни недели',
      prev_off: !canPrev, next_off: !canNext, go_prev: goPrev, go_next: goNext,
      prev_aria: p.prevAria || 'Прошлая неделя', next_aria: p.nextAria || 'Следующая неделя',
      days_cls: 'rwd-days' + (anim ? ' rwd-' + anim.dir + '-' + (anim.n % 2 ? 'a' : 'b') : ''),
      days: list.map((d) => {
        const sel = local ? d.key === selKey : !!d.sel;
        return Object.assign({
          cls: clsOf(d, sel), dow: d.dow, date: d.date, aria: d.aria || (d.dow + ' ' + d.date), sel: String(sel), off: !!d.disabled, done: !!d.done,
          tap: () => { if (d.disabled) return; if (local) this.setState({ sel: d.key }); else if (ext) p.onPick(d.key); }
        }, footOf(d));
      }),
      ghost_prev: (local ? rwdPreview(week - 1) : ghost(p.prevDays)).map((d) => Object.assign({ cls: clsOf(d, false), dow: d.dow, date: d.date }, footOf(d))),
      ghost_next: (local ? rwdPreview(week + 1) : ghost(p.nextDays)).map((d) => Object.assign({ cls: clsOf(d, false), dow: d.dow, date: d.date }, footOf(d)))
    };
  }

  componentDidMount() { this.bindSwipe(); }
  componentWillUnmount() { if (this._swipeOff) this._swipeOff(); this._swipeOff = null; this._dead = true; }

  // листание недели свайпом и горизонтальной прокруткой, как в swiper: полоса едет за пальцем, дальше порога листаем
  bindSwipe() {
    if (typeof document === 'undefined' || this._swipeOff || this._dead) return;
    // ленту ищем от точки касания: копий разметки на странице может быть несколько
    const viewOf = (t) => { const v = t && t.closest ? t.closest('.rwd-view') : null; const r = v && v.closest('[data-rwd]'); return r && r.getAttribute('data-rwd') === this._uid ? v : null; };
    let drag = null, wheelAt = 0;
    const can = (dir) => (this._can || {})[dir];
    const go = (dir) => { const f = (this._go || {})[dir]; if (f) f(); };
    const down = (e) => {
      const el = viewOf(e.target); if (!el) return;
      drag = { x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, on: false, el: el.querySelector('.rwd-track') || el };
    };
    const move = (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.on) { if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) { if (Math.abs(dy) > 10) drag = null; return; } drag.on = true; drag.el.style.transition = 'none'; }
      // у края, где листать нельзя, полоса тянется с сопротивлением
      const dir = dx < 0 ? 'next' : 'prev';
      drag.dx = can(dir) ? dx : dx / 4;
      drag.el.style.transform = 'translateX(calc(-33.3333% + ' + drag.dx + 'px))';
    };
    const up = () => {
      if (!drag) return;
      const d = drag; drag = null;
      if (!d.on) return;
      const v = Math.abs(d.dx) / Math.max(1, performance.now() - d.t);
      const dir = d.dx < 0 ? 'next' : 'prev';
      d.el.style.transition = 'transform .28s cubic-bezier(.16, 1, .3, 1)';
      // тап по дню после свайпа не засчитываем
      const stop = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      document.addEventListener('click', stop, true); setTimeout(() => document.removeEventListener('click', stop, true), 0);
      if (can(dir) && (Math.abs(d.dx) > 60 || v > 0.5)) {
        // доезжаем до соседней недели, потом меняем данные и без анимации возвращаем ленту в центр
        d.el.style.transform = 'translateX(' + (dir === 'next' ? '-66.6667%' : '0%') + ')';
        setTimeout(() => { this._swipeNav = true; go(dir); d.el.style.transition = 'none'; d.el.style.transform = ''; }, 280);
      } else { d.el.style.transform = ''; }
    };
    const wheel = (e) => {
      if (!viewOf(e.target)) return;
      if (Math.abs(e.deltaX) < 30 || Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
      e.preventDefault();
      const now = performance.now(); if (now - wheelAt < 450) return; wheelAt = now;
      const dir = e.deltaX > 0 ? 'next' : 'prev'; if (can(dir)) go(dir);
    };
    document.addEventListener('pointerdown', down, true);
    document.addEventListener('pointermove', move, true);
    document.addEventListener('pointerup', up, true);
    document.addEventListener('pointercancel', up, true);
    document.addEventListener('wheel', wheel, { capture: true, passive: false });
    this._swipeOff = () => {
      document.removeEventListener('pointerdown', down, true); document.removeEventListener('pointermove', move, true);
      document.removeEventListener('pointerup', up, true); document.removeEventListener('pointercancel', up, true);
      document.removeEventListener('wheel', wheel, { capture: true });
    };
  }
}
</script></body></html>
