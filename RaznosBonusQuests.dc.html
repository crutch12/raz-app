<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    /* бонусы и задания сервисов: карточка на Сегодня для почти набранного и список всех */
    .rbq { display: flex; flex-direction: column; gap: 12px; font-family: var(--raznos-font); color: var(--raznos-ink); }
    .rbq-card { width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 0; border-radius: 16px; background: var(--raznos-surface); font: inherit; color: inherit; text-align: left; cursor: pointer; }
    .rbq-card:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .rbq-card.rbq-is-done { background: var(--raznos-green-tint); }
    .rbq-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .rbq-top-svc { font: 600 13px var(--raznos-font); color: var(--raznos-ink-3); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rbq-until { flex: none; padding: 3px 9px; border-radius: 999px; background: var(--raznos-amber-tint); font: 650 12.5px var(--raznos-font); color: var(--raznos-amber); white-space: nowrap; }
    .rbq-is-done .rbq-until { background: var(--raznos-surface); color: var(--raznos-green-deep); }
    .rbq-head { margin: 0; font: 700 18px/1.3 var(--raznos-font); letter-spacing: -0.01em; }
    .rbq-head b { font-weight: 800; color: var(--raznos-green-deep); white-space: nowrap; }
    /* полоса из делений: один заказ одно деление, у длинных целей сплошная. Набранное нейтральным, не цветом сервиса */
    .rbq-segs { display: flex; gap: 3px; height: 12px; }
    .rbq-seg { flex: 1 1 0; min-width: 3px; border-radius: 3px; background: var(--raznos-surface-2); box-shadow: inset 0 0 0 1px var(--raznos-line); }
    .rbq-seg.rbq-seg-on { box-shadow: none; }
    .rbq-bar { height: 10px; border-radius: 999px; background: var(--raznos-surface-2); overflow: hidden; }
    .rbq-bar > i { display: block; height: 100%; border-radius: inherit; }
    .rbq-meta { display: flex; justify-content: space-between; gap: 10px; font: 500 13px/1.35 var(--raznos-font); color: var(--raznos-ink-3); }
    .rbq-meta b { font-weight: 700; color: var(--raznos-ink); font-variant-numeric: tabular-nums; }
    .rbq-pace { margin: 0; font: 500 13.5px/1.4 var(--raznos-font); color: var(--raznos-ink-2); }
    .rbq-pace.rbq-is-tight { color: var(--raznos-amber); font-weight: 600; }
    @media (prefers-reduced-motion: no-preference) {
      .rbq-card .rbq-seg-on:last-of-type, .rbq-card .rbq-seg-last { animation: rbq-tick 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
      @keyframes rbq-tick { 0% { transform: scaleY(0.4); } 40% { transform: scaleY(1.35); } 100% { transform: none; } }
      .rbq-is-done .rbq-head b { display: inline-block; animation: rbq-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both; }
      @keyframes rbq-pop { from { transform: scale(0.8); opacity: 0; } }
    }
    /* список заданий */
    .rbq-list { display: flex; flex-direction: column; border-radius: 16px; background: var(--raznos-surface); }
    .rbq-item { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-bottom: 1px solid var(--raznos-line); }
    .rbq-item:last-child { border-bottom: 0; }
    .rbq-item-top { display: flex; align-items: center; gap: 10px; }
    .rbq-item-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .rbq-item-name { font: 650 15px/1.3 var(--raznos-font); }
    .rbq-item-svc { font: 500 12.5px var(--raznos-font); color: var(--raznos-ink-3); }
    .rbq-item-reward { flex: none; font: 750 15px var(--raznos-font); color: var(--raznos-green-deep); white-space: nowrap; }
    .rbq-item-rule { margin: 0; font: 500 12.5px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    .rbq-note { margin: -2px 0 0; font: 500 12px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
  </style>
</helmet>
<sc-if value="{{ is_card }}" hint-placeholder-val="{{ true }}">
  <button type="button" class="{{ card_cls }}" onClick="{{ open }}" aria-label="{{ card_aria }}">
    <span class="rbq-top"><dc-import name="RaznosIcon" svc="{{ hot.key }}" alt="{{ hot.title }}" size="sm"></dc-import><span class="rbq-top-svc">{{ hot.top }}</span><span class="rbq-until">{{ hot.until }}</span></span>
    <p class="rbq-head">{{ hot.head_a }}<b>{{ hot.head_b }}</b>{{ hot.head_c }}</p>
    <sc-if value="{{ hot.has_segs }}" hint-placeholder-val="{{ true }}"><span class="rbq-segs" aria-hidden="true"><sc-for list="{{ hot.segs }}" as="sg" hint-placeholder-count="20"><i class="{{ sg.cls }}" style="{{ sg.style }}"></i></sc-for></span></sc-if>
    <sc-if value="{{ hot.has_bar }}" hint-placeholder-val="{{ false }}"><span class="rbq-bar" aria-hidden="true"><i style="{{ hot.bar }}"></i></span></sc-if>
    <span class="rbq-meta"><span><b>{{ hot.progress }}</b></span><span>{{ more_label }}</span></span>
    <sc-if value="{{ hot.has_pace }}" hint-placeholder-val="{{ true }}"><p class="{{ hot.pace_cls }}">{{ hot.pace }}</p></sc-if>
  </button>
</sc-if>
<sc-if value="{{ is_list }}" hint-placeholder-val="{{ false }}">
<div class="rbq">
  <div class="rbq-list">
    <sc-for list="{{ items }}" as="q" hint-placeholder-count="3">
      <div class="rbq-item">
        <div class="rbq-item-top"><dc-import name="RaznosIcon" svc="{{ q.key }}" alt="{{ q.title }}" size="sm"></dc-import><span class="rbq-item-main"><span class="rbq-item-name">{{ q.name }}</span><span class="rbq-item-svc">{{ q.title }} · {{ q.until_text }}</span></span><span class="rbq-item-reward">{{ q.reward }}</span></div>
        <sc-if value="{{ q.has_segs }}" hint-placeholder-val="{{ false }}"><span class="rbq-segs" aria-hidden="true"><sc-for list="{{ q.segs }}" as="sg" hint-placeholder-count="20"><i class="{{ sg.cls }}" style="{{ sg.style }}"></i></sc-for></span></sc-if>
        <sc-if value="{{ q.has_bar }}" hint-placeholder-val="{{ false }}"><span class="rbq-bar" aria-hidden="true"><i style="{{ q.bar }}"></i></span></sc-if>
        <sc-if value="{{ q.has_progress }}" hint-placeholder-val="{{ true }}"><span class="rbq-meta"><span><b>{{ q.progress }}</b></span><span>{{ q.left }}</span></span></sc-if>
        <p class="rbq-item-rule">{{ q.rule }}</p>
      </div>
    </sc-for>
  </div>
  <p class="rbq-note">Бонус не входит в доход, пока сервис его не начислил. Прогресс берём из приложения сервиса, отменённые заказы сервис обычно не считает</p>
</div>
</sc-if>
</x-dc><script type="text/x-dc" data-dc-script data-props='{
  "items": { "editor": null },
  "mode": { "editor": "enum", "options": ["card", "list"], "default": "card" },
  "hotId": { "editor": "text", "default": "" },
  "nowMin": { "editor": "int", "default": 940 },
  "onOpen": { "editor": null },
  "$preview": { "width": 360, "height": 240 }
}'>
const RBQ_FMT = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function rbqPlural(n, one, few, many) { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few; return many; }
// примеры для дизайн-системы, в приложении приходят из SERVICE_QUESTS
const RBQ_SAMPLE = [
  { id: 'ya', key: 'yandex-eda', title: 'Яндекс Еда', name: 'Персональная цель на день', reward: 1500, kind: 'count', done: 14, target: 20, untilMin: 1200, untilLabel: 'до 20:00', pace: 2.3, rule: 'Доставленные заказы с 10:00, отменённые не считаются' },
  { id: 'ku', key: 'kuper', title: 'Купер', name: 'Титул Опытный', rewardText: 'выше приоритет', kind: 'percent', percent: 62, untilLabel: 'до конца месяца', rule: 'Сервис показывает только процент, точное число заказов неизвестно' },
  { id: 'sm', key: 'samokat', title: 'Самокат', name: 'Вечерние заказы', rewardText: '×1,2 к оплате', kind: 'text', untilLabel: 'до воскресенья', rule: 'Заказы после 19:00 оплачиваются с коэффициентом 1,2, условия партнёра в вашем городе' }
];
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const items = Array.isArray(p.items) ? p.items : RBQ_SAMPLE;
    const nowMin = p.nowMin != null ? p.nowMin : 940;
    // набранное нейтральным тёмным: цвет сервиса бывает красно-оранжевым и читается как потеря, у набранной цели зелёный
    const color = (q) => (q.kind === 'count' && q.target && (q.done || 0) >= q.target ? 'var(--raznos-green)' : 'var(--raznos-ink-2)');
    const segsOf = (q) => {
      const target = q.target || 1, done = Math.min(q.done || 0, target);
      return Array.from({ length: target }, (_, i) => ({ cls: 'rbq-seg' + (i < done ? ' rbq-seg-on' : '') + (i === done - 1 ? ' rbq-seg-last' : ''), style: i < done ? 'background:' + color(q) : '' }));
    };
    const rewardOf = (q) => q.reward ? '+' + RBQ_FMT(q.reward) + ' ₽' : (q.rewardText || '');
    const minsLabel = (m) => { const h = Math.floor(m / 60), mm = m % 60; return (h ? h + ' ч' : '') + (h && mm ? ' ' : '') + (mm ? mm + ' мин' : ''); };
    const view = (q) => {
      const isCount = q.kind === 'count' && q.target;
      const left = isCount ? Math.max(0, q.target - (q.done || 0)) : 0;
      const segs = isCount && q.target <= 30;
      const done = isCount && left === 0;
      // заказы считаются со смены: до её начала время не идёт в счёт
      const startMin = q.fromMin != null ? Math.max(q.fromMin, nowMin) : nowMin;
      const timeLeft = q.untilMin != null ? q.untilMin - startMin : null;
      const notStarted = q.fromMin != null && q.fromMin > nowMin;
      // темп: сколько заказов в час нужно до срока против обычного темпа курьера
      const need = isCount && timeLeft > 0 && left > 0 ? left / (timeLeft / 60) : null;
      const tight = need != null && q.pace ? need > q.pace : false;
      return {
        key: q.key, title: q.title, name: q.name, reward: rewardOf(q),
        until: done ? 'набрано' : (q.untilLabel || ''), until_text: q.untilLabel || 'без срока',
        top: q.title,
        head_a: done ? 'Цель набрана, ' : (isCount ? 'Осталось ' + left + ' ' + rbqPlural(left, 'заказ', 'заказа', 'заказов') + ' до ' : q.name + ': '),
        head_b: rewardOf(q),
        head_c: done ? ' начислит ' + q.title : (isCount ? '' : ''),
        has_segs: segs, segs: segs ? segsOf(q) : [],
        has_bar: (isCount && !segs) || q.kind === 'percent',
        bar: 'width:' + (q.kind === 'percent' ? q.percent : Math.round((q.done || 0) * 100 / (q.target || 1))) + '%;background:' + color(q),
        has_progress: isCount || q.kind === 'percent',
        progress: isCount ? (q.done || 0) + ' из ' + q.target : (q.kind === 'percent' ? q.percent + '%' : ''),
        left: isCount ? (done ? 'ждём начисления' : 'осталось ' + left) : (q.kind === 'percent' ? 'точное число сервис не показывает' : ''),
        has_pace: isCount && !done && need != null,
        pace: need == null ? '' : (tight ? 'Нужно ' + String(Math.round(need * 10) / 10).replace('.', ',') + ' заказа в час, обычно у вас ' + String(q.pace).replace('.', ',') + ', можно не успеть' : (notStarted ? 'Смена с ' + q.fromLabel + ', до срока ' : 'До срока ') + minsLabel(timeLeft) + ', нужно ' + String(Math.round(need * 10) / 10).replace('.', ',') + ' заказа в час, обычно у вас ' + String(q.pace).replace('.', ',')),
        pace_cls: 'rbq-pace' + (tight ? ' rbq-is-tight' : ''),
        rule: q.rule || '', done
      };
    };
    const hotSrc = items.find((q) => q.id === p.hotId) || items.find((q) => q.kind === 'count') || items[0];
    const hot = hotSrc ? view(hotSrc) : null;
    const others = items.length - 1;
    return {
      is_card: p.mode !== 'list' && !!hot, is_list: p.mode === 'list',
      hot: hot || {}, card_cls: 'rbq-card' + (hot && hot.done ? ' rbq-is-done' : ''),
      card_aria: hot ? hot.head_a + hot.head_b + hot.head_c + ', ' + hot.until + ', все бонусы' : '',
      more_label: others > 0 ? 'все бонусы, ещё ' + others + ' ›' : 'подробнее ›',
      open: () => { if (p.onOpen) p.onOpen(); },
      items: items.map(view)
    };
  }
}
</script></body></html>
