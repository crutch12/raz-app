<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .ral { display: flex; flex-direction: column; gap: 8px; }
    .ral-title { margin: 0; font: 700 15px var(--raznos-font); color: var(--raznos-ink); }
    .ral-list { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; border-radius: 14px; background: var(--raznos-surface); }
    .ral-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--raznos-line); }
    .ral-row:first-child { border-top: 0; }
    .ral-dot { width: 8px; height: 8px; flex: none; align-self: flex-start; margin-top: 6px; border-radius: 50%; background: var(--raznos-ink-3); }
    .ral-row.ral-danger .ral-dot { background: var(--raznos-red); }
    .ral-row.ral-warn .ral-dot { background: var(--raznos-amber); }
    .ral-row.ral-info .ral-dot { background: var(--raznos-green); }
    .ral-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .ral-copy > b { font: 650 14px var(--raznos-font); color: var(--raznos-ink); }
    .ral-copy > span { font: 500 12.5px/1.35 var(--raznos-font); color: var(--raznos-ink-3); }
    .ral-act { flex: none; min-height: 36px; padding: 0 12px; border: 1px solid var(--raznos-line-strong); border-radius: 10px; background: var(--raznos-surface); font: 650 13px var(--raznos-font); color: var(--raznos-ink); cursor: pointer; }
    .ral-act.ral-act-on { border-color: transparent; background: color-mix(in oklab, var(--raznos-green) 14%, var(--raznos-surface)); color: var(--raznos-green-deep); }
    .ral-act:focus-visible, .ral-chev:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .ral-more { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border: 0; border-top: 1px solid var(--raznos-line); background: none; font: 650 13.5px var(--raznos-font); color: var(--raznos-green-deep); cursor: pointer; text-align: left; }
    .ral-more:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: -2px; }
    .ral-chev { flex: none; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--raznos-ink-3); cursor: pointer; }
  </style>
</helmet>
<section class="ral" aria-label="{{ title }}">
  <h2 class="ral-title">{{ title }}</h2>
  <ul class="ral-list">
    <sc-for list="{{ shown }}" as="it" hint-placeholder-count="3"><li class="{{ it.cls }}"><i class="ral-dot" aria-hidden="true"></i><span class="ral-copy"><b>{{ it.title }}</b><sc-if value="{{ it.text }}" hint-placeholder-val="{{ true }}"><span>{{ it.text }}</span></sc-if></span><sc-if value="{{ it.has_action }}" hint-placeholder-val="{{ true }}"><button type="button" class="{{ it.act_cls }}" onClick="{{ it.tap }}">{{ it.action }}</button></sc-if><sc-if value="{{ it.has_chev }}" hint-placeholder-val="{{ false }}"><button type="button" class="ral-chev" onClick="{{ it.tap }}" aria-label="Открыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></sc-if></li></sc-for>
    <sc-if value="{{ has_more }}" hint-placeholder-val="{{ false }}"><li><button type="button" class="ral-more" onClick="{{ toggle_more }}" aria-expanded="{{ expanded }}">{{ more_label }}<span aria-hidden="true">{{ more_icon }}</span></button></li></sc-if>
  </ul>
</section>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Требует внимания"},"items":{"editor":null},"demoLong":{"editor":"boolean","default":false},"$preview":{"width":366,"height":220}}'>
// что требует действия по сменам, одной строкой на пункт: пересечения, заявки, отмена, открытие записи
// демо-сегодня: реальная дата устройства, запись открывается в ближайший четверг на неделю после него
const RALM = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const RALAt = (off) => { const d = new Date(); d.setDate(d.getDate() + off); return d; };
const RALThu = (4 - new Date().getDay() + 7) % 7;
const RALDm = (d) => d.getDate() + ' ' + RALM[d.getMonth()];
const RALRange = (a, b) => (a.getMonth() === b.getMonth() ? a.getDate() + '–' : RALDm(a) + ' – ') + RALDm(b);
const RALOPENING = { title: 'Запись в Яндекс на ' + RALRange(RALAt(RALThu + 4), RALAt(RALThu + 10)), text: 'Откроется в чт ' + RALDm(RALAt(RALThu)) + ' в 10:00' };
const RAL_WD = ['воскресенье', 'понедельник', 'вторник', 'среду', 'четверг', 'пятницу', 'субботу'];
const RAL_WD_SHORT = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const RAL_TMR = RALAt(1);
const RAL_DEMO = [
  { tone: 'danger', title: 'Пересечение ' + (RAL_TMR.getDay() === 2 ? 'во ' : 'в ') + RAL_WD[RAL_TMR.getDay()], text: 'ВкусВилл 14:00–18:00 и Самокат 18:00–22:00, дорога ≈ 20 мин', action: 'Открыть' },
  { tone: 'warn', title: 'Заявка ждёт ответа', text: 'ВкусВилл, ' + RAL_WD_SHORT[RAL_TMR.getDay()] + ' ' + RAL_TMR.getDate() + ', 14:00–18:00', action: '' },
  { tone: 'info', title: RALOPENING.title, text: RALOPENING.text, action: 'Напомнить' }
];
// длинный пример для дизайн-системы: больше 5 пунктов, видно Ещё N
const RAL_DEMO_LONG = RAL_DEMO.concat([
  { tone: 'warn', title: 'Пожелание ждёт ответа', text: 'Додо, вс 20, 12:00–20:00', action: '' },
  { tone: 'danger', title: 'Не успеете доехать, вт 15', text: 'ВкусВилл 14:00–17:00 и Яндекс Еда 17:00–21:00', action: 'Открыть' },
  { tone: 'warn', title: 'Отменить без последствий до ср 11:00', text: 'X5 Доставка, чт 17, 11:00–17:00', action: 'Открыть' },
  { tone: 'info', title: 'Запись в Самокат откроется в пятницу', text: 'Слоты на следующую неделю', action: 'Напомнить' }
]);
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    // сначала срочное, потом ждущее ответа, потом подсказки; до 5 пунктов показываем все, больше: 3 важных и Ещё N
    const rank = { danger: 0, warn: 1, info: 2 };
    const items = (p.items || (p.demoLong ? RAL_DEMO_LONG : RAL_DEMO)).map((it, i) => Object.assign({ _i: i }, it)).sort((a, b) => (rank[a.tone] ?? 2) - (rank[b.tone] ?? 2) || a._i - b._i).map((it) => ({
      cls: 'ral-row ral-' + (it.tone || 'info'), title: it.title, text: it.text || '',
      has_action: !!it.action, action: it.action || '', has_chev: !it.action && typeof it.tap === 'function', act_cls: 'ral-act' + (it.on ? ' ral-act-on' : ''),
      tap: typeof it.tap === 'function' ? it.tap : (() => {})
    }));
    const st = this.state || {};
    const cut = items.length > 5 && !st.open;
    return {
      title: p.title || 'Требует внимания', items, shown: cut ? items.slice(0, 3) : items,
      has_more: items.length > 5, expanded: !!st.open,
      more_label: st.open ? 'Свернуть' : 'Ещё ' + (items.length - 3), more_icon: st.open ? '' : '›',
      toggle_more: () => this.setState({ open: !st.open })
    };
  }
}
</script></body></html>
