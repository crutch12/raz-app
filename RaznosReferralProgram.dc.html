<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    /* программа бонуса за приглашение: карточка каталога, строка, вставка в карточку сервиса и тёмная карточка с лесенкой */
    .rrp-card { display: flex; flex-direction: column; border: 1px solid var(--raznos-line); border-radius: 16px; background: var(--raznos-surface); }
    .rrp-btn-reset { box-sizing: border-box; width: 100%; margin: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .rrp-body { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 12px; border-radius: 16px; }
    .rrp-top { display: flex; align-items: center; gap: 10px; }
    .rrp-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .rrp-name b { font: 600 16px/1.3 var(--raznos-font); color: var(--raznos-ink); }
    .rrp-name small { font: 500 13px/1.35 var(--raznos-font); color: var(--raznos-ink-2); }
    .rrp-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .rrp-sumbox { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .rrp-sum { font: 700 28px/1.1 var(--raznos-font); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; color: var(--raznos-ink); white-space: nowrap; }
    .rrp-sub { font: 500 14px/1.35 var(--raznos-font); color: var(--raznos-ink-2); }
    .rrp-line { font: 500 14px/1.4 var(--raznos-font); color: var(--raznos-ink-2); }
    .rrp-note { font: 500 13px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    .rrp-mini { flex: none; width: 84px; height: 40px; display: flex; align-items: flex-end; gap: 3px; }
    .rrp-mini i { flex: 1; display: block; min-height: 4px; border-radius: 3px 3px 1px 1px; background: color-mix(in oklab, var(--raznos-ink) 18%, transparent); }
    .rrp-mini i:last-child { background: var(--raznos-green); }
    .rrp-aud { align-self: flex-start; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--raznos-line); background: var(--raznos-surface-2); font: 600 13px/1.35 var(--raznos-font); color: var(--raznos-ink-2); }
    .rrp-foot { display: flex; flex-direction: column; gap: 8px; padding: 0 16px 16px; }
    .rrp-src, .rrp-row-main em { display: flex; flex-wrap: wrap; font: 500 12px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    .rrp-src .rfs { color: inherit; }
    .rrp-go { box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid var(--raznos-line-strong); border-radius: 14px; background: var(--raznos-surface); color: var(--raznos-ink); font: 600 14px var(--raznos-font); cursor: pointer; }
    .rrp-go:hover { background: var(--raznos-surface-2); }

    .rrp-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; border: 1px solid var(--raznos-line); border-radius: 16px; background: var(--raznos-surface); }
    .rrp-row .rrp-name b { font-size: 15px; }
    .rrp-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .rrp-row-main b { font: 600 15px/1.3 var(--raznos-font); color: var(--raznos-ink); }
    .rrp-row-main > span { font: 500 14px/1.35 var(--raznos-font); color: var(--raznos-ink-2); overflow-wrap: anywhere; }
    .rrp-row-main em { font: 500 12px/1.4 var(--raznos-font); font-style: normal; color: var(--raznos-ink-3); }

    .rrp-compact { display: flex; flex-direction: column; gap: 6px; padding: 0; border-radius: 12px; }
    .rrp-compact .rrp-sum { font-size: 22px; }
    .rrp-compact-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .rrp-chev { flex: none; color: var(--raznos-ink-3); font: 600 16px var(--raznos-font); }

    /* тёмная карточка: единственная на экране, лесенка столбиками по накопленной награде */
    .rrp-hero { display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 20px; background: var(--raznos-dark); color: var(--raznos-on-dark); }
    .rrp-hero-label { font: 500 14px var(--raznos-font); opacity: 0.78; }
    .rrp-hero-sum { display: flex; align-items: baseline; gap: 8px; }
    .rrp-hero-sum b { font: 700 40px/1 var(--raznos-mono); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .rrp-hero-sum > span { font: 600 16px var(--raznos-font); opacity: 0.8; }
    .rrp-hero-for { font: 500 14px/1.4 var(--raznos-font); opacity: 0.9; }
    .rrp-steps { display: flex; align-items: flex-end; gap: 6px; padding-top: 4px; }
    .rrp-step { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 4px; text-align: center; }
    .rrp-step-sum { font: 600 12px/1 var(--raznos-font); font-variant-numeric: tabular-nums; opacity: 0.9; white-space: nowrap; }
    .rrp-step-bar { display: block; min-height: 10px; border-radius: 6px 6px 2px 2px; background: color-mix(in oklab, var(--raznos-on-dark) 28%, transparent); }
    .rrp-step-last .rrp-step-bar { background: var(--raznos-green); }
    .rrp-step-ord { font: 500 12px/1 var(--raznos-font); font-variant-numeric: tabular-nums; opacity: 0.72; }
    .rrp-hero-cap { font: 500 12px/1.4 var(--raznos-font); opacity: 0.72; }
    .rrp-hero-promise { font: 600 13px/1.4 var(--raznos-font); padding-top: 10px; border-top: 1px solid color-mix(in oklab, var(--raznos-on-dark) 20%, transparent); }

    .rrp-body:focus-visible, .rrp-row:focus-visible, .rrp-compact:focus-visible, .rrp-go:focus-visible { outline: 3px solid color-mix(in oklab, var(--raznos-green) 42%, transparent); outline-offset: 2px; }
    @media (prefers-reduced-motion: no-preference) {
      .rrp-step-bar { transform-origin: bottom; animation: rrp-grow .5s cubic-bezier(.16, 1, .3, 1) both; }
      .rrp-step:nth-child(2) .rrp-step-bar { animation-delay: .05s; }
      .rrp-step:nth-child(3) .rrp-step-bar { animation-delay: .1s; }
      .rrp-step:nth-child(4) .rrp-step-bar { animation-delay: .15s; }
      .rrp-step:nth-child(5) .rrp-step-bar { animation-delay: .2s; }
      .rrp-step:nth-child(6) .rrp-step-bar { animation-delay: .25s; }
      @keyframes rrp-grow { from { transform: scaleY(0.2); opacity: 0; } to { transform: none; opacity: 1; } }
    }
  </style>
</helmet>
<div>
  <sc-if value="{{ is_card }}" hint-placeholder-val="{{ true }}">
    <div class="rrp-card">
      <button type="button" class="rrp-btn-reset rrp-body" onClick="{{ tap_open }}" aria-label="{{ aria }}">
        <span class="rrp-top">
          <dc-import name="RaznosIcon" svc="{{ svc }}" alt="{{ svc_title }}" size="md"></dc-import>
          <span class="rrp-name"><b>{{ svc_title }}</b><small>{{ transport_text }}</small></span>
          <span class="rrp-chev" aria-hidden="true">›</span>
        </span>
        <sc-if value="{{ has_sum }}" hint-placeholder-val="{{ true }}">
          <span class="rrp-main">
            <span class="rrp-sumbox"><span class="rrp-sum">{{ sum_text }}</span><sc-if value="{{ has_orders }}" hint-placeholder-val="{{ true }}"><span class="rrp-sub">{{ orders_text }}</span></sc-if><sc-if value="{{ no_terms }}" hint-placeholder-val="{{ false }}"><span class="rrp-sub">{{ no_terms_text }}</span></sc-if></span>
            <sc-if value="{{ has_ladder }}" hint-placeholder-val="{{ true }}"><span class="rrp-mini" aria-hidden="true"><sc-for list="{{ mini }}" as="b" hint-placeholder-count="6"><i style="{{ b.style }}"></i></sc-for></span></sc-if>
          </span>
        </sc-if>
        <sc-if value="{{ no_sum }}" hint-placeholder-val="{{ false }}"><span class="rrp-line">{{ unknown_text }}</span></sc-if>
        <sc-if value="{{ has_term }}" hint-placeholder-val="{{ true }}"><span class="rrp-line">{{ term_text }}</span></sc-if>
        <sc-if value="{{ has_aud }}" hint-placeholder-val="{{ true }}"><span class="rrp-aud">{{ aud_text }}</span></sc-if>
        <sc-if value="{{ has_off }}" hint-placeholder-val="{{ false }}"><span class="rrp-aud">{{ off_text }}</span></sc-if>
        <sc-if value="{{ has_note }}" hint-placeholder-val="{{ false }}"><span class="rrp-note">{{ note_text }}</span></sc-if>
      </button>
      <div class="rrp-foot">
        <span class="rrp-src"><dc-import name="RaznosFactSource" src="{{ fact_src }}"></dc-import><span>{{ date_label }}</span></span>
        <sc-if value="{{ has_go }}" hint-placeholder-val="{{ true }}"><button type="button" class="rrp-go" onClick="{{ tap_offers }}">{{ go_label }}</button></sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ is_row }}" hint-placeholder-val="{{ false }}">
    <button type="button" class="rrp-btn-reset rrp-row" onClick="{{ tap_open }}" aria-label="{{ aria }}">
      <dc-import name="RaznosIcon" svc="{{ svc }}" alt="{{ svc_title }}" size="sm"></dc-import>
      <span class="rrp-row-main"><b>{{ svc_title }}</b><span>{{ row_text }}</span><sc-if value="{{ row_src_shown }}" hint-placeholder-val="{{ false }}"><em><dc-import name="RaznosFactSource" src="{{ fact_src }}"></dc-import><span>{{ date_label }}</span></em></sc-if></span>
      <span class="rrp-chev" aria-hidden="true">›</span>
    </button>
  </sc-if>

  <sc-if value="{{ is_compact }}" hint-placeholder-val="{{ false }}">
    <button type="button" class="rrp-btn-reset rrp-compact" onClick="{{ tap_open }}" aria-label="{{ aria }}">
      <span class="rrp-compact-top">
        <sc-if value="{{ has_sum }}" hint-placeholder-val="{{ true }}"><span class="rrp-sumbox"><span class="rrp-sum">{{ sum_text }}</span><span class="rrp-sub">{{ compact_sub }}</span></span></sc-if>
        <sc-if value="{{ no_sum }}" hint-placeholder-val="{{ false }}"><span class="rrp-sub">{{ unknown_text }}</span></sc-if>
        <span class="rrp-chev" aria-hidden="true">›</span>
      </span>
      <sc-if value="{{ has_aud }}" hint-placeholder-val="{{ true }}"><span class="rrp-aud">{{ aud_text }}</span></sc-if>
      <span class="rrp-src"><dc-import name="RaznosFactSource" src="{{ fact_src }}"></dc-import><span>{{ date_label }}</span></span>
    </button>
  </sc-if>

  <sc-if value="{{ is_hero }}" hint-placeholder-val="{{ false }}">
    <div class="rrp-hero">
      <span class="rrp-hero-label">Награда по программе</span>
      <span class="rrp-hero-sum"><b>{{ sum_num }}</b><span>₽</span></span>
      <span class="rrp-hero-for">{{ hero_for }}</span>
      <div class="rrp-steps" aria-hidden="true">
        <sc-for list="{{ steps }}" as="st" hint-placeholder-count="6">
          <span class="{{ st.cls }}"><span class="rrp-step-sum">{{ st.reward }}</span><span class="rrp-step-bar" style="{{ st.style }}"></span><span class="rrp-step-ord">{{ st.orders }}</span></span>
        </sc-for>
      </div>
      <span class="rrp-hero-cap">Сверху награда за ступень в рублях, снизу заказов всего</span>
      <span class="rrp-hero-promise">Обещание сервиса, не доход</span>
    </div>
  </sc-if>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"program":{"editor":null},"mode":{"editor":"enum","default":"card","options":["card","row","compact","hero"]},"svcTitle":{"editor":"text","default":"Купер"},"count":{"editor":"int","default":6},"showSource":{"editor":"boolean","default":false},"onOpen":{"editor":null},"onOffers":{"editor":null},"$preview":{"width":366,"height":300}}'>
// программа бонуса за приглашение из каталога (REF_PROGRAMS): сумма всегда с числом заказов и сроком, без условий пишем что они видны в приложении сервиса
// card: карточка каталога, row: строка со снимком условий, compact: вставка в карточку сервиса, hero: тёмная карточка с лесенкой
// шаги программы это приращения, лесенку и столбики считаем по накопленной награде
const RRP_MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const RRP_MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const RRP_TR = { foot: 'пешком', bike: 'вело', electric: 'электро', car: 'авто', moto: 'мото' };
const RRP_DEMO = { id: 'kuper-msk-foot', svc: 'kuper', transports: ['foot', 'bike'], rewardTotal: 140000, rewardUnit: 'rub', totalOrders: 420, steps: [{ orders: 30, reward: 7000 }, { orders: 40, reward: 14000 }, { orders: 40, reward: 14000 }, { orders: 70, reward: 21000 }, { orders: 70, reward: 21000 }, { orders: 170, reward: 63000 }], durationDays: 30, durationText: '30 дней на выполнение', windowUntilIso: '2026-11-12', dormantText: 'не работали в Купере 60+ дней', factSrc: 'вторичный', observedIso: '2026-10-18', state: 'active', inviteMethod: 'link', shareNote: '' };
const rrpPlural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few; return many; };
const rrpMoney = (n) => Number(n).toLocaleString('ru-RU');
const rrpDate = (iso, months) => { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? '' : d.getDate() + ' ' + months[d.getMonth()]; };
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const g = p.program || RRP_DEMO;
    const mode = p.mode || 'card';
    const svcTitle = p.svcTitle || 'Купер';
    // сумма либо одно число, либо диапазон rewardRange [от, до], у диапазона без нижней границы пишем до N
    const range = Array.isArray(g.rewardRange) && g.rewardRange[1] != null ? g.rewardRange : null;
    const known = g.rewardUnit === 'rub' && (g.rewardTotal != null || !!range);
    const hasTerms = known && g.rewardTotal != null && !!g.totalOrders;
    const noTermsText = g.factSrc === 'партнёрские материалы' ? 'Условия у партнёров сервиса' : (g.factSrc === 'вакансия' ? 'Условия сервис не публикует' : 'Условия видны в приложении сервиса');
    const steps = Array.isArray(g.steps) ? g.steps : [];
    const sumText = g.rewardTotal != null ? rrpMoney(g.rewardTotal) + ' ₽' : (range ? (range[0] != null ? rrpMoney(range[0]) + '–' : 'до ') + rrpMoney(range[1]) + ' ₽' : '');
    const ordersText = g.totalOrders ? 'за ' + g.totalOrders + ' ' + rrpPlural(g.totalOrders, 'заказ', 'заказа', 'заказов') : '';
    const tr = (g.transports || []).map((t) => RRP_TR[t]).filter(Boolean);
    const transportText = tr.length > 1 ? tr.slice(0, -1).join(', ') + ' и ' + tr[tr.length - 1] : (tr[0] || '');
    const until = rrpDate(g.windowUntilIso, RRP_MONTHS);
    const termText = [g.durationText, until ? 'до ' + until : ''].filter(Boolean).join(' · ');
    const off = g.state === 'closed' || g.state === 'unavailable';
    const offText = g.state === 'closed' ? 'Программа закончилась' : 'Сейчас недоступна';
    const unknownText = g.state === 'closed' ? 'Программа закончилась' : (g.inviteMethod === 'application' ? 'Условия видны в приложении сервиса, приглашение заявкой' : 'Условия видны в приложении сервиса');
    // накопленная награда по ступеням
    let accReward = 0, accOrders = 0;
    const cum = steps.map((s) => { accReward += s.reward; accOrders += s.orders; return { reward: s.reward, orders: accOrders, total: accReward }; });
    const top = cum.length ? cum[cum.length - 1].total : 1;
    const count = p.count == null ? null : +p.count;
    const factSrc = g.factSrc || (known ? 'официально' : '');
    const date = rrpDate(g.observedIso, RRP_MONTHS_SHORT);
    const rowParts = off ? [offText] : known ? [sumText + (ordersText ? ' ' + ordersText : '')].concat(g.durationDays ? [g.durationDays + ' ' + rrpPlural(g.durationDays, 'день', 'дня', 'дней')] : []) : [unknownText];
    const open = typeof p.onOpen === 'function' ? p.onOpen : () => {};
    const aria = svcTitle + '. ' + (hasTerms ? sumText + ' ' + ordersText + '. ' + termText : (known ? sumText + '. ' + noTermsText : unknownText));
    return {
      is_card: mode === 'card', is_row: mode === 'row', is_compact: mode === 'compact', is_hero: mode === 'hero',
      svc: g.svc, svc_title: svcTitle, transport_text: transportText, aria,
      has_sum: known, no_sum: !known, has_orders: hasTerms, no_terms: known && !hasTerms, no_terms_text: noTermsText,
      sum_text: sumText, sum_num: g.rewardTotal != null ? rrpMoney(g.rewardTotal) : '', orders_text: ordersText, unknown_text: unknownText,
      has_term: hasTerms && !!termText, term_text: termText,
      has_aud: !!g.dormantText, aud_text: 'Для новичков: ' + (g.dormantText || ''),
      has_note: !!g.shareNote && g.sharePolicy !== 'native', note_text: g.shareNote || '', has_off: off && known, off_text: offText,
      has_ladder: cum.length > 1,
      mini: cum.map((c) => ({ style: 'height:' + Math.max(12, Math.round(c.total / top * 100)) + '%' })),
      fact_src: factSrc, date_label: (factSrc && date ? ' · ' : '') + date,
      has_go: typeof p.onOffers === 'function' && !off, go_label: 'Устроиться по рефералке' + (count ? ' · ' + count : ''),
      row_text: rowParts.join(' · '), row_src_shown: !!p.showSource && !!date,
      compact_sub: off ? offText : hasTerms ? ordersText + (g.durationDays ? ' · ' + g.durationDays + ' ' + rrpPlural(g.durationDays, 'день', 'дня', 'дней') : '') : noTermsText,
      hero_for: ordersText + (g.durationDays ? ' за ' + g.durationDays + ' ' + rrpPlural(g.durationDays, 'день', 'дня', 'дней') : (g.durationText ? ', ' + g.durationText : '')),
      steps: cum.map((c, i) => ({ cls: 'rrp-step' + (i === cum.length - 1 ? ' rrp-step-last' : ''), reward: rrpMoney(c.reward), orders: String(c.orders), style: 'height:' + Math.max(10, Math.round(c.total / top * 76)) + 'px' })),
      tap_open: open,
      tap_offers: typeof p.onOffers === 'function' ? p.onOffers : () => {}
    };
  }
}
</script></body></html>
