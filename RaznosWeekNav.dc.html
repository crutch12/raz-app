<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rwn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
    .rwn .raznos-icon-btn:disabled { opacity: 0.35; cursor: default; }
    .rwn-copy { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
    .rwn-copy > b { font: 700 16px var(--raznos-font); color: var(--raznos-ink); }
    .rwn-copy > span { font: 500 12px var(--raznos-font); color: var(--raznos-ink-3); }
  </style>
</helmet>
<div class="rwn" role="group" aria-label="Неделя">
  <button type="button" class="raznos-icon-btn" onClick="{{ prev }}" disabled="{{ prev_off }}" aria-label="Прошлая неделя"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
  <span class="rwn-copy" aria-live="polite"><b>{{ title }}</b><span>{{ sub }}</span></span>
  <button type="button" class="raznos-icon-btn" onClick="{{ next }}" disabled="{{ next_off }}" aria-label="Следующая неделя"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"text","default":"2026-09-14"},"offset":{"editor":"number","default":0},"min":{"editor":"number","default":-1},"max":{"editor":"number","default":1},"onChange":{"editor":null},"$preview":{"width":366,"height":60}}'>
// листание недель пн–вс: прошлая, эта и следующая, подпись одна для Плана и Смен
const RWN_MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const off = p.offset || 0;
    const min = p.min != null ? p.min : -1, max = p.max != null ? p.max : 1;
    const a = new Date((p.start || '2026-09-14') + 'T00:00:00');
    a.setDate(a.getDate() + off * 7);
    const b = new Date(a); b.setDate(b.getDate() + 6);
    const change = (v) => { if (typeof p.onChange === 'function') p.onChange(v); };
    return {
      title: a.getMonth() === b.getMonth() ? a.getDate() + '–' + b.getDate() + ' ' + RWN_MONTHS[b.getMonth()] : a.getDate() + ' ' + RWN_MONTHS[a.getMonth()] + ' – ' + b.getDate() + ' ' + RWN_MONTHS[b.getMonth()],
      sub: off === 0 ? 'эта неделя' : (off === -1 ? 'прошлая неделя' : (off === 1 ? 'следующая неделя' : '')),
      prev: () => change(off - 1), next: () => change(off + 1), prev_off: off <= min, next_off: off >= max
    };
  }
}
</script></body></html>
