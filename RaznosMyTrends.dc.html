<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" /><link rel="stylesheet" href="./raznos-statistics.css" /></helmet>
<sc-if value="{{ compact }}" hint-placeholder-val="{{ true }}">
  <div class="raznos-stats-trend-tiles" aria-label="Мои тренды">
    <sc-for list="{{ tiles }}" as="tile" hint-placeholder-count="6">
      <div class="{{ tile.tile_cls }}" aria-label="{{ tile.aria }}">
        <span class="raznos-stats-trend-badge" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ tile.icon }}"/></svg></span>
        <span class="raznos-stats-trend-tile-copy"><strong>{{ tile.value }}</strong><small>{{ tile.label }}<sc-if value="{{ tile.has_change }}" hint-placeholder-val="{{ true }}"><b>{{ tile.compact_change }}</b></sc-if></small></span>
      </div>
    </sc-for>
  </div>
</sc-if>
<sc-if value="{{ detail }}">
  <div class="raznos-stats-trends-detail" aria-label="Подробные тренды">
    <sc-if value="{{ scale_label }}" hint-placeholder-val="{{ true }}"><p class="raznos-stats-trend-scale">{{ scale_label }}</p></sc-if>
    <sc-if value="{{ is_list }}" hint-placeholder-val="{{ true }}">
      <div class="raznos-stats-trend-list">
        <sc-for list="{{ list_cards }}" as="c" hint-placeholder-count="6">
          <sc-if value="{{ c.group }}" hint-placeholder-val="{{ false }}"><h3 class="raznos-stats-trend-group">{{ c.group }}</h3></sc-if>
          <button type="button" class="{{ c.cls }}" onClick="{{ c.tap }}" aria-label="{{ c.aria }}">
            <span class="raznos-stats-trend-card-head"><span class="raznos-stats-trend-card-title">{{ c.label }}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span>
            <span class="raznos-stats-trend-card-body">
              <span class="raznos-stats-trend-card-value"><strong>{{ c.value }}</strong><b>{{ c.delta }}</b></span>
              <span class="raznos-stats-trend-spark" aria-hidden="true"><sc-for list="{{ c.spark }}" as="sp" hint-placeholder-count="6"><i class="{{ sp.cls }}"><em style="{{ sp.style }}"></em></i></sc-for></span>
            </span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ is_focus }}" hint-placeholder-val="{{ false }}">
    <h2 class="raznos-stats-trend-focus-title">{{ selected.label }}</h2>
    <section class="raznos-stats-trend-focus" aria-label="{{ selected.label }}: вы и курьеры города">
      <div class="raznos-stats-compare-legend">
        <div class="raznos-stats-compare-side raznos-is-you"><small>Вы</small><strong>{{ focus_mine }}</strong><sc-if value="{{ focus_delta }}" hint-placeholder-val="{{ true }}"><em class="{{ focus_delta_cls }}">{{ focus_delta }}</em></sc-if></div>
        <div class="raznos-stats-compare-side"><small>{{ city_label }}, обычно</small><strong>{{ focus_median }}</strong></div>
      </div>
      <sc-if value="{{ chart_has_data }}" hint-placeholder-val="{{ true }}">
        <div class="raznos-stats-compare-chart" role="list">
          <sc-for list="{{ chart_bars }}" as="bar" hint-placeholder-count="6">
            <div role="listitem" class="raznos-stats-compare-cell"><button type="button" class="{{ bar.cls }}" onClick="{{ bar.tap }}" aria-label="{{ bar.aria }}" aria-pressed="{{ bar.pressed }}">
              <span class="raznos-stats-compare-plot"><i class="raznos-stats-compare-fill" style="{{ bar.fill_style }}"></i><i class="raznos-stats-compare-median" style="{{ bar.median_style }}"></i></span>
              <span class="raznos-stats-compare-label">{{ bar.label }}</span>
            </button></div>
          </sc-for>
        </div>
        <p class="raznos-stats-compare-period">{{ focus_title }}</p>
        <p class="{{ focus_verdict_class }}">{{ focus_verdict }}</p>
      </sc-if>
      <sc-if value="{{ chart_empty }}" hint-placeholder-val="{{ false }}"><p class="raznos-stats-note">{{ chart_empty_note }}</p></sc-if>
    </section>
    </sc-if>
    <sc-if value="{{ is_focus }}" hint-placeholder-val="{{ false }}">
    <div class="raznos-stats-trend-toolbar" aria-label="Настройки тренда">
      <button type="button" class="raznos-stats-trend-control raznos-is-primary" onClick="{{ open_metric }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19V10M12 19V5M19 19v-7"/></svg><span>{{ selected.label }}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button type="button" class="raznos-stats-trend-control" onClick="{{ open_filters }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg><span>{{ scope_label }}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    </sc-if>
    <sc-if value="{{ metric_sheet_open }}" hint-placeholder-val="{{ false }}">
      <div class="raznos-dialog-layer" role="dialog" aria-modal="true" aria-label="Показатель" onClick="{{ close_sheet }}">
        <div class="raznos-dialog raznos-stats-trend-picker" onClick="{{ stop }}">
          <span class="raznos-text-h3">Показатель</span>
          <div>
            <sc-for list="{{ metric_options }}" as="option" hint-placeholder-count="4">
              <button type="button" class="raznos-stats-trend-option" onClick="{{ option.tap }}"><span><strong>{{ option.label }}</strong><small>{{ option.value }}</small></span><i class="{{ option.check_class }}">{{ option.mark }}</i></button>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>
  </div>
</sc-if>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"current":{"editor":null},"previous":{"editor":null},"detailMode":{"editor":"boolean","default":false},"keys":{"editor":null},"focusKey":{"editor":null},"scaleLabel":{"editor":"text","default":"Столбики: 6 последних месяцев, текущий справа"},"onFocus":{"editor":null},"scopeLabel":{"editor":"text","default":"Все данные"},"onFilters":{"editor":null},"$preview":{"width":340,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const st = this.state || {};
    const set = (patch) => this.setState(patch);
    const current = p.current || { earn: 8000, rate: 620, perOrder: 267, ordersPerHour: 2.6, orders: 30, hours: 11.5 };
    const previous = p.previous || { earn: 7840, rate: 600, perOrder: 260, ordersPerHour: 2.5, orders: 29, hours: 11.6 };
    const format = (value) => value == null ? 'Нет данных' : String(Math.round(value * 10) / 10).replace(/\B(?=(\d{3})+(?!\d))/g, ' ').replace('.', ',');
    const row = (label, key, unit) => {
      const hasComparison = current[key] != null && previous[key] != null && previous[key] !== 0;
      const change = hasComparison ? Math.round((current[key] - previous[key]) * 100 / previous[key]) : null;
      const kind = change == null ? 'neutral' : (change > 0 ? 'up' : (change < 0 ? 'down' : 'neutral'));
      const valueLabel = (value) => value == null ? 'Нет данных' : format(value) + unit;
      const currentValue = current[key] == null ? 0 : Math.max(0, current[key]);
      const previousValue = previous[key] == null ? 0 : Math.max(0, previous[key]);
      const maxValue = Math.max(currentValue, previousValue, 1);
      const previousPercent = Math.round(previousValue * 100 / maxValue);
      const currentPercent = Math.round(currentValue * 100 / maxValue);
      return {
        key, label, value: valueLabel(current[key]),
        current_value: valueLabel(current[key]),
        previous_value: valueLabel(previous[key]),
        delta: change == null ? '' : (change > 0 ? '+' : '') + change + '%',
        direction: change == null ? 'Нет сравнения' : (change === 0 ? 'Без изменений' : 'к прошлому'),
        compact_change: change == null ? 'Нет сравнения' : (change > 0 ? '+' : '') + change + '%',
        previous_style: 'width:' + previousPercent + '%',
        current_style: 'width:' + currentPercent + '%',
        bar_label: 'Прошлый период ' + valueLabel(previous[key]) + ', текущий ' + valueLabel(current[key]),
        bars: [
          { cls: 'raznos-stats-trend-compare-bar raznos-is-previous', focus_cls: 'raznos-stats-trend-focus-bar raznos-is-previous', style: 'height:' + previousPercent + '%', label: 'Раньше', value: valueLabel(previous[key]) },
          { cls: 'raznos-stats-trend-compare-bar raznos-is-current', focus_cls: 'raznos-stats-trend-focus-bar raznos-is-current', style: 'height:' + currentPercent + '%', label: 'Сейчас', value: valueLabel(current[key]) }
        ],
        cls: 'raznos-stats-trend raznos-is-' + kind
      };
    };
    // названия как в ТЗ, доход в час до расходов
    // сначала три ставки, как на карточке Сравнение в Результатах, ниже остальные показатели
    const rows = [row('Доход в час', 'rate', ' ₽/ч'), row('Доход за заказ', 'perOrder', ' ₽'), row('Заказов в час', 'ordersPerHour', ''), row('Начислено', 'earn', ' ₽'), row('Заказы', 'orders', ''), row('Часы на линии', 'hours', ' ч')];
    // часы на линии не бывают хорошими или плохими сами по себе, поэтому стрелка у них серая
    const tile = (item, judged) => {
      const kind = /raznos-is-(up|down)/.test(item.cls) ? RegExp.$1 : 'neutral';
      return Object.assign({}, item, {
        tile_cls: 'raznos-stats-trend-tile raznos-is-' + (judged ? kind : 'neutral') + ' raznos-dir-' + kind,
        icon: kind === 'up' ? 'M12 19V5M5 12l7-7 7 7' : (kind === 'down' ? 'M12 5v14M5 12l7 7 7-7' : 'M5 12h14'),
        has_change: item.delta !== '',
        aria: item.label + ' ' + item.value + (item.delta ? ', ' + item.delta + ' к прошлому периоду' : ', нет сравнения')
      });
    };
    const tiles = [
      tile(rows[0], true), tile(rows[1], true),
      tile(rows[2], true), tile(rows[3], true),
      tile(rows[4], true), tile(rows[5], false)
    ].filter((item) => !Array.isArray(p.keys) || p.keys.indexOf(item.key) !== -1);
    const detail = !!p.detailMode;
    // открытый показатель хранит приложение, чтобы стрелка назад в шапке вела сначала в список
    const focusKey = typeof p.onFocus === 'function' ? (p.focusKey || '') : (st.focus || '');
    const openFocus = (k) => { set({ metric: k, bar: null }); if (typeof p.onFocus === 'function') p.onFocus(k); else set({ focus: k }); };
    const selected = rows.find((item) => item.key === (st.metric || focusKey)) || rows[0];
    const metricSheetOpen = st.sheet === 'metric';
    const metricOptions = rows.map((item) => ({
      label: item.label,
      value: item.value,
      check_class: 'raznos-stats-trend-option-check' + (item.key === selected.key ? ' raznos-is-selected' : ''),
      mark: item.key === selected.key ? '✓' : '',
      tap: () => { set({ sheet: '' }); openFocus(item.key); }
    }));
    // столбики по периодам с медианой города, как сравнение в Gridwise
    const demoPoint = (label, title, earn, median, running) => ({ label, title, running, values: { earn, rate: Math.round(earn / 100), perOrder: 280, ordersPerHour: 2.4 }, medians: { earn: median, rate: Math.round(median / 100), perOrder: 270, ordersPerHour: 2.3 } });
    // демо без пропса: шесть месяцев до текущего включительно
    const demoMonth = (i, earn, median) => {
      const t = new Date(), d = new Date(t.getFullYear(), t.getMonth() - 5 + i, 1), cur = i === 5;
      const names = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
      return demoPoint(names[d.getMonth()].slice(0, 3).toLowerCase(), names[d.getMonth()] + ' ' + d.getFullYear() + (cur ? ', период идёт' : ''), earn, median, cur);
    };
    const series = Array.isArray(p.series) ? p.series : [[60950, 56700], [70000, 72800], [75400, 67900], [49500, 48500], [79650, 84400], [58900, 54200]].map((v, i) => demoMonth(i, v[0], v[1]));
    const unit = ({ earn: ' ₽', orders: '', rate: ' ₽/ч', perOrder: ' ₽', ordersPerHour: '', hours: ' ч' })[selected.key] || '';
    const known = series.filter((point) => point.values && point.values[selected.key] != null);
    const maxValue = Math.max.apply(null, known.map((point) => Math.max(point.values[selected.key], point.medians[selected.key] || 0)).concat([1])) * 1.08;
    const lastKnown = series.length - 1 - series.slice().reverse().findIndex((point) => point.values && point.values[selected.key] != null);
    const focusIndex = st.bar != null && series[st.bar] && series[st.bar].values[selected.key] != null ? st.bar : (known.length ? lastKnown : -1);
    const focus = focusIndex >= 0 ? series[focusIndex] : null;
    const mine = focus ? focus.values[selected.key] : null;
    const median = focus ? focus.medians[selected.key] : null;
    const gap = mine != null && median ? Math.round((mine - median) * 100 / median) : null;
    // изменение к своему предыдущему периоду, как в карточке списка
    const prevPoint = focusIndex > 0 ? series[focusIndex - 1] : null;
    const prevMine = prevPoint && prevPoint.values ? prevPoint.values[selected.key] : null;
    const own = mine != null && prevMine ? Math.round((mine - prevMine) * 100 / prevMine) : null;
    const judgedOwn = selected.key !== 'hours';
    const chartBars = series.map((point, index) => {
      const value = point.values ? point.values[selected.key] : null;
      const mid = point.medians ? point.medians[selected.key] : null;
      return {
        label: point.label, pressed: index === focusIndex,
        cls: 'raznos-stats-compare-bar' + (value == null ? ' raznos-is-empty' : '') + (point.running ? ' raznos-is-running' : '') + (index === focusIndex ? ' raznos-is-selected' : ''),
        fill_style: 'height:' + (value == null ? 0 : Math.max(3, Math.round(value * 100 / maxValue))) + '%',
        median_style: mid == null ? 'display:none' : 'bottom:' + Math.round(mid * 100 / maxValue) + '%',
        aria: point.title + ': ' + (value == null ? 'нет данных' : format(value) + unit) + (mid == null ? '' : ', обычно ' + format(mid) + unit),
        tap: () => { if (value != null) set({ bar: index }); }
      };
    });
    // карточки списка: столбики по тем же периодам, что и сравнение, текущий выделен
    const listCards = rows.map((item, gi) => {
      const group = gi === 0 ? 'Ставки' : (gi === 3 ? 'Ещё показатели' : '');
      const vals = series.map((point) => (point.values ? point.values[item.key] : null));
      const top = Math.max.apply(null, vals.filter((v) => v != null).concat([1]));
      const kind = /raznos-is-(up|down)/.test(item.cls) ? RegExp.$1 : 'neutral';
      const judged = item.key !== 'hours';
      return {
        label: item.label, value: item.value, delta: item.delta, group,
        cls: 'raznos-stats-trend-card raznos-is-' + (judged ? kind : 'neutral'),
        aria: item.label + ' ' + item.value + (item.delta ? ', ' + item.delta + ' к прошлому периоду' : '') + ', открыть подробно',
        spark: vals.map((v, i) => ({ cls: 'raznos-stats-trend-spark-bar' + (i === vals.length - 1 ? ' raznos-is-current' : '') + (series[i] && series[i].running ? ' raznos-is-running' : ''), style: 'height:' + (v == null ? 0 : Math.max(8, Math.round(v * 100 / top))) + '%' })),
        tap: () => openFocus(item.key)
      };
    });
    const isFocus = !!focusKey;
    return {
      is_list: !isFocus, is_focus: isFocus, list_cards: listCards, scale_label: p.scaleLabel === undefined ? 'Столбики: 6 последних месяцев, текущий справа' : (p.scaleLabel || ''),
      chart_bars: chartBars, chart_has_data: known.length > 0, chart_empty: !known.length,
      chart_empty_note: series.length ? 'По этому показателю за выбранные периоды данных нет' : 'Сравнение по периодам доступно для всех данных без фильтров',
      city_label: p.cityLabel || 'Город',
      focus_mine: mine == null ? 'Нет данных' : format(mine) + unit,
      // у идущего периода процент как в карточке: к тому же числу дней прошлого периода
      focus_delta: focus && focus.running && focusIndex === lastKnown ? (selected.delta ? selected.delta + ' к прошлому' : '') : (own == null ? '' : (own > 0 ? '+' : '') + own + '% к прошлому'),
      focus_delta_cls: 'raznos-stats-compare-delta' + (() => { const d = focus && focus.running && focusIndex === lastKnown ? parseInt(selected.delta, 10) : own; return !judgedOwn || !d ? '' : (d > 0 ? ' raznos-is-positive' : ' raznos-is-negative'); })(),
      focus_median: median == null ? 'Нет данных' : format(median) + unit,
      focus_title: focus ? focus.title : '',
      focus_verdict: gap == null ? '' : (gap === 0 ? 'На уровне обычного в городе' : (gap > 0 ? 'Выше обычного на ' + gap + '%' : 'Ниже обычного на ' + Math.abs(gap) + '%')),
      focus_verdict_class: 'raznos-stats-compare-verdict' + (gap > 0 ? ' raznos-is-positive' : (gap < 0 ? ' raznos-is-negative' : '')),
      primary: rows[0], supportRows: [rows[2], rows[3], rows[4]], detailRows: rows, rows, tiles, selected, detail, compact: !detail,
      scope_label: p.scopeLabel || 'Все данные',
      metric_options: metricOptions,
      metric_sheet_open: metricSheetOpen,
      open_metric: () => set({ sheet: 'metric' }),
      open_filters: typeof p.onFilters === 'function' ? p.onFilters : (() => {}),
      close_sheet: () => set({ sheet: '' }),
      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); }
    };
  }
}
</script></body></html>
