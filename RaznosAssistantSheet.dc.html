<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .ras-sheet { box-sizing: border-box; width: 100%; height: 92%; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; background: var(--raznos-bg); color: var(--raznos-ink); box-shadow: 0 -18px 48px rgba(20, 25, 40, 0.2); overflow: hidden; position: relative; }
    /* аура сверху: насыщенная бирюза и зелень до конца подписи, ниже за 120px светлеет через мяту в фон, без прозрачности и серой мути;
       --ras-aura-end ставит JS по низу подписи; в разговоре аура едва заметна */
    .ras-aura { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--ras-aura-end, 300px) + 140px); z-index: 0; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity 0.5s ease; transform: translateY(var(--ras-aura-shift, 0px)); background: linear-gradient(180deg, oklch(0.52 0.1 190) 0, oklch(0.56 0.12 160) calc(var(--ras-aura-end, 300px) - 40px), oklch(0.8 0.1 155) calc(var(--ras-aura-end, 300px) + 50px), var(--raznos-bg) 100%); -webkit-mask: linear-gradient(#000 calc(100% - 130px), transparent); mask: linear-gradient(#000 calc(100% - 130px), transparent); }
    .ras-sheet-empty .ras-aura { opacity: 1; }
    .ras-sheet-morph .ras-aura { transition: none; }
    .ras-aura i { position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; filter: blur(40px); }
    .ras-aura i:nth-child(1) { left: -20%; top: -12%; background: oklch(0.6 0.14 145); opacity: 0.8; }
    .ras-aura i:nth-child(2) { right: -22%; top: 4%; background: oklch(0.5 0.1 205); opacity: 0.8; }
    .ras-aura i:nth-child(3) { left: 20%; top: 18%; background: oklch(0.48 0.1 170); opacity: 0.6; }
    .raznos-theme-dark .ras-aura { height: 72%; opacity: 0.22; background: oklch(0.31 0.04 205); -webkit-mask: linear-gradient(#000 0 48%, transparent 92%); mask: linear-gradient(#000 0 48%, transparent 92%); }
    .raznos-theme-dark .ras-sheet-empty .ras-aura { opacity: 1; }
    .raznos-theme-dark .ras-aura i:nth-child(1) { background: oklch(0.58 0.14 150); opacity: 0.9; }
    .raznos-theme-dark .ras-aura i:nth-child(2) { background: oklch(0.55 0.1 188); opacity: 0.85; }
    .raznos-theme-dark .ras-aura i:nth-child(3) { background: oklch(0.72 0.14 140); opacity: 0.6; }
    /* на пустом экране шапка и заголовок белые поверх ауры */
    .ras-head h2, .ras-sub, .ras-empty b, .ras-empty-sub, .ras-handle { transition: color 0.5s ease, background-color 0.5s ease; }
    .ras-sheet-empty .ras-head h2, .ras-sheet-empty .ras-empty b { color: #fff; }
    .ras-sheet-empty .ras-sub, .ras-sheet-empty .ras-empty-sub { color: rgba(255, 255, 255, 0.9); }
    .ras-sheet-empty .ras-handle { background: rgba(255, 255, 255, 0.55); }
    .ras-head, .ras-feed, .ras-foot, .ras-handle { position: relative; z-index: 1; }
    .ras-handle { flex: none; width: 38px; height: 4px; margin: 8px auto 0; border-radius: 999px; background: var(--raznos-line-strong); }
    .ras-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 8px 16px; }
    .ras-head-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .ras-head h2 { margin: 0; font: 700 20px/1.2 var(--raznos-font); letter-spacing: -0.02em; }
    .ras-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 500 12.5px var(--raznos-font); color: var(--raznos-ink-3); }
    /* новый разговор: значок рядом с крестиком, той же формы */
    .ras-new { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 12px; background: var(--raznos-surface-2); color: var(--raznos-ink); cursor: pointer; }
    .ras-close { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 12px; background: var(--raznos-surface-2); color: var(--raznos-ink); cursor: pointer; }
    .ras-new:focus-visible, .ras-close:focus-visible, .ras-send:focus-visible, .ras-chip:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .ras-feed { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 16px; }
    .ras-empty { display: flex; flex-direction: column; gap: 10px; padding: 26px 2px 6px; }
    .ras-empty b { max-width: 320px; font: 800 30px/1.12 var(--raznos-font); letter-spacing: -0.025em; }
    .ras-empty-sub { max-width: 330px; font: 500 14.5px/1.45 var(--raznos-font); color: var(--raznos-ink); }
    /* статус: маленький шар как у кнопки и текст с бегущим бликом */
    .ras-status { display: flex; align-items: center; gap: 10px; min-height: 28px; font: 600 14px var(--raznos-font); color: var(--raznos-ink-3); }
    .ras-orb { position: relative; flex: none; width: 20px; height: 20px; border-radius: 50%; overflow: hidden; background: oklch(0.31 0.04 205); }
    .ras-orb i { position: absolute; width: 75%; aspect-ratio: 1; border-radius: 50%; filter: blur(3px); }
    .ras-orb i:nth-child(1) { left: -15%; top: -15%; background: oklch(0.56 0.13 150); }
    .ras-orb i:nth-child(2) { right: -20%; top: 5%; background: oklch(0.5 0.09 188); }
    .ras-orb i:nth-child(3) { left: 10%; bottom: -25%; background: oklch(0.7 0.14 140); opacity: 0.7; }
    .ras-status-text { display: inline-block; background: linear-gradient(90deg, var(--raznos-ink-3) 0 35%, var(--raznos-ink) 50%, var(--raznos-ink-3) 65% 100%); background-size: 260% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
    .ras-err { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--raznos-red-tint); color: var(--raznos-ink); font: 500 14px/1.4 var(--raznos-font); }
    .ras-err .raznos-btn { align-self: flex-start; }
    .ras-foot { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--raznos-line); background: var(--raznos-surface); }
    /* тост после нового разговора: можно вернуть прежний */
    .ras-undo { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0 6px 0 14px; border-radius: 12px; background: var(--raznos-dark); color: var(--raznos-on-dark); font: 500 14px var(--raznos-font); }
    .ras-undo-btn { min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: none; color: var(--raznos-on-dark); font: 700 14px var(--raznos-font); cursor: pointer; }
    .ras-undo-btn:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    /* заглушка на время ответа сервера: полоски заголовка и карточек переливаются */
    .ras-skel { display: flex; flex-direction: column; gap: 10px; padding: 26px 2px 6px; }
    .ras-skel i, .ras-skel-chips i { display: block; border-radius: 10px; background: linear-gradient(90deg, color-mix(in oklab, var(--raznos-ink) 8%, transparent) 0 40%, color-mix(in oklab, var(--raznos-ink) 14%, transparent) 50%, color-mix(in oklab, var(--raznos-ink) 8%, transparent) 60% 100%); background-size: 260% 100%; }
    .ras-sheet-empty .ras-skel > i { background-image: linear-gradient(90deg, rgba(255, 255, 255, 0.3) 0 40%, rgba(255, 255, 255, 0.5) 50%, rgba(255, 255, 255, 0.3) 60% 100%); }
    .ras-skel-title { height: 30px; width: 78%; }
    .ras-skel-line { height: 14px; width: 92%; }
    .ras-skel-short { width: 52%; }
    .ras-skel-chips { display: flex; flex-direction: column; gap: 8px; margin-top: 26px; }
    .ras-skel-chips i { height: 54px; border-radius: 14px; }
    .ras-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .ras-chips::-webkit-scrollbar { display: none; }
    .ras-chip { flex: none; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--raznos-line-strong); background: var(--raznos-surface); color: var(--raznos-ink); font: 600 14px var(--raznos-font); cursor: pointer; white-space: nowrap; }
    .ras-empty-chips { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    /* стартовые вопросы карточками на полупрозрачном стекле поверх ауры */
    .ras-empty-chips .ras-chip { width: 100%; min-height: 54px; padding: 14px 16px; border-radius: 14px; border-color: color-mix(in oklab, var(--raznos-surface) 80%, transparent); background: color-mix(in oklab, var(--raznos-surface) 82%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 1px 2px rgba(20, 25, 40, 0.04); font: 500 15px/1.35 var(--raznos-font); white-space: normal; text-align: left; }
    .ras-compose { display: flex; flex-direction: column; }
    .ras-compose-row { display: flex; align-items: flex-end; gap: 8px; }
    /* запись голоса: текст идёт вживую, слева отмена, справа Готово */
    .ras-rec { flex: 1; min-width: 0; box-sizing: border-box; min-height: 44px; max-height: 130px; display: flex; align-items: flex-start; gap: 4px; padding: 0 14px 0 6px; border: 1px solid var(--raznos-green); border-radius: 22px; background: var(--raznos-bg); }
    .ras-rec-x { flex: none; width: 32px; height: 32px; margin-top: 5px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 50%; background: var(--raznos-surface-2); color: var(--raznos-ink-2); cursor: pointer; }
    .ras-rec-x:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .ras-rec-text { flex: 1; min-width: 0; max-height: 128px; overflow-y: auto; scrollbar-width: none; padding: 10px 0; font: 500 16px/22px var(--raznos-font); color: var(--raznos-ink); }
    .ras-rec-wait { display: inline-flex; align-items: center; gap: 8px; color: var(--raznos-ink-3); }
    .ras-rec-wait i { width: 8px; height: 8px; border-radius: 50%; background: var(--raznos-green); }
    /* поле растёт с текстом до пяти строк, дальше прокрутка внутри */
    .ras-input { flex: 1; min-width: 0; box-sizing: border-box; height: 44px; min-height: 44px; max-height: 130px; margin: 0; padding: 10px 14px; resize: none; overflow-y: hidden; scrollbar-width: none; border: 1px solid var(--raznos-line-strong); border-radius: 22px; background: var(--raznos-bg); color: var(--raznos-ink); font: 500 16px/22px var(--raznos-font); outline: none; }
    .ras-input:focus { border-color: var(--raznos-green); }
    .ras-input::-webkit-scrollbar { display: none; }
    .ras-send { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 50%; background: var(--raznos-green); color: #fff; cursor: pointer; }
    .ras-send:disabled { background: var(--raznos-surface-2); color: var(--raznos-ink-3); cursor: default; }
    /* микрофон вместо отправки, пока поле пустое; во время записи кнопка дышит кольцом, иконка становится стопом */
    .ras-mic { position: relative; }
    .ras-mic-on::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--raznos-green); opacity: 0.6; }
    @media (prefers-reduced-motion: no-preference) {
      .ras-mic-on::before { animation: ras-listen 1.2s ease-out infinite; }
      .ras-rec-wait i { animation: ras-rec-pulse 1.1s ease-in-out infinite; }
      @keyframes ras-rec-pulse { 50% { transform: scale(0.55); opacity: 0.5; } }
      @keyframes ras-listen { from { transform: scale(0.9); opacity: 0.8; } to { transform: scale(1.35); opacity: 0; } }
    }
    @media (prefers-reduced-motion: no-preference) {
      .ras-sheet { animation: ras-in .24s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes ras-in { from { transform: translateY(100%); } to { transform: none; } }
      .ras-aura i:nth-child(1) { animation: ras-drift-a 16s ease-in-out infinite alternate; }
      .ras-aura i:nth-child(2) { animation: ras-drift-b 19s ease-in-out infinite alternate; }
      .ras-aura i:nth-child(3) { animation: ras-drift-c 23s ease-in-out infinite alternate; }
      @keyframes ras-drift-a { 50% { transform: translate(25%, 15%) scale(1.1); } 100% { transform: translate(10%, 30%) scale(0.95); } }
      @keyframes ras-drift-b { 50% { transform: translate(-30%, 20%) scale(0.92); } 100% { transform: translate(-10%, -10%) scale(1.1); } }
      @keyframes ras-drift-c { 50% { transform: translate(20%, -20%) scale(0.9); } 100% { transform: translate(-15%, 5%) scale(1.12); } }
      .ras-orb i:nth-child(1) { animation: ras-orb-a 2.4s ease-in-out infinite alternate; }
      .ras-orb i:nth-child(2) { animation: ras-orb-b 2.9s ease-in-out infinite alternate; }
      .ras-orb i:nth-child(3) { animation: ras-orb-c 3.3s ease-in-out infinite alternate; }
      @keyframes ras-orb-a { to { transform: translate(40%, 35%) scale(1.15); } }
      @keyframes ras-orb-b { to { transform: translate(-45%, 25%) scale(0.9); } }
      @keyframes ras-orb-c { to { transform: translate(30%, -40%) scale(1.1); } }
      .ras-status-text { animation: ras-shimmer 1.8s linear infinite; }
      @keyframes ras-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
      .ras-skel i, .ras-skel-chips i { animation: ras-shimmer 1.4s linear infinite; }
      /* новые сообщения, карточки и действия мягко всплывают; стартовые вопросы лесенкой */
      .ras-feed .ram-row, .ras-feed .rac-wrap, .ras-feed .raa, .ras-status, .ras-err { animation: ras-rise 0.42s cubic-bezier(.16, 1, .3, 1) both; }
      .ras-empty-chips .ras-chip { animation: ras-rise 0.5s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--ras-i, 0) * 70ms + 120ms); }
      [data-ras-still] { animation: none !important; }
      .ras-empty b, .ras-empty-sub { animation: ras-rise 0.5s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes ras-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    }
  </style>
</helmet>
<div class="raznos-dialog-layer raznos-dialog-bottom" role="dialog" aria-modal="true" aria-label="Помощник" onClick="{{ close }}">
  <section class="{{ sheet_cls }}" onClick="{{ stop }}">
    <span class="ras-aura" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="ras-handle" aria-hidden="true"></span>
    <header class="ras-head">
      <div class="ras-head-main"><h2>Помощник</h2><span class="ras-sub">По вашим данным</span></div>
      <sc-if value="{{ can_reset }}" hint-placeholder-val="{{ false }}"><button type="button" class="ras-new" onClick="{{ new_chat }}" aria-label="Новый разговор" title="Новый разговор"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"/><path d="M17.6 3.4a1.9 1.9 0 0 1 2.7 2.7L12.5 14 9 15l1-3.5z"/></svg></button></sc-if>
      <button type="button" class="ras-close" onClick="{{ close }}" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="ras-feed" onScroll="{{ feed_scroll }}">
      <sc-if value="{{ show_skel }}" hint-placeholder-val="{{ false }}"><div class="ras-skel" aria-busy="true" aria-label="Загружаю помощника"><i class="ras-skel-title"></i><i class="ras-skel-title ras-skel-short"></i><i class="ras-skel-line"></i><i class="ras-skel-line ras-skel-short"></i><div class="ras-skel-chips"><i></i><i></i><i></i></div></div></sc-if>
      <sc-if value="{{ show_empty }}" hint-placeholder-val="{{ false }}">
        <div class="ras-empty">
          <b>{{ intro_title }}</b>
          <sc-if value="{{ on }}"><span class="ras-empty-sub">{{ intro_text }}. Менять что-то буду только после вашего согласия</span></sc-if><sc-if value="{{ off }}"><span class="ras-empty-sub">{{ off_note }}</span></sc-if>
          <sc-if value="{{ prompts_wait }}" hint-placeholder-val="{{ false }}"><div class="ras-skel-chips"><i></i><i></i><i></i></div></sc-if>
          <div class="ras-empty-chips"><sc-for list="{{ prompts }}" as="pc" hint-placeholder-count="3"><button type="button" class="ras-chip" style="{{ pc.style }}" onClick="{{ pc.tap }}">{{ pc.text }}</button></sc-for></div>
        </div>
      </sc-if>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="2">
        <sc-if value="{{ r.is_text }}" hint-placeholder-val="{{ true }}"><dc-import name="RaznosAssistantMessage" role="{{ r.role }}" text="{{ r.text }}" streaming="{{ r.streaming }}"></dc-import></sc-if>
        <sc-if value="{{ r.is_card }}" hint-placeholder-val="{{ false }}"><dc-import name="RaznosAssistantCard" card="{{ r.card }}"></dc-import></sc-if>
        <sc-if value="{{ r.is_action }}" hint-placeholder-val="{{ false }}"><dc-import name="RaznosAssistantAction" title="{{ r.title }}" note="{{ r.note }}" rows="{{ r.preview }}" state="{{ r.state }}" doneLabel="{{ r.done_label }}" applyLabel="{{ r.apply_label }}" onApply="{{ r.apply }}" onDismiss="{{ r.dismiss }}"></dc-import></sc-if>
      </sc-for>
      <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><div class="ras-status" role="status" aria-live="polite"><span class="ras-orb" aria-hidden="true"><i></i><i></i><i></i></span><span class="ras-status-text">{{ status }}</span></div></sc-if>
      <sc-if value="{{ has_error }}" hint-placeholder-val="{{ false }}">
        <div class="ras-err" role="alert"><span>{{ error_text }}</span>
          <sc-if value="{{ error_retry }}"><button type="button" class="raznos-btn raznos-btn-secondary raznos-btn-small" onClick="{{ retry }}">Повторить</button></sc-if>
          <sc-if value="{{ error_new }}"><button type="button" class="raznos-btn raznos-btn-secondary raznos-btn-small" onClick="{{ new_chat }}">Новый разговор</button></sc-if>
        </div>
      </sc-if>
    </div>
    <div class="ras-foot">
      <sc-if value="{{ undo_shown }}" hint-placeholder-val="{{ false }}"><div class="ras-undo" role="status"><span>Начат новый разговор</span><button type="button" class="ras-undo-btn" onClick="{{ undo_tap }}">Вернуть</button></div></sc-if>
      <sc-if value="{{ show_chips }}" hint-placeholder-val="{{ false }}"><div class="ras-chips"><sc-for list="{{ chips }}" as="ch" hint-placeholder-count="3"><button type="button" class="ras-chip" onClick="{{ ch.tap }}">{{ ch.text }}</button></sc-for></div></sc-if>
      <div class="ras-compose" style="{{ compose_style }}">
        <sc-if value="{{ listening }}" hint-placeholder-val="{{ false }}"><div class="ras-compose-row">
          <div class="ras-rec" role="status" aria-live="polite"><button type="button" class="ras-rec-x" onClick="{{ mic_cancel }}" aria-label="Отменить запись"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="ras-rec-text"><sc-if value="{{ rec_empty }}" hint-placeholder-val="{{ true }}"><span class="ras-rec-wait"><i></i>Говорите…</span></sc-if>{{ rec_text }}</span></div>
          <button type="button" class="ras-send ras-rec-done" onClick="{{ mic_done }}" aria-label="Готово, вставить текст"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
        </div></sc-if>
        <sc-if value="{{ not_listening }}" hint-placeholder-val="{{ true }}"><div class="ras-compose-row">
        <textarea class="ras-input" rows="1" maxlength="1000" enterkeyhint="enter" placeholder="{{ input_hint }}" value="{{ draft }}" onChange="{{ draft_change }}" onKeyDown="{{ draft_key }}" aria-label="Вопрос помощнику"></textarea>
        <sc-if value="{{ show_mic }}" hint-placeholder-val="{{ true }}"><button type="button" class="{{ mic_cls }}" onClick="{{ mic_tap }}" disabled="{{ mic_off }}" aria-label="{{ mic_aria }}" aria-pressed="{{ listening }}"><sc-if value="{{ listening }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></sc-if><sc-if value="{{ not_listening }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></sc-if></button></sc-if>
        <sc-if value="{{ show_send }}" hint-placeholder-val="{{ false }}"><button type="button" class="ras-send" onClick="{{ send_tap }}" disabled="{{ send_off }}" aria-label="Отправить"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button></sc-if>
</div></sc-if>
      </div>
    </div>

    this._set({ localOut: Object.assign({}, (this.state || {}).localOut || {}, { [id]: outcome }) });
  }
  _apply(a) {
    const p = this._p();
    let res = { ok: true };
    if (typeof p.runAction === 'function') res = p.runAction(a) || { ok: true };
    if (!res.ok) { this._mark(a.id, 'failed'); if (typeof p.pushEvent === 'function') p.pushEvent({ kind: 'action_result', actionId: a.id, outcome: 'failed' }); return; }
    this._mark(a.id, 'applied');
    // для перехода в сервис итог придёт событием возврата
    if (a.actionType !== 'open_service' && typeof p.pushEvent === 'function') p.pushEvent({ kind: 'action_result', actionId: a.id, outcome: 'applied' });
    if (a.continueAfter && !res.navigated) setTimeout(() => this._send({}), 120);
  }
  _dismiss(a) {
    const p = this._p();
    this._mark(a.id, 'dismissed');
    if (typeof p.pushEvent === 'function') p.pushEvent({ kind: 'action_result', actionId: a.id, outcome: 'dismissed' });
    if (a.continueAfter) setTimeout(() => this._send({}), 120);
  }
  renderVals() {
    const p = this._p();
    const st = this.state || {};
    const items = st.items || [];
    const busy = !!st.busy;
    const lastItem = items[items.length - 1];
    const rows = [];
    items.forEach((it, i) => {
      if (it.type === 'user') rows.push({ is_text: true, role: 'user', text: it.text, streaming: false });
      else if (it.type === 'text') rows.push({ is_text: true, role: 'assistant', text: it.text, streaming: !!it.streaming });
      else if (it.type === 'card') {
        const card = typeof p.cardProps === 'function' ? p.cardProps(it.kind, it.ref || {}) : null;
        if (card) rows.push({ is_card: true, card });
      } else if (it.type === 'action') {
        const prev = typeof p.previewAction === 'function' ? (p.previewAction(it) || {}) : {};
        const state = this._outcome(it.id);
        rows.push({ is_action: true, title: it.title, note: it.note, preview: prev.rows || [], state: state === 'failed' ? 'failed' : state, apply_label: prev.nav ? it.title : 'Применить', done_label: prev.nav ? 'Открыто' : '', apply: () => this._apply(it), dismiss: () => this._dismiss(it) });
      }
    });
    const hasUser = items.some((x) => x.type === 'user');
    const off = !!p.off;
    const prompts = off ? OFF_PROMPTS.map((x, i) => ({ text: x.text, style: '--ras-i:' + i, tap: () => { if (typeof p.onPromptScreen === 'function') p.onPromptScreen(x.id); } })) : (st.prompts || []).map((x, i) => ({ text: x.text, style: '--ras-i:' + i, tap: () => this._send({ text: x.text }) }));
    const replies = lastItem && lastItem.type === 'replies' && !busy ? lastItem.options : [];
    const chips = replies.length ? replies.map((t) => ({ text: t, tap: () => this._send({ text: t }) })) : (!busy && hasUser ? prompts : []);
    const err = st.error || null;
    const draft = st.draft || '';
    const screen = (typeof p.getContext === 'function' && (p.getContext() || {}).screen) || 'other';
    const listening = !!st.listening;
    const micOk = typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    const submit = () => { const t = String((this.state || {}).draft || '').trim(); if (t) this._send({ text: t }); };
    return {
      rows, busy, status: st.status || 'Думаю',
      intro_title: (RAS_INTRO[screen] || RAS_INTRO.other)[0], intro_text: (RAS_INTRO[screen] || RAS_INTRO.other)[1],
      sheet_cls: 'ras-sheet' + (!hasUser && items.length === 0 ? ' ras-sheet-empty' : ''),
      show_empty: !!st.restored && !hasUser && !busy && items.length === 0, prompts,
      show_skel: !st.restored && !off, prompts_wait: !!st.restored && !hasUser && !off && !st.promptsDone && (st.prompts || []).length === 0,
      compose_style: off ? 'display:none' : '', show_chips: chips.length > 0, chips, off, on: !off, off_note: 'Помощник выключен: вы не разрешили передавать данные. Включить можно в Настройках, строка Помощник: разрешить',
      has_error: !!err, error_text: err ? err.text : '', error_retry: !!(err && err.retry), error_new: !!(err && err.fresh),
      retry: () => { const e = (this.state || {}).error; this._set({ error: null }); if (e && e.retry === 'init') { this._init(); return; } const l = this._last || {}; this._send({ text: l.text, events: l.events, again: true }); },
      can_reset: items.length > 0 && !busy && !off, new_chat: () => this._newChat(),
      undo_shown: !!st.undoShown, undo_tap: () => this._undoReset(),
      draft, draft_change: (e) => this._set({ draft: e && e.target ? e.target.value : '' }),
      // Enter переносит строку, отправляет Ctrl+Enter или Cmd+Enter
      draft_key: (e) => { if (e && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); this._micStop(); submit(); } },
      send_tap: () => { this._micStop(); submit(); }, send_off: busy || !draft.trim(),
      // во время записи остаётся стоп, даже когда в поле уже появился текст
      show_send: !(micOk && (!draft.trim() || listening)), show_mic: micOk && (!draft.trim() || listening),
      listening, not_listening: !listening, mic_off: busy, mic_cls: 'ras-send ras-mic' + (listening ? ' ras-mic-on' : ''),
      mic_aria: listening ? 'Остановить запись' : 'Сказать голосом',
      mic_tap: () => (listening ? this._micDone() : this._micStart()),
      mic_done: () => this._micDone(), mic_cancel: () => this._micStop(),
      rec_text: st.recText || '', rec_empty: !st.recText,
      input_hint: listening ? 'Говорите' : (st.micNote || 'Спросите помощника'),
      feed_scroll: (e) => { const el = e && e.target; if (el) this._stick = el.scrollHeight - el.scrollTop - el.clientHeight < 80; },
      close: () => { if (typeof p.onClose === 'function') p.onClose(); },
      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); }
    };
  }
}
</script></body></html>
