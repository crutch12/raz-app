<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    /* цена перебронирования чеком: сначала вывод, потом строки с суммами справа, черта и итог */
    .rrbk { box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; border-radius: 16px; border: 1px solid var(--raznos-line); background: var(--raznos-surface); font-family: var(--raznos-font); color: var(--raznos-ink); }
    .rrbk-head { display: flex; align-items: center; gap: 10px; }
    .rrbk-head h3 { margin: 0; min-width: 0; font: 700 16px/1.3 var(--raznos-font); letter-spacing: -0.01em; text-wrap: balance; }
    .rrbk-items { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .rrbk-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; }
    .rrbk-item-copy { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .rrbk-item-copy b { font: 600 14px/1.3 var(--raznos-font); font-variant-numeric: tabular-nums; }
    .rrbk-item-copy small { font: 500 12px/1.3 var(--raznos-font); color: var(--raznos-ink-3); }
    .rrbk-sum { justify-self: end; font: 650 14px var(--raznos-mono); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--raznos-ink); }
    .rrbk-sum.rrbk-is-soft { font: 600 13px/1.3 var(--raznos-font); color: var(--raznos-ink-2); text-align: right; white-space: normal; }
    .rrbk-pen-mark { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--raznos-surface-2); color: var(--raznos-ink-3); }
    .rrbk-total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1.5px dashed var(--raznos-line); }
    .rrbk-total > span { font: 600 14px var(--raznos-font); color: var(--raznos-ink-2); }
    .rrbk-total > b { font: 800 26px/1 var(--raznos-mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--raznos-ink); }
    .rrbk-total.rrbk-is-plus > b { color: var(--raznos-green-deep); }
    .rrbk-notes { display: flex; flex-direction: column; gap: 4px; margin: -2px 0 0; padding: 0; list-style: none; }
    .rrbk-notes li { font: 500 12px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    .rrbk-notes li.rrbk-is-key { font-weight: 600; color: var(--raznos-ink-2); }
    .rrbk-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .rrbk-acts .raznos-btn { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* шторка с чеком: открывается с плашки на брони */
    .rrbk-wrap { display: contents; }
    .rrbk-layer { align-items: flex-end; padding: 0; }
    .rrbk-sheet { box-sizing: border-box; width: 100%; max-height: 92%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px calc(18px + env(safe-area-inset-bottom, 0px)); border-radius: 22px 22px 0 0; background: var(--raznos-surface); box-shadow: 0 -8px 28px rgb(0 0 0 / 0.14); }
    .rrbk-sheet .rrbk { padding: 0; border: 0; }
    .rrbk-handle { width: 38px; height: 4px; align-self: center; flex: none; border-radius: 999px; background: var(--raznos-line-strong); }
    .rrbk-sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -4px; }
    .rrbk-sheet-head > span { font: 600 13px var(--raznos-font); color: var(--raznos-ink-3); }
    .rrbk-close { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 12px; background: var(--raznos-surface-2); color: var(--raznos-ink); cursor: pointer; }
    .rrbk-close:focus-visible, .rrbk-chip:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    @media (prefers-reduced-motion: no-preference) {
      .rrbk-sheet { animation: rrbk-sheet-in .24s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes rrbk-sheet-in { from { transform: translateY(100%); } to { transform: none; } }
    }
    /* плашка на брони: спокойная зелёная рамка, без анимации, область нажатия 44 px */
    .rrbk-chip { align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; margin: -6px 0; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; color: inherit; border-radius: 999px; }
    .rrbk-chip-in { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px 5px 12px; border-radius: 999px; border: 1.5px solid color-mix(in oklab, var(--raznos-green) 60%, var(--raznos-line)); background: var(--raznos-surface); font: 600 13px/1.3 var(--raznos-font); color: var(--raznos-ink); white-space: nowrap; }
    /* плашка в две строки: на что меняем и сколько выйдет после штрафа, чтобы было ясно без шторки */
    .rrbk-chip-in { border-radius: 14px !important; padding: 8px 10px 8px 12px !important; gap: 8px !important; }
    .rrbk-chip-copy { display: flex; flex-direction: column; gap: 1px; text-align: left; }
    .rrbk-chip-copy small { font: 500 12px var(--raznos-font); color: var(--raznos-ink-2); }
    .rrbk-chip { margin: 0 !important; }
    .rrbk-chip-in b { font-weight: 750; color: var(--raznos-green-deep); font-variant-numeric: tabular-nums; }
    .rrbk-chip-in svg { flex: none; margin-left: -2px; color: var(--raznos-green-deep); }
    /* строка в списке пересечений вместо длинного текста */
    .rrbk-list { font: 500 12.5px/1.35 var(--raznos-font); color: var(--raznos-ink-2); }
    .rrbk-list b { font-weight: 700; color: var(--raznos-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rrbk-list b.rrbk-is-plus { color: var(--raznos-green-deep); }
    .rrbk-list b.rrbk-is-minus { color: var(--raznos-ink-3); font-weight: 600; }
  </style>
</helmet>
<sc-if value="{{ is_chip }}" hint-placeholder-val="{{ false }}"><button type="button" class="rrbk-chip" onClick="{{ on_open }}" aria-label="{{ aria }}"><span class="rrbk-chip-in"><span class="rrbk-chip-copy"><span>Заменить на {{ alt_short }} {{ alt_time }}</span><small><b>{{ net }}</b> {{ chip_sub }}</small></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button></sc-if>
<sc-if value="{{ is_list }}" hint-placeholder-val="{{ false }}"><span class="rrbk-list" aria-label="{{ aria }}">{{ list_text }}<b class="{{ list_cls }}">{{ list_val }}</b></span></sc-if>
<sc-if value="{{ is_receipt }}" hint-placeholder-val="{{ true }}"><div class="{{ layer_cls }}" onClick="{{ on_close }}">
  <section class="{{ sheet_cls }}" role="{{ sheet_role }}" aria-label="Цена перебронирования" onClick="{{ stop }}">
    <sc-if value="{{ is_sheet }}" hint-placeholder-val="{{ false }}"><span class="rrbk-handle" aria-hidden="true"></span>
    <div class="rrbk-sheet-head"><span>Цена перебронирования</span><button type="button" class="rrbk-close" onClick="{{ on_close }}" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></sc-if>
<div class="rrbk" role="group" aria-label="{{ aria }}">
  <div class="rrbk-head"><dc-import name="RaznosIcon" svc="{{ head_svc }}" alt="{{ head_alt }}" size="sm"></dc-import><h3>{{ headline }}</h3></div>
  <ul class="rrbk-items">
    <li class="rrbk-item"><dc-import name="RaznosIcon" svc="{{ alt_svc }}" alt="{{ alt_title }}" size="sm"></dc-import><span class="rrbk-item-copy"><b>{{ alt_title }}</b><small>{{ alt_time }} · возьмёте</small></span><span class="rrbk-sum">{{ alt_sum }}</span></li>
    <li class="rrbk-item"><dc-import name="RaznosIcon" svc="{{ mine_svc }}" alt="{{ mine_title }}" size="sm"></dc-import><span class="rrbk-item-copy"><b>{{ mine_title }}</b><small>{{ mine_time }} · {{ mine_sub }}</small></span><span class="rrbk-sum">{{ mine_sum }}</span></li>
    <li class="rrbk-item"><span class="rrbk-pen-mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></span><span class="rrbk-item-copy"><b>{{ pen_label }}</b></span><span class="{{ pen_cls }}">{{ pen }}</span></li>
    <sc-if value="{{ has_bonus }}" hint-placeholder-val="{{ false }}"><li class="rrbk-item"><span class="rrbk-pen-mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></span><span class="rrbk-item-copy"><b>{{ bonus_label }}</b></span><span class="rrbk-sum">{{ bonus_sum }}</span></li></sc-if>
  </ul>
  <sc-if value="{{ has_net }}" hint-placeholder-val="{{ true }}"><div class="{{ total_cls }}"><span>Итог</span><b>{{ net }}</b></div></sc-if>
  <ul class="rrbk-notes"><sc-for list="{{ notes }}" as="n" hint-placeholder-count="1"><li class="{{ n.cls }}">{{ n.text }}</li></sc-for></ul>
  <sc-if value="{{ has_acts }}" hint-placeholder-val="{{ true }}"><div class="rrbk-acts"><button type="button" class="{{ take_cls }}" onClick="{{ on_take }}">{{ take_label }}</button><button type="button" class="{{ keep_cls }}" onClick="{{ on_keep }}">Оставить свою</button></div></sc-if>
</div>
  </section>
</div></sc-if>
</x-dc><script type="text/x-dc" data-dc-script data-props='{
  "variant": { "editor": "enum", "options": ["full", "sheet", "chip", "list"], "default": "full" },
  "altSvc": { "editor": "text", "default": "x5" },
  "altTitle": { "editor": "text", "default": "X5" },
  "altTime": { "editor": "text", "default": "17:30–23:00" },
  "altSum": { "editor": "int", "default": 3200 },
  "mineSvc": { "editor": "text", "default": "yandex-eda" },
  "mineTitle": { "editor": "text", "default": "Яндекс Еда" },
  "mineTime": { "editor": "text", "default": "17:00–21:00" },
  "mineSum": { "editor": "int", "default": 2400 },
  "penalty": { "editor": "int", "default": 600 },
  "bonus": { "editor": "int", "default": 0 },
  "freeUntil": { "editor": "text", "default": "" },
  "other": { "editor": "text", "default": "" },
  "requested": { "editor": "bool", "default": false },
  "takeLabel": { "editor": "text", "default": "" },
  "onTake": { "editor": null }, "onKeep": { "editor": null }, "onOpen": { "editor": null }, "onClose": { "editor": null },
  "$preview": { "width": 360, "height": 330 }
}'>
// суммы считает экран: доход слота и вашей смены той же моделью, что в Плане, штраф из правил сервиса
// penalty null значит сумму сервис не публикует, итог тогда не считаем, 0 значит без штрафа
const RRB_FMT = (n) => String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
const RRB_SIGNED = (n) => (n > 0 ? '+' : (n < 0 ? '−' : '')) + RRB_FMT(n);
// родительный падеж для строки списка: вместо Яндекс Еды
// взять можно только в приложении сервиса, поэтому на кнопке где: Взять в X5
const RRB_PREP = { 'yandex-eda': 'Яндекс Еде', 'yandex-lavka': 'Лавке', samokat: 'Самокате', vkusvill: 'ВкусВилле', magnit: 'Магните', dodo: 'Додо', kuper: 'Купере', 'ozon-fresh': 'Ozon Fresh', 'ozon-courier': 'Ozon' };
const RRB_GEN = { 'yandex-eda': 'Яндекс Еды', 'yandex-lavka': 'Яндекс Лавки', samokat: 'Самоката', vkusvill: 'ВкусВилла', magnit: 'Магнита', dodo: 'Додо', 'kuper': 'Купера', 'ozon-fresh': 'Ozon Fresh', 'ozon-courier': 'Ozon' };
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const v = (k, d) => (p[k] == null ? d : p[k]);
    const fn = (f) => (typeof f === 'function' ? f : () => {});
    const variant = v('variant', 'full');
    const altSum = Number(v('altSum', 3200)), mineSum = Number(v('mineSum', 2400));
    const penalty = 'penalty' in p ? (p.penalty == null || p.penalty === '' ? null : Number(p.penalty)) : 600;
    const requested = !!p.requested, free = penalty === 0, known = penalty != null;
    // бонус сервиса на брони пропадёт вместе с ней
    const bonus = Number(v('bonus', 0)) || 0;
    const net = known ? altSum - mineSum - penalty - bonus : null;
    const altTitle = v('altTitle', 'X5'), altTime = v('altTime', '17:30–23:00');
    // в заголовке, плашке и кнопке короткое имя: X5 вместо X5 Доставка
    const altShort = String(altTitle).replace(/\s+Доставка$/, '');
    const mineTitle = v('mineTitle', 'Яндекс Еда'), mineSvc = v('mineSvc', 'yandex-eda');
    const keep = known && net <= 0;
    const pen = !known ? 'неизвестен' : (free ? (requested ? 'без штрафа' : (p.freeUntil ? 'нет до ' + p.freeUntil : 'нет')) : RRB_SIGNED(-penalty));
    const notes = [];
    if (!known) notes.push({ text: 'Итог не считаем: сервис не публикует штраф', cls: 'rrbk-is-key' });
    if (p.other) notes.push({ text: (free ? 'Денег не снимут, но ' : 'Кроме штрафа: ') + p.other, cls: '' });
    notes.push({ text: 'Это оценка: доход по похожим сменам курьеров Разноса, штраф по правилам сервиса', cls: '' });
    const takeLabel = p.takeLabel || 'Взять в ' + (RRB_PREP[v('altSvc', 'x5')] || altShort);
    const listHead = 'вместо ' + (RRB_GEN[mineSvc] || mineTitle) + ': ';
    return {
      is_receipt: variant === 'full' || variant === 'sheet', is_sheet: variant === 'sheet',
      layer_cls: variant === 'sheet' ? 'raznos-dialog-layer rrbk-layer' : 'rrbk-wrap', sheet_cls: variant === 'sheet' ? 'rrbk-sheet' : 'rrbk-wrap', sheet_role: variant === 'sheet' ? 'dialog' : 'none', is_chip: variant === 'chip', is_list: variant === 'list',
      headline: !known ? 'Можно взять ' + altShort + ' ' + altTime : (keep ? 'Выгоднее оставить свою смену' : 'Выгоднее взять ' + altShort + ' ' + altTime),
      head_svc: keep ? mineSvc : v('altSvc', 'x5'), head_alt: keep ? mineTitle : altTitle,
      alt_svc: v('altSvc', 'x5'), alt_title: altTitle, alt_short: altShort, alt_time: altTime, alt_sum: RRB_SIGNED(altSum), alt_sum_n: altSum,
      mine_svc: mineSvc, mine_title: mineTitle, mine_time: v('mineTime', '17:00–21:00'), mine_sum: RRB_SIGNED(-mineSum), mine_sum_n: mineSum,
      mine_sub: requested ? 'ваша заявка, отзовёте' : 'ваша бронь, отмените',
      pen_label: requested ? 'Отзыв заявки' : 'Штраф за отмену', pen, pen_cls: 'rrbk-sum' + (known && !free ? '' : ' rrbk-is-soft'),
      penalty_n: penalty, free_until: p.freeUntil || '', requested, other: p.other || '',
      // у заявки штрафа нет, её просто отзывают
      chip_sub: requested ? 'заявку отзовёте' : (free ? 'без штрафа за отмену' : 'даже со штрафом за отмену'),
      has_net: known, net: net == null ? '' : RRB_SIGNED(net), total_cls: 'rrbk-total' + (net > 0 ? ' rrbk-is-plus' : ''),
      has_bonus: bonus > 0, bonus_label: 'Бонус ' + (RRB_GEN[mineSvc] || mineTitle), bonus_sum: RRB_SIGNED(-bonus),
      notes,
      has_acts: typeof p.onTake === 'function' || typeof p.onKeep === 'function',
      take_label: takeLabel, take_cls: 'raznos-btn ' + (keep ? 'raznos-btn-secondary' : 'raznos-btn-primary'), keep_cls: 'raznos-btn ' + (keep ? 'raznos-btn-primary' : 'raznos-btn-secondary'),
      on_take: fn(p.onTake), on_keep: fn(p.onKeep), on_open: fn(p.onOpen), on_close: variant === 'sheet' ? fn(p.onClose) : () => {},
      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
      // в минус замену не предлагаем: строка нейтральная и без слова вместо
      list_text: known && net <= 0 ? 'замена не выгодна: ' : listHead + (known ? 'итог ' : 'штраф '), list_val: known ? RRB_SIGNED(net) : 'неизвестен', list_cls: net > 0 ? 'rrbk-is-plus' : (known ? 'rrbk-is-minus' : ''),
      aria: 'Вместо ' + mineTitle + ' ' + v('mineTime', '') + ' взять ' + altTitle + ' ' + altTime + (known ? ', итог ' + RRB_SIGNED(net) : ', штраф неизвестен')
    };
  }
}
</script></body></html>
