<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rgp-layer { align-items: flex-end; padding: 0; }
    .rgp-sheet { box-sizing: border-box; width: 100%; max-height: 92%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 8px 20px 18px; border-radius: 22px 22px 0 0; background: var(--raznos-surface); color: var(--raznos-ink); box-shadow: 0 -18px 48px rgba(20, 25, 40, 0.2); }
    .rgp-handle { width: 38px; height: 4px; align-self: center; flex: none; border-radius: 999px; background: var(--raznos-line-strong); }
    .rgp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -6px; }
    .rgp-head h2 { margin: 0; font: 700 20px/1.2 var(--raznos-font); letter-spacing: -0.02em; }
    .rgp-head h2 > .rgp-time { font-family: var(--raznos-mono); font-weight: 700; font-size: 18px; }
    .rgp-close { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 12px; background: var(--raznos-surface-2); color: var(--raznos-ink); cursor: pointer; }
    .rgp-close:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .rgp-sub { margin: -6px 0 0; font: 500 13px var(--raznos-font); color: var(--raznos-ink-3); }
    .rgp-label { margin: 6px 0 0; font: 600 13px var(--raznos-font); color: var(--raznos-ink-2); }
    .rgp-list { display: flex; flex-direction: column; gap: 8px; }
    .rgp-hint { margin: -4px 0 0; font: 500 12px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    .rgp-none { margin: 0; padding: 12px; border-radius: 12px; background: var(--raznos-surface-2); font: 500 13px var(--raznos-font); color: var(--raznos-ink-3); }
    .rgp-remove { color: var(--raznos-red); }
    @media (prefers-reduced-motion: no-preference) {
      .rgp-sheet { animation: rgp-in .24s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes rgp-in { from { transform: translateY(100%); } to { transform: none; } }
    }
  </style>
</helmet>
<div class="raznos-dialog-layer rgp-layer" onClick="{{ close }}">
  <section class="rgp-sheet" role="dialog" aria-modal="true" aria-label="{{ aria }}" onClick="{{ stop }}">
    <span class="rgp-handle" aria-hidden="true"></span>
    <div class="rgp-head"><h2>{{ head }} <span class="rgp-time">{{ from }}–{{ to }}</span></h2><button type="button" class="rgp-close" onClick="{{ close }}" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="rgp-sub">{{ sub }}</p>
    <sc-if value="{{ has_current }}" hint-placeholder-val="{{ false }}">
      <p class="rgp-label">Сейчас в плане</p>
      <dc-import name="RaznosPlanWindow" from="{{ cur.from }}" to="{{ cur.to }}" svc="{{ cur.svc }}" title="{{ cur.title }}" sub="{{ cur.sub }}" pay="{{ cur.pay }}" kind="{{ cur.kind }}" badge="{{ cur.badge }}" note="{{ cur.note }}" action="{{ cur.action }}" actionKind="{{ cur.actionKind }}" onAction="{{ cur.onAction }}" urgent="{{ cur.urgent }}" plain="{{ true }}"></dc-import>
    </sc-if>
    <sc-if value="{{ has_best }}" hint-placeholder-val="{{ true }}">
      <p class="rgp-label">{{ best_label }}</p>
      <dc-import name="RaznosPlanWindow" from="{{ best.from }}" to="{{ best.to }}" svc="{{ best.svc }}" title="{{ best.title }}" sub="{{ best.sub }}" pay="{{ best.pay }}" kind="{{ best.kind }}" badge="{{ best.badge }}" note="{{ best.note }}" action="{{ best.action }}" actionKind="{{ best.actionKind }}" onAction="{{ best.onAction }}" onBadge="{{ best.onBadge }}" gain="{{ best.gain }}" loss="{{ best.loss }}" added="{{ best.added }}" plain="{{ true }}"></dc-import>
    </sc-if>
    <sc-if value="{{ has_more }}" hint-placeholder-val="{{ true }}">
      <p class="rgp-label">{{ more_label }}</p>
      <div class="rgp-list"><sc-for list="{{ more }}" as="o" hint-placeholder-count="2"><dc-import name="RaznosPlanWindow" from="{{ o.from }}" to="{{ o.to }}" svc="{{ o.svc }}" title="{{ o.title }}" sub="{{ o.sub }}" pay="{{ o.pay }}" kind="{{ o.kind }}" badge="{{ o.badge }}" note="{{ o.note }}" action="{{ o.action }}" actionKind="{{ o.actionKind }}" onAction="{{ o.onAction }}" onBadge="{{ o.onBadge }}" gain="{{ o.gain }}" loss="{{ o.loss }}" added="{{ o.added }}" plain="{{ true }}"></dc-import></sc-for></div>
    </sc-if>
    <sc-if value="{{ has_extra }}" hint-placeholder-val="{{ false }}">
      <p class="rgp-label">Выходят за свободное время</p>
      <p class="rgp-hint">Придётся работать дольше, чем стоит в плане. Перед добавлением спросим отдельно</p>
      <div class="rgp-list"><sc-for list="{{ extra }}" as="x" hint-placeholder-count="1"><dc-import name="RaznosPlanWindow" from="{{ x.from }}" to="{{ x.to }}" svc="{{ x.svc }}" title="{{ x.title }}" sub="{{ x.sub }}" pay="{{ x.pay }}" kind="{{ x.kind }}" badge="{{ x.badge }}" note="{{ x.note }}" action="{{ x.action }}" actionKind="{{ x.actionKind }}" onAction="{{ x.onAction }}" onBadge="{{ x.onBadge }}" gain="{{ x.gain }}" loss="{{ x.loss }}" added="{{ x.added }}" plain="{{ true }}"></dc-import></sc-for></div>
    </sc-if>
    <sc-if value="{{ has_rely }}" hint-placeholder-val="{{ true }}"><p class="rgp-hint">{{ rely }}</p></sc-if>
    <sc-if value="{{ no_options }}" hint-placeholder-val="{{ false }}"><p class="rgp-none">Других вариантов на это время нет</p></sc-if>
    <sc-if value="{{ has_remove }}" hint-placeholder-val="{{ false }}"><button type="button" class="raznos-btn raznos-btn-ghost rgp-remove" onClick="{{ remove }}">Убрать из плана</button></sc-if>
    <sc-if value="{{ no_remove }}" hint-placeholder-val="{{ true }}"><button type="button" class="raznos-btn raznos-btn-ghost" onClick="{{ close }}">{{ close_label }}</button></sc-if>
  </section>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"from":{"editor":"text","default":"18:00"},"to":{"editor":"text","default":"22:00"},"current":{"editor":null},"options":{"editor":null},"extra":{"editor":null},"rely":{"editor":"text"},"doneNote":{"editor":"text"},"closeLabel":{"editor":"text"},"onRemove":{"editor":null},"onClose":{"editor":null},"$preview":{"width":390,"height":620}}'>
// один выбор на любой отрезок времени: свободное время или окно плана, что стоит сейчас и чем можно заменить
const RGP_DEMO = [
  { from: '18:00', to: '22:00', svc: 'yandex-eda', title: 'Яндекс Еда', sub: 'Центр', pay: '≈ 800 ₽/ч', kind: 'free', badge: 'свободный выход', note: '+3 200 ₽ к неделе', action: 'В план', actionKind: 'primary', gain: true },
  { from: '18:00', to: '22:00', svc: 'samokat', title: 'Самокат', sub: 'Даркстор Беговая, 7', pay: '≈ 780 ₽/ч', kind: 'need', badge: 'нужен слот', note: '+3 120 ₽ к неделе, слот нужно взять', action: 'В план', actionKind: 'primary', gain: true }
];
const RGP_PLURAL = (n) => { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return 'вариант'; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'варианта'; return 'вариантов'; };
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const list = p.options || (p.current ? [] : RGP_DEMO);
    const cur = p.current || null;
    const fn = (f) => (typeof f === 'function' ? f : () => {});
    const norm = (o) => Object.assign({}, o, { onAction: fn(o.onAction), onBadge: fn(o.onBadge) });
    const n = list.length;
    const extra = (p.extra || []).map(norm);
    return {
      head: cur ? 'Смена' : 'Чем занять', from: p.from || '18:00', to: p.to || '22:00',
      aria: (cur ? 'Смена ' : 'Чем занять ') + (p.from || '18:00') + '–' + (p.to || '22:00'),
      has_current: !!cur, cur: cur ? norm(cur) : {},
      has_best: n > 0, best: n ? norm(list[0]) : {},
      best_label: cur ? 'Можно вместо' : 'Лучше всего',
      has_more: n > 1, more: list.slice(1).map(norm),
      // сколько всего вариантов видно сразу, иначе кажется, что есть только один
      sub: p.doneNote ? p.doneNote : cur
        ? (n ? n + ' ' + RGP_PLURAL(n) + ' вместо него' + (n > 1 ? ', выгоднее сверху' : '') + '. Это ещё не бронь, смену можно поменять' : 'Это ещё не бронь, смену можно поменять или убрать')
        : (n > 1 ? n + ' ' + RGP_PLURAL(n) + ' на это время, лучший сверху. Пока ничего не поставлено' : 'Пока это свободное время. Поставьте в план или оставьте свободным'),
      more_label: 'Ещё ' + (n - 1) + ' ' + RGP_PLURAL(n - 1),
      close_label: p.closeLabel || 'Оставить свободным',
      has_extra: extra.length > 0, extra, has_rely: !!p.rely && (n > 0 || !!cur), rely: p.rely || '',
      no_options: !!cur && !n,
      has_remove: !!cur && typeof p.onRemove === 'function', no_remove: !cur, remove: fn(p.onRemove),
      close: fn(p.onClose), stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); }
    };
  }
}
</script></body></html>
