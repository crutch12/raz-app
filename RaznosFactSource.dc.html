<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rfs { display: inline; color: var(--raznos-ink-3); font: 500 12px/1.4 var(--raznos-font); }
  </style>
</helmet>
<sc-if value="{{ has_label }}" hint-placeholder-val="{{ true }}"><span class="rfs" title="{{ hint }}">{{ label }}</span></sc-if>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"src":{"editor":"text","default":""},"$preview":{"width":220,"height":40}}'>
// пометка неофициального факта обычными словами, мелким серым текстом без рамки, у официального факта её нет
// служебные уровни источника пользователю не показываем, APK никогда
const RFS_LABELS = {
  'отзывы': ['со слов курьеров', 'Так пишут курьеры, сервис этого не публиковал'],
  'вторичный': ['из пересказов', 'Не со страницы сервиса, а из пересказа'],
  'не подтверждено': ['точно не известно', 'Источник не подтвердил, лучше уточнить в сервисе'],
  'партнёрские материалы': ['по словам партнёров', 'Из материалов партнёров сервиса, не из правил для курьеров'],
  'со слов пользователя': ['вы так указали', 'Так сказал пользователь, сервис этого не подтвердил'],
  'источники расходятся': ['точно не известно, уточните в сервисе', 'Страницы сервиса говорят по-разному']
};
// служебные метки, APK и со слов курьеров не выводим
const RFS_HIDDEN = /^(APK|демо|отзывы)$|apk/i;
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const src = p.src || '';
    const found = RFS_LABELS[src];
    const label = RFS_HIDDEN.test(src) ? '' : (found ? found[0] : src);
    return { has_label: !!label, label, hint: found ? found[1] : '' };
  }
}
</script></body></html>
