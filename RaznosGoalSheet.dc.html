<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics>
  <link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    .rgs-layer { align-items: flex-end; padding: 0; }
    .rgs-sheet { box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 18px; padding: 8px 20px 18px; border-radius: 22px 22px 0 0; background: var(--raznos-surface); color: var(--raznos-ink); box-shadow: 0 -18px 48px rgba(20, 25, 40, 0.2); }
    .rgs-handle { width: 38px; height: 4px; align-self: center; border-radius: 999px; background: var(--raznos-line-strong); }
    .rgs-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -8px; }
    .rgs-head h2 { margin: 0; font: 700 20px/1.2 var(--raznos-font); letter-spacing: -0.02em; }
    .rgs-close { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 12px; background: var(--raznos-surface-2); color: var(--raznos-ink); cursor: pointer; }
    .rgs-goal { display: flex; flex-direction: column; gap: 10px; }
    .rgs-goal-field { display: flex; align-items: baseline; gap: 6px; padding-bottom: 6px; border-bottom: 2px solid var(--raznos-line-strong); }
    .rgs-goal-field:focus-within { border-bottom-color: var(--raznos-green); }
    .rgs-goal-field input { min-width: 0; width: 100%; padding: 0; border: 0; background: transparent; color: var(--raznos-ink); font: 800 34px var(--raznos-font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; caret-color: var(--raznos-green); outline: none; }
    .rgs-goal-field span { font: 700 22px var(--raznos-font); color: var(--raznos-ink-3); }
    .rgs-presets { display: flex; flex-wrap: wrap; gap: 8px; }
    .rgs-preset { min-height: 36px; padding: 0 12px; border: 1px solid var(--raznos-line-strong); border-radius: 999px; background: var(--raznos-surface); color: var(--raznos-ink-2); font: 600 13px var(--raznos-font); font-variant-numeric: tabular-nums; cursor: pointer; }
    .rgs-preset.raznos-is-active { border-color: var(--raznos-dark); background: var(--raznos-dark); color: var(--raznos-on-dark); }
    .rgs-bar { position: relative; height: 12px; border-radius: 999px; background: var(--raznos-surface-2); }
    .rgs-bar-fill { position: absolute; inset: 0; display: flex; border-radius: 999px; overflow: hidden; }
    .rgs-bar-fill > i { display: block; height: 100%; }
    .rgs-earned { background: var(--raznos-green-deep); }
    .rgs-booked { background: var(--raznos-green); }
    .rgs-plan { background: repeating-linear-gradient(-45deg, color-mix(in oklab, var(--raznos-green) 45%, var(--raznos-surface-2)) 0 4px, color-mix(in oklab, var(--raznos-green) 22%, var(--raznos-surface-2)) 4px 8px); }
    .rgs-mark { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--raznos-ink); }
    .rgs-legend { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .rgs-legend li { display: flex; align-items: center; gap: 10px; font: 500 14px var(--raznos-font); color: var(--raznos-ink-2); }
    .rgs-legend li > i { width: 12px; height: 12px; flex: none; border-radius: 4px; }
    .rgs-legend li > span { flex: 1; }
    .rgs-legend li > b { font: 700 14px var(--raznos-font); color: var(--raznos-ink); font-variant-numeric: tabular-nums; }
    .rgs-verdict { display: flex; flex-direction: column; gap: 4px; }
    .rgs-verdict > b { font: 700 16px var(--raznos-font); color: var(--raznos-green-deep); }
    .rgs-verdict.rgs-short > b { color: var(--raznos-ink); }
    .rgs-verdict > span { font: 500 13px var(--raznos-font); color: var(--raznos-ink-2); }
    .rgs-close:focus-visible, .rgs-preset:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    @media (prefers-reduced-motion: no-preference) {
      .rgs-sheet { animation: rgs-in .28s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes rgs-in { from { transform: translateY(18px); } to { transform: none; } }
    }
  </style>
</helmet>
<div class="raznos-dialog-layer rgs-layer" onClick="{{ close }}">
  <section class="rgs-sheet" role="dialog" aria-modal="true" aria-label="Цель недели" onClick="{{ stop }}">
    <span class="rgs-handle" aria-hidden="true"></span>
    <div class="rgs-head">
      <h2>Цель недели</h2>
      <button type="button" class="rgs-close" onClick="{{ close }}" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="rgs-goal">
      <label class="rgs-goal-field"><input type="text" inputmode="numeric" value="{{ goal_text }}" onChange="{{ goal_change }}" aria-label="Цель недели в рублях" /><span>₽</span></label>
      <div class="rgs-presets"><sc-for list="{{ presets }}" as="pr" hint-placeholder-count="2"><button type="button" class="{{ pr.cls }}" onClick="{{ pr.tap }}">{{ pr.label }}</button></sc-for></div>
    </div>

    <div class="rgs-bar" role="img" aria-label="{{ bar_aria }}">
      <span class="rgs-bar-fill"><i class="rgs-earned" style="{{ earned_style }}"></i><i class="rgs-booked" style="{{ booked_style }}"></i><i class="rgs-plan" style="{{ plan_style }}"></i></span>
      <span class="rgs-mark" style="{{ mark_style }}"></span>
    </div>
    <ul class="rgs-legend">
      <li><i class="rgs-earned"></i><span>Заработано</span><b>{{ earned }}</b></li>
      <li><i class="rgs-booked"></i><span>Брони из Смен</span><b>{{ booked }}</b></li>
      <li><i class="rgs-plan"></i><span>Окна плана</span><b>{{ planned }}</b></li>
    </ul>

    <div class="{{ verdict_cls }}">
      <b>{{ verdict }}</b>
      <sc-if value="{{ has_risk }}" hint-placeholder-val="{{ true }}"><span>{{ risk }}</span></sc-if>
    </div>

    <sc-if value="{{ short }}" hint-placeholder-val="{{ false }}"><button type="button" class="raznos-btn raznos-btn-primary" onClick="{{ fix }}">Показать, где добрать</button></sc-if>
    <sc-if value="{{ not_short }}" hint-placeholder-val="{{ true }}"><button type="button" class="raznos-btn raznos-btn-secondary" onClick="{{ close }}">Готово</button></sc-if>
  </section>
</div>
</x-dc><script type="text/x-dc" data-dc-script data-props='{"goal":{"editor":"number"},"earned":{"editor":"number"},"booked":{"editor":"number"},"planned":{"editor":"number"},"usual":{"editor":"number"},"best":{"editor":"number"},"rate":{"editor":"number"},"orderPay":{"editor":"number"},"daysLeft":{"editor":"number"},"onGoal":{"editor":null},"onFix":{"editor":null},"onClose":{"editor":null},"$preview":{"width":390,"height":620}}'>
// шторка цели недели: цель, чем она закрывается и что сделать
const RGS_FMT = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const RGS_R = (n) => Math.round(n / 100) * 100;
const RGS_ORDERS = (n) => { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return 'заказ'; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'заказа'; return 'заказов'; };
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const goal = p.goal || 30000;
    const earned = p.earned != null ? p.earned : 8000;
    const booked = RGS_R(p.booked != null ? p.booked : 19600);
    const planned = RGS_R(p.planned != null ? p.planned : 9500);
    const rate = p.rate || 700;
    // средняя оплата заказа по своим сменам, чтобы разрыв был понятен и в заказах
    const orderPay = p.orderPay || 240;
    const total = earned + booked + planned;
    const short = total < goal;
    const sure = earned + booked;
    // шкала до большего из цели и суммы, чтобы черта цели всегда была на полосе
    const scale = Math.max(goal, total) || 1;
    const pct = (v) => Math.max(0, v * 100 / scale).toFixed(1) + '%';
    const setGoal = (v) => { if (typeof p.onGoal === 'function' && v > 0) p.onGoal(v); };
    const presets = [['Обычная', p.usual || 27000], ['Лучшая', p.best || 34000]].map(([label, v]) => ({
      label: label + ' ≈ ' + RGS_FMT(v), cls: 'rgs-preset' + (v === goal ? ' raznos-is-active' : ''), tap: () => setGoal(v)
    }));
    const gap = Math.abs(goal - total);
    const hours = Math.max(1, Math.round(gap / rate));
    const orders = Math.max(1, Math.round(gap / orderPay));
    // часы раскладываем на оставшиеся дни, пусть курьер сам решит, реально ли это
    const daysLeft = Math.max(1, p.daysLeft || 6);
    const perDay = daysLeft === 1 ? '≈ ' + hours + ' ч сегодня' : 'по ≈ ' + Math.max(1, Math.round(hours / daysLeft)) + ' ч в день до воскресенья';
    const close = () => { if (typeof p.onClose === 'function') p.onClose(); };
    return {
      goal_text: RGS_FMT(goal),
      goal_change: (e) => setGoal(parseInt(String((e && e.target ? e.target.value : e) || '').replace(/\D/g, ''), 10) || 0),
      presets,
      earned: RGS_FMT(earned) + ' ₽', booked: '≈ ' + RGS_FMT(booked) + ' ₽', planned: '≈ ' + RGS_FMT(planned) + ' ₽',
      earned_style: 'width:' + pct(earned), booked_style: 'width:' + pct(booked), plan_style: 'width:' + pct(planned),
      mark_style: 'left:' + pct(goal),
      bar_aria: 'Заработано ' + RGS_FMT(earned) + ', брони ' + RGS_FMT(booked) + ', окна плана ' + RGS_FMT(planned) + ' из цели ' + RGS_FMT(goal) + ' рублей',
      short, not_short: !short,
      verdict_cls: 'rgs-verdict' + (short ? ' rgs-short' : ''),
      verdict: short ? 'Не хватает ≈ ' + RGS_FMT(RGS_R(gap)) + ' ₽, это ≈ ' + orders + ' ' + RGS_ORDERS(orders) + ', ' + perDay : (earned >= goal ? 'Цель уже выполнена, сверху ≈ ' + RGS_FMT(RGS_R(earned - goal)) + ' ₽' : 'Плана хватит на цель, запас ≈ ' + RGS_FMT(RGS_R(gap)) + ' ₽'),
      // окна плана это прогноз, поэтому отдельно говорим, если цель держится на них
      has_risk: !short && sure < goal,
      risk: 'Без окон плана не хватит ≈ ' + RGS_FMT(RGS_R(goal - sure)) + ' ₽',
      fix: () => { if (typeof p.onFix === 'function') p.onFix(); },
      close, stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); }
    };
  }
}
</script></body></html>
