<!DOCTYPE html><html><head><meta charset="utf-8" /><script src="./support.js"></script></head><body><x-dc>
<helmet data-dc-atomics><link rel="stylesheet" href="./raznos-v3.css" />
  <style>
    /* свой транспорт или аренда электровелосипеда: строка в Расходах и калькулятор в шторке */
    .rtc { display: flex; flex-direction: column; gap: 14px; font-family: var(--raznos-font); color: var(--raznos-ink); }
    .rtc-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-radius: 16px; background: var(--raznos-surface); font: inherit; color: inherit; text-align: left; cursor: pointer; }
    .rtc-row:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .rtc-row-icon { flex: none; width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--raznos-surface-2); color: var(--raznos-ink-2); }
    .rtc-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .rtc-row-main b { font: 650 15px/1.3 var(--raznos-font); }
    .rtc-row-main span { font: 500 13px/1.35 var(--raznos-font); color: var(--raznos-ink-2); }
    .rtc-row-chev { flex: none; color: var(--raznos-ink-3); font-size: 20px; }
    .rtc-inputs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .rtc-in { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; min-width: 0; }
    .rtc-in > span { font: 500 12px/1.3 var(--raznos-font); color: var(--raznos-ink-3); }
    .rtc-in .raznos-field-box { min-height: 44px; padding: 0 10px; gap: 4px; }
    .rtc-in input { width: 100%; min-width: 0; border: 0; padding: 0; background: none; font: 650 16px var(--raznos-font); color: var(--raznos-ink); font-variant-numeric: tabular-nums; }
    .rtc-in input:focus { outline: none; }
    .rtc-in .raznos-field-box:focus-within { border-color: var(--raznos-ink); box-shadow: inset 0 0 0 1px var(--raznos-ink); }
    .rtc-src { margin: -6px 0 0; font: 500 12px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    .rtc-tariffs { display: flex; flex-direction: column; gap: 6px; }
    .rtc-tariff { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--raznos-line-strong); background: var(--raznos-surface); font: inherit; color: inherit; text-align: left; cursor: pointer; }
    .rtc-tariff:focus-visible { outline: 2px solid var(--raznos-green); outline-offset: 2px; }
    .rtc-tariff.raznos-is-active { border-color: var(--raznos-ink); box-shadow: inset 0 0 0 1px var(--raznos-ink); }
    .rtc-tariff span { flex: 1; min-width: 0; font: 600 14px/1.3 var(--raznos-font); }
    .rtc-tariff span small { display: block; font: 500 12px var(--raznos-font); color: var(--raznos-ink-3); }
    .rtc-tariff b { flex: none; font: 700 14px var(--raznos-font); font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* итог: две полосы в одном масштабе, разница словами */
    .rtc-result { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--raznos-surface-2); }
    .rtc-bars { display: flex; flex-direction: column; gap: 6px; }
    .rtc-bar { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; align-items: center; gap: 8px; font: 500 13px var(--raznos-font); color: var(--raznos-ink-2); }
    .rtc-bar i { display: block; height: 10px; border-radius: 999px; background: var(--raznos-line-strong); transform-origin: left; }
    .rtc-bar.rtc-is-cheaper i { background: var(--raznos-green); }
    .rtc-bar b { font: 700 13.5px var(--raznos-font); color: var(--raznos-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rtc-verdict { margin: 0; font: 700 16px/1.35 var(--raznos-font); }
    .rtc-verdict em { font-style: normal; color: var(--raznos-green-deep); }
    .rtc-lines { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
    .rtc-lines li { font: 500 13px/1.4 var(--raznos-font); color: var(--raznos-ink-2); }
    .rtc-lines b { color: var(--raznos-ink); font-weight: 700; }
    .rtc-note { margin: 0; font: 500 12px/1.4 var(--raznos-font); color: var(--raznos-ink-3); }
    @media (prefers-reduced-motion: no-preference) {
      .rtc-bar i { transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
    }
  </style>
</helmet>
<sc-if value="{{ is_row }}" hint-placeholder-val="{{ true }}">
  <button type="button" class="rtc-row" onClick="{{ open }}">
    <span class="rtc-row-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M5.5 17l4-8h6l3 8M9.5 9L8 6H6M15.5 9l-3 8h-7"/><path d="M13 3l-1.5 3h2.5l-1.5 3"/></svg></span>
    <span class="rtc-row-main"><b>Свой транспорт или аренда</b><span>{{ row_sub }}</span></span>
    <span class="rtc-row-chev" aria-hidden="true">›</span>
  </button>
</sc-if>
<sc-if value="{{ is_calc }}" hint-placeholder-val="{{ false }}">
<div class="rtc">
  <div class="rtc-inputs">
    <label class="rtc-in"><span>Свой, ₽/нед</span><span class="raznos-field-box"><input inputmode="numeric" value="{{ own_v }}" onChange="{{ set_own }}" aria-label="Свой транспорт, рублей в неделю" /></span></label>
    <label class="rtc-in"><span>Часов/нед</span><span class="raznos-field-box"><input inputmode="numeric" value="{{ hours_v }}" onChange="{{ set_hours }}" aria-label="Часов работы в неделю" /></span></label>
    <label class="rtc-in"><span>Км/нед</span><span class="raznos-field-box"><input inputmode="numeric" value="{{ km_v }}" onChange="{{ set_km }}" aria-label="Километров в неделю" /></span></label>
  </div>
  <p class="rtc-src">{{ src }}</p>
  <div class="rtc-tariffs" role="radiogroup" aria-label="Аренда электровелосипеда">
    <sc-for list="{{ tariffs }}" as="t" hint-placeholder-count="3"><button type="button" class="{{ t.cls }}" role="radio" aria-checked="{{ t.on }}" onClick="{{ t.tap }}"><span>{{ t.title }}<small>{{ t.note }}</small></span><b>{{ t.price }}</b></button></sc-for>
  </div>
  <div class="rtc-result" aria-live="polite">
    <div class="rtc-bars" aria-hidden="true">
      <span class="{{ own_cls }}"><span>Свой</span><i style="{{ own_bar }}"></i><b>{{ own_week }}</b></span>
      <span class="{{ rent_cls }}"><span>Аренда</span><i style="{{ rent_bar }}"></i><b>{{ rent_week }}</b></span>
    </div>
    <p class="rtc-verdict">{{ verdict_a }}<em>{{ verdict_b }}</em>{{ verdict_c }}</p>
    <ul class="rtc-lines">
      <sc-for list="{{ lines }}" as="l" hint-placeholder-count="3"><li>{{ l.a }}<b>{{ l.b }}</b>{{ l.c }}</li></sc-for>
    </ul>
  </div>
  <p class="rtc-note">Цены аренды примерные, Москва, по открытым тарифам прокатов для курьеров. Залог, штрафы за поломку и скидки сервисов не учтены</p>
</div>
</sc-if>
</x-dc><script type="text/x-dc" data-dc-script data-props='{
  "mode": { "editor": "enum", "options": ["row", "calc"], "default": "row" },
  "own": { "editor": "int", "default": 520 },
  "ownSrc": { "editor": "text", "default": "Из Расходов за 4 недели: ремонт и парковка велосипеда. Часы и км из заказов за 4 недели" },
  "hours": { "editor": "int", "default": 44 },
  "km": { "editor": "int", "default": 105 },
  "tariffs": { "editor": null },
  "buyPrice": { "editor": "int", "default": 85000 },
  "onOpen": { "editor": null },
  "$preview": { "width": 360, "height": 620 }
}'>
// пример тарифов для дизайн-системы, в приложении приходят из TRANSPORT_RENT_TARIFFS
const RTC_TARIFFS = [
  { id: 'one', title: 'Электровелосипед', note: 'одна батарея, ТО включено', week: 3500 },
  { id: 'two', title: 'С двумя батареями', note: 'запас хода на всю смену', week: 4400 },
  { id: 'svc', title: 'Через сервис доставки', note: 'партнёрская скидка, нужен статус в сервисе', week: 2500 }
];
const RTC_FMT = (n) => String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
const RTC_NUM = (v, d) => { if (v == null || String(v).trim() === '') return d; const n = Number(String(v).replace(/[^\d]/g, '')); return Number.isFinite(n) ? n : d; };
const RTC_WEEKS = (w) => { const n = Math.ceil(w); const m10 = n % 10, m100 = n % 100; return n + ' ' + (m10 === 1 && m100 !== 11 ? 'неделю' : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? 'недели' : 'недель')); };
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const st = this.state || {};
    const set = (patch) => this.setState(patch);
    const tariffs = Array.isArray(p.tariffs) && p.tariffs.length ? p.tariffs : RTC_TARIFFS;
    const own = RTC_NUM(st.own, p.own != null ? p.own : 520);
    const hours = Math.max(1, RTC_NUM(st.hours, p.hours != null ? p.hours : 44));
    const km = Math.max(1, RTC_NUM(st.km, p.km != null ? p.km : 105));
    const pick = tariffs.find((t) => t.id === st.tariff) || tariffs[0];
    const rent = pick.week;
    const diff = rent - own;
    const month = (n) => Math.round(n * 30.4 / 7 / 100) * 100;
    const max = Math.max(own, rent, 1);
    const buy = p.buyPrice != null ? p.buyPrice : 85000;
    // порог: сколько аренда должна добавить к доходу за час и за км, чтобы окупиться
    const perHour = Math.round(diff / hours), perKm = Math.round(diff / km);
    const lines = diff > 0 ? [
      { a: 'В месяц аренда дороже на ', b: '≈ ' + RTC_FMT(month(diff)), c: '' },
      { a: 'Окупится, если даст ', b: '+ ' + RTC_FMT(perHour) + ' в час', c: ' (+ ' + RTC_FMT(perKm) + ' на км) к вашему доходу' },
      // покупка своего: обслуживание считаем как у вашего транспорта сейчас, без зарядки и продажи потом
      { a: 'Купить свой за ' + RTC_FMT(buy) + ' вместо аренды: окупится за ', b: '≈ ' + RTC_WEEKS(buy / diff), c: '' }
    ] : [
      { a: 'В месяц аренда дешевле на ', b: '≈ ' + RTC_FMT(month(-diff)), c: '' },
      { a: 'Свой обходится в ', b: RTC_FMT(own / hours) + ' в час', c: ', аренда в ' + RTC_FMT(rent / hours) }
    ];
    return {
      is_row: p.mode !== 'calc', is_calc: p.mode === 'calc',
      row_sub: diff > 0 ? 'Аренда электровелосипеда дороже на ' + RTC_FMT(diff) + ' в неделю' : 'Аренда выходит дешевле на ' + RTC_FMT(-diff) + ' в неделю',
      own_v: String(own), hours_v: String(hours), km_v: String(km),
      set_own: (e) => set({ own: e && e.target ? e.target.value : own }),
      set_hours: (e) => set({ hours: e && e.target ? e.target.value : hours }),
      set_km: (e) => set({ km: e && e.target ? e.target.value : km }),
      src: p.ownSrc || 'Из Расходов за 4 недели: ремонт и парковка велосипеда. Часы и км из заказов за 4 недели',
      tariffs: tariffs.map((t) => ({ title: t.title, note: t.note, price: RTC_FMT(t.week) + '/нед', on: t === pick, cls: 'rtc-tariff' + (t === pick ? ' raznos-is-active' : ''), tap: () => set({ tariff: t.id }) })),
      own_week: RTC_FMT(own) + '/нед', rent_week: RTC_FMT(rent) + '/нед',
      own_bar: 'width:' + Math.max(4, Math.round(own * 100 / max)) + '%', rent_bar: 'width:' + Math.max(4, Math.round(rent * 100 / max)) + '%',
      own_cls: 'rtc-bar' + (own <= rent ? ' rtc-is-cheaper' : ''), rent_cls: 'rtc-bar' + (rent < own ? ' rtc-is-cheaper' : ''),
      verdict_a: diff > 0 ? 'Свой дешевле на ' : (diff < 0 ? 'Аренда дешевле на ' : 'Выходит одинаково'),
      verdict_b: diff !== 0 ? RTC_FMT(Math.abs(diff)) : '', verdict_c: diff !== 0 ? ' в неделю' : '',
      lines,
      open: () => { if (p.onOpen) p.onOpen(); }
    };
  }
}
</script></body></html>
